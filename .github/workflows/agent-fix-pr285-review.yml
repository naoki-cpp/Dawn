name: Apply PR 285 review fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: agent-fix-pr285-review
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'agent/validated-game-data-catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/validated-game-data-catalog
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Apply review fixes
        run: python .github/scripts/fix_pr285_review.py

      - name: Validate
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          git diff --check

      - name: Commit validated tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm .github/scripts/fix_pr285_review.py
          rm .github/workflows/agent-fix-pr285-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(game-data): address catalog construction review"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/validated-game-data-catalog
