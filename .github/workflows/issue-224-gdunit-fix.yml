name: Apply issue 224 GdUnit fix

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 231
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Normalize test indentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          test_path = Path("client/test/connection_test.gd")
          lines = test_path.read_text().splitlines()
          normalized = []
          for line in lines:
              leading = len(line) - len(line.lstrip(" "))
              if leading:
                  if leading % 4 != 0:
                      raise SystemExit(f"unexpected indentation: {line!r}")
                  line = "\t" * (leading // 4) + line[leading:]
              normalized.append(line)
          test_path.write_text("\n".join(normalized) + "\n")

          dispatch_path = Path("crates/dawn-client-gdext/src/server_message_gd.rs")
          text = dispatch_path.read_text()
          old = 'godot_error!("typed ServerMessage dispatch target is missing method \'{method}\'");'
          new = 'godot_warn!("typed ServerMessage dispatch target is missing method \'{method}\'");'
          if text.count(old) != 1:
              raise SystemExit(f"expected one dispatch diagnostic, found {text.count(old)}")
          dispatch_path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          rm .github/workflows/issue-224-gdunit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: exercise typed dispatch through GdUnit"
          git push
