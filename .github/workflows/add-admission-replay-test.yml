name: Add admission replay regression

on:
  push:
    branches:
      - agent/transactional-client-admission-253
    paths:
      - .github/workflows/add-admission-replay-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/transactional-client-admission-253
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Add restart replay assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/dawn-sector/src/client_admission.rs')
          text = path.read_text()

          old_start = '''    fn fresh_abort_removes_spawn_ownership_inventory_and_replay_state() {
              let mut node = node();
              let attempt = node
          '''
          new_start = '''    fn fresh_abort_removes_spawn_ownership_inventory_and_replay_state() {
              let mut node = node();
              let empty_snapshot = node.take_snapshot();
              let attempt = node
          '''
          if text.count(old_start) != 1:
              raise SystemExit(f'test start: expected one match, found {text.count(old_start)}')
          text = text.replace(old_start, new_start, 1)

          old_end = '''              assert!(matches!(
                  node.event_store().all_records().last().map(|record| &record.event),
                  Some(dawn_core::DomainEvent::ShipDespawned(event)) if event.ship_id == ship_id
              ));
          }
          '''
          new_end = '''              assert!(matches!(
                  node.event_store().all_records().last().map(|record| &record.event),
                  Some(dawn_core::DomainEvent::ShipDespawned(event)) if event.ship_id == ship_id
              ));

              let mut replay_store = dawn_event_store::InMemoryEventStore::new();
              for record in node.event_store().all_records() {
                  replay_store.append(record.event.clone());
              }
              let restored = SimulationNode::restore_from(
                  replay_store,
                  &empty_snapshot,
                  std::sync::Arc::new(crate::galaxy::Galaxy::demo()),
                  crate::game_data::test_catalog().modules(),
                  crate::game_data::test_catalog().ship_types(),
              );

              assert_eq!(restored.ship_count(), 0);
              assert!(restored.ship_absolute_pos(ship_id).is_none());
          }
          '''
          if text.count(old_end) != 1:
              raise SystemExit(f'test end: expected one match, found {text.count(old_end)}')
          path.write_text(text.replace(old_end, new_end, 1))
          PY
          cargo fmt --all

      - name: Validate replay test
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p dawn-sector client_admission
          cargo test --workspace --all-targets

      - name: Commit test and remove workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/add-admission-replay-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(admission): verify abort survives event replay'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/transactional-client-admission-253
