name: Apply transit attempt receipt fix

on:
  push:
    branches:
      - agent/fix-transit-attempt-receipts

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-transit-attempt-receipts
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply attempt-specific receipt fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          events_path = Path("crates/dawn-core/src/events.rs")
          events = events_path.read_text()
          events = replace_once(
              events,
              """pub struct SectorTransitCompleted {
              pub ship_id: ShipId,
              pub from: SectorId,
              pub to: SectorId,
              /// Authoritative destination-Sector entry position.
          """,
              """pub struct SectorTransitCompleted {
              pub ship_id: ShipId,
              pub from: SectorId,
              pub to: SectorId,
              /// Source-local identity of the Request this completion closes.
              /// Required to correlate repeated transfers of the same Ship over
              /// the same route during replay and delayed-Commit deduplication.
              pub request_tick: Tick,
              /// Authoritative destination-Sector entry position.
          """,
              "SectorTransitCompleted request_tick field",
          )
          events_path.write_text(events)

          flow_path = Path("crates/dawn-sector/src/node/transit_flow.rs")
          flow = flow_path.read_text()
          flow = replace_once(
              flow,
              """
              fn replayed_transit_request_tick(
                  &self,
                  ship_id: ShipId,
                  from: SectorId,
                  to: SectorId,
              ) -> Option<Tick> {
                  self.event_store
                      .iter_from(0)
                      .filter_map(|record| match &record.event {
                          DomainEvent::SectorTransitRequested(event)
                              if event.ship_id == ship_id && event.from == from && event.to == to =>
                          {
                              Some(event.request_tick)
                          }
                          _ => None,
                      })
                      .last()
              }
          """,
              "\n",
              "remove global request-tick lookup",
          )
          flow = replace_once(
              flow,
              """                ship_id: ship.ship_id,
                              from: self.sector_id,
                              to,
                              entry_pos: entry_pos_abs,
          """,
              """                ship_id: ship.ship_id,
                              from: self.sector_id,
                              to,
                              request_tick,
                              entry_pos: entry_pos_abs,
          """,
              "source completion request_tick",
          )
          flow = replace_once(
              flow,
              """                ship_id: ship.ship_id,
                              from,
                              to: self.sector_id,
                              entry_pos: entry_pos_abs,
          """,
              """                ship_id: ship.ship_id,
                              from,
                              to: self.sector_id,
                              request_tick,
                              entry_pos: entry_pos_abs,
          """,
              "destination completion request_tick",
          )
          flow = replace_once(
              flow,
              """            if let Some(request_tick) = self.replayed_transit_request_tick(e.ship_id, e.from, e.to)
                          {
                              self.record_completed_incoming_transit(e.ship_id, e.from, e.to, request_tick);
                          }
          """,
              """            self.record_completed_incoming_transit(
                              e.ship_id,
                              e.from,
                              e.to,
                              e.request_tick,
                          );
          """,
              "replay receipt request_tick",
          )
          flow_path.write_text(flow)

          pipeline_path = Path("crates/dawn-sector/src/transit/pipeline.rs")
          pipeline = pipeline_path.read_text()
          pipeline = replace_once(
              pipeline,
              """            DomainEvent::SectorTransitCompleted(event)
                              if marker_seen
                                  && event.ship_id == ship_id
                                  && event.from == from
                                  && event.to == to =>
          """,
              """            DomainEvent::SectorTransitCompleted(event)
                              if marker_seen
                                  && event.ship_id == ship_id
                                  && event.from == from
                                  && event.to == to
                                  && event.request_tick == request_tick =>
          """,
              "attempt-specific hot-log receipt match",
          )

          pipeline = replace_once(
              pipeline,
              """    use super::*;
              use dawn_core::{NodeId, SectorBounds, ShipTypeId, Velocity};
          """,
              """    use super::*;
              use dawn_core::events::{
                  SectorTransitCompleted, SectorTransitRequested, TransitShipState,
              };
              use dawn_core::{NodeId, SectorBounds, ShipTypeId, Velocity};
              use dawn_event_store::InMemoryEventStore;
          """,
              "pipeline test imports",
          )

          regression = r'''

              fn test_ship(ship_id: ShipId) -> ShipSnapshot {
                  ShipSnapshot {
                      ship_id,
                      ship_type_id: ShipTypeId(1),
                      absolute_position: None,
                      position: Position::ORIGIN,
                      anchor: dawn_core::AnchorId(0),
                      velocity: Velocity::ZERO,
                      current_shield: 100.0,
                      current_armor: 100.0,
                      current_hull: 100.0,
                      is_destroyed: false,
                      capacitor: Some(100.0),
                      fitting: dawn_core::fitting::FittingSnapshot::empty(),
                      tackled_by: Vec::new(),
                      inventory: std::collections::BTreeMap::new(),
                  }
              }

              fn transit_state() -> TransitShipState {
                  TransitShipState {
                      ship_type_id: ShipTypeId(1),
                      current_shield: 100.0,
                      current_armor: 100.0,
                      current_hull: 100.0,
                      is_destroyed: false,
                      capacitor: Some(100.0),
                      fitting: dawn_core::fitting::FittingSnapshot::empty(),
                      inventory: std::collections::BTreeMap::new(),
                  }
              }

              fn requested(
                  ship_id: ShipId,
                  from: SectorId,
                  to: SectorId,
                  request_tick: u64,
                  event_tick: u64,
              ) -> DomainEvent {
                  DomainEvent::SectorTransitRequested(SectorTransitRequested {
                      ship_id,
                      from,
                      to,
                      request_tick: Tick(request_tick),
                      gate_id: None,
                      entry_pos: Position::ORIGIN,
                      entry_pos_abs: AbsolutePosition::ORIGIN,
                      tick: Tick(event_tick),
                  })
              }

              fn completed(
                  ship_id: ShipId,
                  from: SectorId,
                  to: SectorId,
                  request_tick: u64,
                  event_tick: u64,
              ) -> DomainEvent {
                  DomainEvent::SectorTransitCompleted(SectorTransitCompleted {
                      ship_id,
                      from,
                      to,
                      request_tick: Tick(request_tick),
                      entry_pos: AbsolutePosition::ORIGIN,
                      velocity: Velocity::ZERO,
                      tick: Tick(event_tick),
                      ship_state: transit_state(),
                  })
              }

              #[test]
              fn repeated_same_route_replay_preserves_each_attempt_receipt_after_checkpoint() {
                  let destination = node(1);
                  let snapshot_before = destination.take_snapshot();
                  let ship_id = ShipId::new(NodeId(0), 7);
                  let mut store = InMemoryEventStore::new();

                  // A -> B -> A -> B -> A in one post-snapshot tail. The two
                  // A -> B attempts must retain distinct source-local identities.
                  for event in [
                      requested(ship_id, SectorId(0), SectorId(1), 10, 1),
                      completed(ship_id, SectorId(0), SectorId(1), 10, 1),
                      requested(ship_id, SectorId(1), SectorId(0), 20, 2),
                      completed(ship_id, SectorId(1), SectorId(0), 20, 2),
                      requested(ship_id, SectorId(0), SectorId(1), 30, 3),
                      completed(ship_id, SectorId(0), SectorId(1), 30, 3),
                      requested(ship_id, SectorId(1), SectorId(0), 40, 4),
                      completed(ship_id, SectorId(1), SectorId(0), 40, 4),
                  ] {
                      store.append(event);
                  }

                  let restored =
                      SimulationNode::restore_from(store, &snapshot_before, &[], &[]);
                  assert!(restored.get_ship_position(ship_id).is_none());

                  let checkpoint = restored.take_snapshot();
                  for request_tick in [Tick(10), Tick(30)] {
                      assert!(
                          checkpoint.completed_incoming_transits.contains(
                              &crate::persistence::CompletedIncomingTransit {
                                  ship_id,
                                  from: SectorId(0),
                                  to: SectorId(1),
                                  request_tick,
                              }
                          ),
                          "missing durable receipt for A -> B attempt {request_tick:?}"
                      );
                  }

                  // Simulate compaction: only the checkpoint survives. A delayed
                  // Commit from the first attempt must produce Ack only, never
                  // resurrecting the Ship after it has already left B again.
                  let mut compacted = SimulationNode::restore_from(
                      InMemoryEventStore::new(),
                      &checkpoint,
                      &[],
                      &[],
                  );
                  let events_before = compacted.total_event_count();
                  let ack = apply_commit(
                      &mut compacted,
                      &test_ship(ship_id),
                      SectorId(0),
                      SectorId(1),
                      Position::ORIGIN,
                      AbsolutePosition::ORIGIN,
                      None,
                      Tick(10),
                  );

                  assert!(ack.is_some());
                  assert!(compacted.get_ship_position(ship_id).is_none());
                  assert_eq!(compacted.total_event_count(), events_before);
              }
          '''
          marker = "repeated_same_route_replay_preserves_each_attempt_receipt_after_checkpoint"
          if marker in pipeline:
              raise SystemExit("regression test already present")
          end = pipeline.rfind("\n}")
          if end == -1:
              raise SystemExit("pipeline tests module closing brace not found")
          pipeline = pipeline[:end] + regression + pipeline[end:]
          pipeline_path.write_text(pipeline)

          # Update every remaining Rust struct literal used by older tests. The
          # two live constructors above already carry the real request_tick.
          for path in Path("crates").rglob("*.rs"):
              text = path.read_text()
              cursor = 0
              changed = False
              while True:
                  start = text.find("SectorTransitCompleted {", cursor)
                  if start == -1:
                      break
                  brace = text.find("{", start)
                  depth = 0
                  end = None
                  for i in range(brace, len(text)):
                      if text[i] == "{":
                          depth += 1
                      elif text[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  if end is None:
                      raise SystemExit(f"unclosed SectorTransitCompleted block in {path}")
                  block = text[start:end]
                  before = text[max(0, start - 20):start]
                  if (
                      "pub struct" not in before
                      and "request_tick" not in block
                      and "entry_pos:" in block
                      and "velocity:" in block
                      and "ship_state:" in block
                      and ".." not in block
                  ):
                      match = re.search(r"(?m)^(\s*)entry_pos:", block)
                      if not match:
                          raise SystemExit(f"entry_pos line not found in {path}")
                      insert_at = start + match.start()
                      indent = match.group(1)
                      text = (
                          text[:insert_at]
                          + f"{indent}request_tick: dawn_core::Tick::ZERO,\n"
                          + text[insert_at:]
                      )
                      delta = len(indent) + len("request_tick: dawn_core::Tick::ZERO,\n")
                      end += delta
                      changed = True
                  cursor = end
              if changed:
                  path.write_text(text)

          catalog_path = Path("docs/architecture/event-catalog.md")
          catalog = catalog_path.read_text()
          catalog = catalog.replace(
              "| `SectorTransitCompleted` | Destination completed the import, or source removed its recovery copy after Ack |",
              "| `SectorTransitCompleted` | Destination completed the import, or source removed its recovery copy after Ack; carries the source-local `request_tick` for attempt-specific replay and deduplication |",
          )
          catalog = catalog.replace(
              "Commit materializes the destination and durably records completion using a destination-local event `tick`; Ack removes the source recovery copy.",
              "Commit materializes the destination and durably records completion using the source-local `request_tick` plus a destination-local event `tick`; Ack removes the source recovery copy.",
          )
          catalog_path.write_text(catalog)
          PY

          cargo fmt --all
          cargo check --workspace
          cargo test -p dawn-sector repeated_same_route_replay_preserves_each_attempt_receipt_after_checkpoint
          git diff --check

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/dawn-core/src/events.rs \
                  crates/dawn-sector/src/node/transit_flow.rs \
                  crates/dawn-sector/src/transit/pipeline.rs \
                  docs/architecture/event-catalog.md
          git add crates
          git commit -m "fix(sector): correlate transit receipts by attempt"
          git push origin HEAD:agent/fix-transit-attempt-receipts
