name: Issue 251 module owner fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/issue-251-module-owner-fix.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.head_ref == 'issue-251-client-fact-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-251-client-fact-policy
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Apply module ownership fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/dawn-client-core/src/client_state.rs")
          text = path.read_text()

          old = '''                if ship_id == self.session.player_ship_id() {
                    if let Some(loadout) = self.loadout.as_mut() {
                        loadout.apply_module_activation(module_id, active, forced_reason);
                    }
                }
'''
          new = '''                if let Some(loadout) = self.loadout.as_mut() {
                    let belongs_to_loadout = u64::try_from(ship_id)
                        .ok()
                        .is_some_and(|ship_id| loadout.active_ship_id == Some(ship_id));
                    if belongs_to_loadout {
                        loadout.apply_module_activation(module_id, active, forced_reason);
                    }
                }
'''
          assert text.count(old) == 1, "module ownership block changed"
          text = text.replace(old, new)

          old = '''        let mut loadout = Some(PlayerLoadoutMsg {
            modules: vec![module(7, false)],
            ..PlayerLoadoutMsg::default()
        });

        ClientState::new(&mut session, &mut loadout)
            .apply(ClientFact::ModuleActivation {
                ship_id: 1,
'''
          new = '''        let mut loadout = Some(PlayerLoadoutMsg {
            active_ship_id: Some(1),
            modules: vec![module(7, false)],
            ..PlayerLoadoutMsg::default()
        });

        ClientState::new(&mut session, &mut loadout)
            .apply(ClientFact::ModuleActivation {
                ship_id: 1,
'''
          assert text.count(old) == 1, "player module activation fixture changed"
          text = text.replace(old, new)

          marker = '''    #[test]
    fn system_change_updates_only_the_player_system() {
'''
          tests = '''    #[test]
    fn known_active_ship_switch_routes_module_events_to_new_loadout_owner() {
        let (mut session, mut loadout) = setup();
        ClientState::new(&mut session, &mut loadout)
            .apply(ClientFact::PlayerLoadout(PlayerLoadoutMsg {
                active_ship_id: Some(2),
                modules: vec![module(7, false)],
                ..PlayerLoadoutMsg::default()
            }))
            .unwrap();
        assert_eq!(session.player_ship_id(), 2);

        ClientState::new(&mut session, &mut loadout)
            .apply(ClientFact::ModuleActivation {
                ship_id: 1,
                module_id: 7,
                active: true,
                forced_reason: "old ship".to_owned(),
            })
            .unwrap();
        let row = &loadout.as_ref().unwrap().modules[0];
        assert!(!row.is_active);
        assert_eq!(row.cycle_remaining, 7);
        assert!(row.forced_reason.is_empty());

        ClientState::new(&mut session, &mut loadout)
            .apply(ClientFact::ModuleActivation {
                ship_id: 2,
                module_id: 7,
                active: true,
                forced_reason: String::new(),
            })
            .unwrap();
        let row = &loadout.as_ref().unwrap().modules[0];
        assert!(row.is_active);
        assert_eq!(row.cycle_remaining, 0);
    }

    #[test]
    fn unknown_active_ship_switch_uses_loadout_owner_for_module_events() {
        let (mut session, mut loadout) = setup();
        ClientState::new(&mut session, &mut loadout)
            .apply(ClientFact::PlayerLoadout(PlayerLoadoutMsg {
                active_ship_id: Some(33),
                modules: vec![module(7, false)],
                ..PlayerLoadoutMsg::default()
            }))
            .unwrap();
        assert_eq!(session.player_ship_id(), 1);
        assert_eq!(loadout.as_ref().unwrap().active_ship_id, Some(33));

        ClientState::new(&mut session, &mut loadout)
            .apply(ClientFact::ModuleActivation {
                ship_id: 1,
                module_id: 7,
                active: true,
                forced_reason: "old ship".to_owned(),
            })
            .unwrap();
        let row = &loadout.as_ref().unwrap().modules[0];
        assert!(!row.is_active);
        assert_eq!(row.cycle_remaining, 7);
        assert!(row.forced_reason.is_empty());

        ClientState::new(&mut session, &mut loadout)
            .apply(ClientFact::ModuleActivation {
                ship_id: 33,
                module_id: 7,
                active: true,
                forced_reason: String::new(),
            })
            .unwrap();
        let row = &loadout.as_ref().unwrap().modules[0];
        assert!(row.is_active);
        assert_eq!(row.cycle_remaining, 0);
    }

'''
          assert text.count(marker) == 1, "test insertion point changed"
          text = text.replace(marker, tests + marker)
          path.write_text(text)
          PY
          cargo fmt --all

      - name: Test workspace
        run: |
          cargo test -p dawn-client-core client_state
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo fmt --all -- --check

      - name: Publish tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          path='crates/dawn-client-core/src/client_state.rs'
          branch='issue-251-client-fact-policy'
          sha=$(gh api "repos/naoki-cpp/Dawn/contents/${path}?ref=${branch}" --jq .sha)
          content=$(base64 -w0 "$path")
          jq -n \
            --arg message 'fix(client): bind module events to loadout owner' \
            --arg content "$content" \
            --arg sha "$sha" \
            --arg branch "$branch" \
            '{message: $message, content: $content, sha: $sha, branch: $branch}' \
            | gh api --method PUT "repos/naoki-cpp/Dawn/contents/${path}" --input -
