name: Issue 234 implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/reject-missing-observers'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/reject-missing-observers
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Apply and verify issue 234
        run: |
          python3 tools/issue234_apply.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p dawn-sector
          cargo test -p dawn-sector-node
          cargo test -p dawn-simulation serve
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Publish verified changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm tools/issue234_apply.py
          rm .github/workflows/issue-234-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject missing observers during client handoff"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:${GITHUB_HEAD_REF}"
