name: Apply issue 199 implementation

on:
  push:
    branches:
      - agent/centralize-sector-map

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'refactor(sector): centralize SectorMap construction' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/centralize-sector-map
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Apply refactor and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          sector_map_path = Path('crates/dawn-sector/src/node/sector_map.rs')
          sector_map = sector_map_path.read_text()
          old_import = '''use dawn_core::{
              CelestialBodyDef, CelestialBodyId, JumpGateDef, JumpGateId, StationDef, StationId,
          };
          '''
          new_import = '''use dawn_core::{
              CelestialBodyDef, CelestialBodyId, JumpGateDef, JumpGateId, SectorId, StationDef,
              StationId,
          };
          '''
          if sector_map.count(old_import) != 1:
              raise SystemExit('SectorMap import anchor not found exactly once')
          sector_map = sector_map.replace(old_import, new_import, 1)

          impl_block = '''

          impl SectorMap {
              /// Project one Sector's static topology from the shared Galaxy value.
              pub(super) fn from_galaxy(sector_id: SectorId, galaxy: Arc<Galaxy>) -> Self {
                  let gates = galaxy
                      .gates_in_sector(sector_id)
                      .into_iter()
                      .map(|gate| (gate.id, gate))
                      .collect();
                  let bodies = galaxy
                      .bodies_in_sector(sector_id)
                      .into_iter()
                      .map(|body| (body.id, body))
                      .collect();
                  let stations = galaxy
                      .stations_in_sector(sector_id)
                      .into_iter()
                      .map(|station| (station.id, station))
                      .collect();

                  Self {
                      galaxy,
                      gates,
                      bodies,
                      stations,
                  }
              }
          }
          '''
          if 'impl SectorMap {' in sector_map:
              raise SystemExit('SectorMap impl already exists')
          sector_map = sector_map.rstrip() + impl_block
          sector_map_path.write_text(sector_map)

          node_path = Path('crates/dawn-sector/src/node/mod.rs')
          node = node_path.read_text()

          constructor_anchor = '''    ) -> Self {
                  Self {
                      node_id,
          '''
          constructor_replacement = '''    ) -> Self {
                  let galaxy = Arc::new(crate::galaxy::Galaxy::demo());
                  let sector_map = SectorMap::from_galaxy(sector_id, Arc::clone(&galaxy));
                  let anchor_table = crate::anchor::AnchorTable::from_galaxy(&galaxy);

                  Self {
                      node_id,
          '''
          if node.count(constructor_anchor) != 1:
              raise SystemExit('with_store constructor anchor not found exactly once')
          node = node.replace(constructor_anchor, constructor_replacement, 1)

          old_fields = '''            pending_bot_lock_commands: Vec::new(),
                      sector_map: {
                          let sm = Arc::new(crate::galaxy::Galaxy::demo());
                          SectorMap {
                              gates: sm
                                  .gates_in_sector(sector_id)
                                  .into_iter()
                                  .map(|g| (g.id, g))
                                  .collect(),
                              bodies: sm
                                  .bodies_in_sector(sector_id)
                                  .into_iter()
                                  .map(|b| (b.id, b))
                                  .collect(),
                              stations: sm
                                  .stations_in_sector(sector_id)
                                  .into_iter()
                                  .map(|s| (s.id, s))
                                  .collect(),
                              galaxy: sm,
                          }
                      },
                      anchor_table: crate::anchor::AnchorTable::from_galaxy(&crate::galaxy::Galaxy::demo()),
          '''
          new_fields = '''            pending_bot_lock_commands: Vec::new(),
                      sector_map,
                      anchor_table,
          '''
          if node.count(old_fields) != 1:
              raise SystemExit('constructor SectorMap fields not found exactly once')
          node = node.replace(old_fields, new_fields, 1)

          old_set = '''    pub fn set_galaxy(&mut self, map: Arc<crate::galaxy::Galaxy>) {
                  let sid = self.sector_id;
                  self.sector_map.gates = map
                      .gates_in_sector(sid)
                      .into_iter()
                      .map(|g| (g.id, g))
                      .collect();
                  self.sector_map.bodies = map
                      .bodies_in_sector(sid)
                      .into_iter()
                      .map(|b| (b.id, b))
                      .collect();
                  self.sector_map.stations = map
                      .stations_in_sector(sid)
                      .into_iter()
                      .map(|s| (s.id, s))
                      .collect();
                  self.anchor_table = crate::anchor::AnchorTable::from_galaxy(&map);
                  self.sector_map.galaxy = map;
              }
          '''
          new_set = '''    pub fn set_galaxy(&mut self, galaxy: Arc<crate::galaxy::Galaxy>) {
                  let anchor_table = crate::anchor::AnchorTable::from_galaxy(&galaxy);
                  let sector_map = SectorMap::from_galaxy(self.sector_id, galaxy);
                  self.sector_map = sector_map;
                  self.anchor_table = anchor_table;
              }
          '''
          if node.count(old_set) != 1:
              raise SystemExit('set_galaxy body not found exactly once')
          node = node.replace(old_set, new_set, 1)

          test_anchor = '''    fn mem_node() -> SimulationNode {
                  SimulationNode::new(
                      NodeId(0),
                      SectorId(0),
                      SectorBounds::centered(SectorBounds::DEFAULT_HALF),
                  )
              }
          '''
          test_block = test_anchor + '''
              #[test]
              fn set_galaxy_rebuilds_all_sector_projections_and_anchors_from_one_value() {
                  let sector_id = SectorId(7);
                  let other_sector = SectorId(8);
                  let local_body = dawn_core::CelestialBodyDef {
                      id: dawn_core::CelestialBodyId(70),
                      sector: sector_id,
                      kind: dawn_core::CelestialBodyKind::Star,
                      name: "Local Star".to_string(),
                      position: Position::new(10.0, 20.0, 30.0),
                      abs_m: dawn_core::AbsolutePosition::new(10.0, 20.0, 30.0),
                      radius: 1000.0,
                      spectral_type: 0.5,
                  };
                  let remote_body = dawn_core::CelestialBodyDef {
                      id: dawn_core::CelestialBodyId(80),
                      sector: other_sector,
                      kind: dawn_core::CelestialBodyKind::Planet,
                      name: "Remote Planet".to_string(),
                      position: Position::new(40.0, 50.0, 60.0),
                      abs_m: dawn_core::AbsolutePosition::new(40.0, 50.0, 60.0),
                      radius: 500.0,
                      spectral_type: 0.0,
                  };
                  let galaxy = Arc::new(crate::galaxy::Galaxy::new(
                      vec![dawn_core::StarSystemDef {
                          id: dawn_core::StarSystemId(7),
                          name: "Replacement".to_string(),
                          sectors: vec![sector_id, other_sector],
                      }],
                      vec![
                          JumpGateDef {
                              id: JumpGateId(70),
                              from_sector: sector_id,
                              position: Position::new(100.0, 0.0, 0.0),
                              abs_m: dawn_core::AbsolutePosition::new(100.0, 0.0, 0.0),
                              to_sector: other_sector,
                              activation_radius: 2000.0,
                          },
                          JumpGateDef {
                              id: JumpGateId(80),
                              from_sector: other_sector,
                              position: Position::new(200.0, 0.0, 0.0),
                              abs_m: dawn_core::AbsolutePosition::new(200.0, 0.0, 0.0),
                              to_sector: sector_id,
                              activation_radius: 2000.0,
                          },
                      ],
                      vec![local_body.clone(), remote_body.clone()],
                      vec![
                          StationDef {
                              id: StationId(70),
                              sector: sector_id,
                              name: "Local Station".to_string(),
                              position: Position::new(300.0, 0.0, 0.0),
                              abs_m: dawn_core::AbsolutePosition::new(300.0, 0.0, 0.0),
                              docking_radius: 1000.0,
                          },
                          StationDef {
                              id: StationId(80),
                              sector: other_sector,
                              name: "Remote Station".to_string(),
                              position: Position::new(400.0, 0.0, 0.0),
                              abs_m: dawn_core::AbsolutePosition::new(400.0, 0.0, 0.0),
                              docking_radius: 1000.0,
                          },
                      ],
                  ));

                  let mut node = SimulationNode::new(
                      NodeId(7),
                      sector_id,
                      SectorBounds::centered(SectorBounds::DEFAULT_HALF),
                  );
                  node.set_galaxy(Arc::clone(&galaxy));

                  assert!(Arc::ptr_eq(&node.sector_map.galaxy, &galaxy));
                  assert_eq!(
                      node.sector_map.gates,
                      galaxy
                          .gates_in_sector(sector_id)
                          .into_iter()
                          .map(|gate| (gate.id, gate))
                          .collect()
                  );
                  assert_eq!(
                      node.sector_map.bodies,
                      galaxy
                          .bodies_in_sector(sector_id)
                          .into_iter()
                          .map(|body| (body.id, body))
                          .collect()
                  );
                  assert_eq!(
                      node.sector_map.stations,
                      galaxy
                          .stations_in_sector(sector_id)
                          .into_iter()
                          .map(|station| (station.id, station))
                          .collect()
                  );

                  for body in &galaxy.bodies {
                      assert_eq!(
                          node.anchor_table.abs(dawn_core::AnchorId::from(body.id)),
                          Some(body.abs_m)
                      );
                  }
                  assert!(node.anchor_table.abs(dawn_core::AnchorId(0)).is_none());
              }
          '''
          if node.count(test_anchor) != 1:
              raise SystemExit('node test anchor not found exactly once')
          node = node.replace(test_anchor, test_block, 1)
          node_path.write_text(node)
          PY

      - name: Format and validate
        run: |
          cargo fmt --all
          cargo test -p dawn-sector set_galaxy_rebuilds_all_sector_projections_and_anchors_from_one_value
          cargo clippy -p dawn-sector --all-targets -- -D warnings

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dawn-sector/src/node/sector_map.rs crates/dawn-sector/src/node/mod.rs
          git commit -m "refactor(sector): centralize SectorMap construction"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/centralize-sector-map
