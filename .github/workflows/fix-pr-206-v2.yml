name: Apply PR 206 review fixes v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: recoverable-sector-transit

      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label}: source pattern not found')
              return text.replace(old, new, 1)

          def replace_regex(text: str, pattern: str, new: str, label: str) -> str:
              updated, count = re.subn(pattern, new, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{label}: expected one structural match, found {count}')
              return updated

          # Reuse the broad protocol/docs changes from the first workflow as a
          # data script, but let stale whitespace-only replacements fall through.
          source = Path('.github/workflows/fix-pr-206.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          script = script.replace(
              '''def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              p.write_text(text.replace(old, new, 1))
          ''',
              '''def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0:
                  print(f"{path}: skipped stale exact replacement")
                  return
              if count != 1:
                  raise SystemExit(f"{path}: expected at most one exact match, found {count}")
              p.write_text(text.replace(old, new, 1))
          ''',
              1,
          )
          script = script.replace(
              '''def replace_n(path: str, old: str, new: str, expected: int) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} exact matches, found {count}")
              p.write_text(text.replace(old, new))
          ''',
              '''def replace_n(path: str, old: str, new: str, expected: int) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0:
                  print(f"{path}: skipped stale repeated replacement")
                  return
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} exact matches, found {count}")
              p.write_text(text.replace(old, new))
          ''',
              1,
          )
          exec(compile(script, 'fix-pr-206.py', 'exec'))

          # Source-side route authority and bounded retry scheduling.
          path = Path('crates/dawn-sector/src/node/transit_flow.rs')
          tf = path.read_text()
          tf = replace_once(
              tf,
              '    DawnError, DomainEvent, JumpGateId, Position, SectorId, ShipId, ShipTypeId,\n',
              '    DawnError, DomainEvent, JumpGateId, Position, SectorId, ShipId, ShipTypeId, Tick,\n',
              'Tick import',
          )
          if 'struct TransitRetryComp' not in tf:
              tf = replace_regex(
                  tf,
                  r'#\[derive\(Debug\)\]\npub struct TransitCommitData \{.*?^\}',
                  '''#[derive(Debug)]
          pub struct TransitCommitData {
              pub ship: Box<ShipSnapshot>,
              pub entry_pos: Position,
              pub entry_pos_abs: dawn_core::AbsolutePosition,
              pub request_tick: Tick,
          }

          const TRANSIT_RETRY_INITIAL_TICKS: u64 = 10;
          const TRANSIT_RETRY_MAX_TICKS: u64 = 160;

          /// Process-local retry scheduling. The durable request and route live
          /// in EventStore; restart intentionally causes one immediate retry.
          #[derive(Debug, Clone, Copy)]
          struct TransitRetryComp {
              request_tick: Tick,
              next_retry_tick: Tick,
              backoff_ticks: u64,
          }''',
                  'TransitCommitData',
              )
          tf = replace_regex(
              tf,
              r'    pub\(super\) fn propose_transit\(&mut self, cmd: TransitCommand\) -> Result<\(\), DawnError> \{.*?^    \}\n\n    /// Whether',
              '''    pub(super) fn propose_transit(&mut self, cmd: TransitCommand) -> Result<(), DawnError> {
              self.propose_transit_with_route(
                  cmd,
                  None,
                  Position::ORIGIN,
                  dawn_core::AbsolutePosition::ORIGIN,
              )
              .map(|_| ())
          }

          fn propose_transit_with_route(
              &mut self,
              cmd: TransitCommand,
              gate_id: Option<JumpGateId>,
              entry_pos: Position,
              entry_pos_abs: dawn_core::AbsolutePosition,
          ) -> Result<Tick, DawnError> {
              let &entity = self
                  .ships
                  .index
                  .get(&cmd.ship_id)
                  .ok_or(DawnError::ShipNotFound(cmd.ship_id))?;

              if self.world.transit_state(entity).is_in_transit() {
                  return Err(DawnError::ShipInTransit(cmd.ship_id));
              }

              self.world
                  .set_transit_state(entity, TransitState::InTransit { to: cmd.to });
              let request_tick = self.current_tick;
              self.event_store.append(DomainEvent::SectorTransitRequested(
                  SectorTransitRequested {
                      ship_id: cmd.ship_id,
                      from: self.sector_id,
                      to: cmd.to,
                      request_tick,
                      gate_id,
                      entry_pos,
                      entry_pos_abs,
                      tick: self.current_tick,
                  },
              ));
              Ok(request_tick)
          }

          /// Whether''',
              'propose_transit_with_route',
          )
          tf = replace_regex(
              tf,
              r'    pub fn prepare_transit_commit\(\n        &mut self,\n        ship_id: ShipId,\n        to: SectorId,\n        gate_id: Option<JumpGateId>,\n    \) -> Option<TransitCommitData> \{.*?^    \}\n\n    /// Append `JumpGateUsed`',
              '''    pub fn prepare_transit_commit(
              &mut self,
              ship_id: ShipId,
              to: SectorId,
              gate_id: Option<JumpGateId>,
          ) -> Option<TransitCommitData> {
              let arrival_gate = gate_id.and_then(|_| {
                  self.galaxy()
                      .gates_in_sector(to)
                      .into_iter()
                      .find(|gate| gate.to_sector == self.sector_id())
              });
              let entry_pos = arrival_gate.map(|gate| gate.position).unwrap_or(Position::ORIGIN);
              let entry_pos_abs = arrival_gate
                  .map(|gate| gate.abs_m)
                  .unwrap_or(dawn_core::AbsolutePosition::ORIGIN);
              let request_tick = self
                  .propose_transit_with_route(
                      TransitCommand { ship_id, to },
                      gate_id,
                      entry_pos,
                      entry_pos_abs,
                  )
                  .ok()?;
              let ship = self.snapshot_for_transit(ship_id)?;
              Some(TransitCommitData {
                  ship: Box::new(ship),
                  entry_pos,
                  entry_pos_abs,
                  request_tick,
              })
          }

          /// Append `JumpGateUsed`''',
              'prepare_transit_commit',
          )
          if 'pub(crate) fn transit_commit_retry_due' not in tf:
              tf = replace_once(
                  tf,
                  '''        Some(snapshot)
              }

              /// Stage 1.5 of a Sector Transit''',
                  '''        Some(snapshot)
              }

              pub(crate) fn transit_commit_retry_due(
                  &self,
                  ship_id: ShipId,
                  request_tick: Tick,
              ) -> bool {
                  let Some(&entity) = self.ships.index.get(&ship_id) else {
                      return false;
                  };
                  self.world
                      .get::<TransitRetryComp>(entity)
                      .map(|state| {
                          state.request_tick != request_tick
                              || self.current_tick >= state.next_retry_tick
                      })
                      .unwrap_or(true)
              }

              pub(crate) fn note_transit_commit_proposed(
                  &mut self,
                  ship_id: ShipId,
                  request_tick: Tick,
              ) {
                  let Some(&entity) = self.ships.index.get(&ship_id) else {
                      return;
                  };
                  let existing = self
                      .world
                      .get::<TransitRetryComp>(entity)
                      .map(|state| *state);
                  let delay = existing
                      .filter(|state| state.request_tick == request_tick)
                      .map(|state| {
                          state
                              .backoff_ticks
                              .saturating_mul(2)
                              .min(TRANSIT_RETRY_MAX_TICKS)
                      })
                      .unwrap_or(TRANSIT_RETRY_INITIAL_TICKS);
                  let _ = self.world.remove_one::<TransitRetryComp>(entity);
                  let _ = self.world.insert_one(
                      entity,
                      TransitRetryComp {
                          request_tick,
                          next_retry_tick: Tick(
                              self.current_tick.value().saturating_add(delay),
                          ),
                          backoff_ticks: delay,
                      },
                  );
              }

              /// Stage 1.5 of a Sector Transit''',
                  'retry methods',
              )
          path.write_text(tf)

          # Destination-local marker Tick and complete lock/tackle freeze.
          path = Path('crates/dawn-sector/src/node/tick.rs')
          tick = path.read_text()
          tick = replace_once(
              tick,
              '        ApproachComp, CapacitorComp, FittingComp, KeepAtRangeComp, LockComp, OrbitComp, WarpComp,\n',
              '        ApproachComp, CapacitorComp, FittingComp, KeepAtRangeComp, LockComp, OrbitComp,\n        TackledComp, WarpComp,\n',
              'TackledComp import',
          )
          tick = replace_regex(
              tick,
              r'struct FrozenTransitComponents \{.*?^\}',
              '''struct FrozenTransitComponents {
              entity: Entity,
              capacitor: Option<CapacitorComp>,
              fitting: Option<FittingComp>,
              tackled: Option<TackledComp>,
              warp: Option<WarpComp>,
              approach: Option<ApproachComp>,
              orbit: Option<OrbitComp>,
              keep_at_range: Option<KeepAtRangeComp>,
          }''',
              'FrozenTransitComponents',
          )
          tick = replace_regex(
              tick,
              r'    pub\(crate\) fn append_incoming_transit_marker\(.*?^    \}\n\n    fn freeze_transit_components',
              '''    pub(crate) fn append_incoming_transit_marker(
              &mut self,
              ship_id: ShipId,
              from: dawn_core::SectorId,
              to: dawn_core::SectorId,
              request_tick: dawn_core::Tick,
              gate_id: Option<dawn_core::JumpGateId>,
              entry_pos: dawn_core::Position,
              entry_pos_abs: dawn_core::AbsolutePosition,
          ) {
              self.event_store.append(DomainEvent::SectorTransitRequested(
                  dawn_core::events::SectorTransitRequested {
                      ship_id,
                      from,
                      to,
                      request_tick,
                      gate_id,
                      entry_pos,
                      entry_pos_abs,
                      tick: self.current_tick,
                  },
              ));
          }

          fn freeze_transit_components''',
              'incoming marker',
          )
          tick = replace_regex(
              tick,
              r'    fn freeze_transit_components\(&mut self\) -> .*?^    \}\n\n    fn restore_transit_components.*?^    \}\n',
              '''    fn freeze_transit_components(
              &mut self,
          ) -> (
              HashSet<ShipId>,
              Vec<FrozenTransitComponents>,
              Vec<(Entity, LockComp)>,
          ) {
              let transit: Vec<(ShipId, Entity)> = self
                  .ships
                  .index
                  .iter()
                  .filter_map(|(&ship_id, &entity)| {
                      self.world
                          .transit_state(entity)
                          .is_in_transit()
                          .then_some((ship_id, entity))
                  })
                  .collect();
              let ids: HashSet<_> = transit.iter().map(|(ship_id, _)| *ship_id).collect();
              let related_locks = self
                  .ships
                  .index
                  .iter()
                  .filter_map(|(&ship_id, &entity)| {
                      let lock = self.world.get::<LockComp>(entity)?;
                      (ids.contains(&ship_id)
                          || lock.entries.iter().any(|entry| ids.contains(&entry.target_id)))
                      .then(|| (entity, (*lock).clone()))
                  })
                  .collect();
              let components = transit
                  .into_iter()
                  .map(|(_, entity)| FrozenTransitComponents {
                      entity,
                      capacitor: self.world.remove_one::<CapacitorComp>(entity),
                      fitting: self.world.remove_one::<FittingComp>(entity),
                      tackled: self.world.remove_one::<TackledComp>(entity),
                      warp: self.world.remove_one::<WarpComp>(entity),
                      approach: self.world.remove_one::<ApproachComp>(entity),
                      orbit: self.world.remove_one::<OrbitComp>(entity),
                      keep_at_range: self.world.remove_one::<KeepAtRangeComp>(entity),
                  })
                  .collect();
              (ids, components, related_locks)
          }

          fn restore_transit_components(
              &mut self,
              frozen: Vec<FrozenTransitComponents>,
              related_locks: Vec<(Entity, LockComp)>,
          ) {
              for frozen in frozen {
                  if let Some(component) = frozen.capacitor {
                      let _ = self.world.insert_one(frozen.entity, component);
                  }
                  if let Some(component) = frozen.fitting {
                      let _ = self.world.insert_one(frozen.entity, component);
                  }
                  if let Some(component) = frozen.tackled {
                      let _ = self.world.insert_one(frozen.entity, component);
                  }
                  if let Some(component) = frozen.warp {
                      let _ = self.world.insert_one(frozen.entity, component);
                  }
                  if let Some(component) = frozen.approach {
                      let _ = self.world.insert_one(frozen.entity, component);
                  }
                  if let Some(component) = frozen.orbit {
                      let _ = self.world.insert_one(frozen.entity, component);
                  }
                  if let Some(component) = frozen.keep_at_range {
                      let _ = self.world.insert_one(frozen.entity, component);
                  }
              }
              for (entity, component) in related_locks {
                  if let Some(mut current) = self.world.get_mut::<LockComp>(entity) {
                      *current = component;
                  } else {
                      let _ = self.world.insert_one(entity, component);
                  }
              }
          }
''',
              'freeze/restore functions',
          )
          tick = replace_once(
              tick,
              '        let (transit_ids, frozen_transit) = self.freeze_transit_components();\n',
              '        let (transit_ids, frozen_transit, frozen_related_locks) =\n            self.freeze_transit_components();\n',
              'freeze call',
          )
          tick = replace_once(
              tick,
              '        let tackle_events = self.process_tackle(tick);\n',
              '''        let tackle_events: Vec<_> = self
              .process_tackle(tick)
              .into_iter()
              .filter(|event| !transit_ids.contains(&event.ship_id()))
              .collect();
''',
              'tackle event filter',
          )
          tick = replace_once(
              tick,
              '        let lock = LockSystem(&mut self.world, tick, &merged_locks);\n',
              '''        let mut lock = LockSystem(&mut self.world, tick, &merged_locks);
          lock.events.retain(|event| match event {
              DomainEvent::TargetLocked(event) => {
                  !transit_ids.contains(&event.locker_id)
                      && !transit_ids.contains(&event.target_id)
              }
              DomainEvent::LockLost(event) => {
                  !transit_ids.contains(&event.locker_id)
                      && !transit_ids.contains(&event.target_id)
              }
              _ => true,
          });
''',
              'lock event filter',
          )
          tick = replace_once(
              tick,
              '        self.restore_transit_components(frozen_transit);\n',
              '''        self.restore_transit_components(
              frozen_transit,
              frozen_related_locks,
          );
''',
              'restore call',
          )
          tick = replace_once(
              tick,
              '        node.world.get_mut::<CapacitorComp>(entity).unwrap().current = 1.0;\n        node.propose_transit(TransitCommand {\n',
              '''        node.world.get_mut::<CapacitorComp>(entity).unwrap().current = 1.0;
          let _ = node.world.insert_one(
              entity,
              TackledComp {
                  tacklers: vec![dawn_core::ShipId::new(NodeId(9), 1)],
              },
          );
          node.propose_transit(TransitCommand {
''',
              'freeze test setup',
          )
          tick = replace_once(
              tick,
              '        node.tick();\n        let after = node\n',
              '        let tick_result = node.tick();\n        let after = node\n',
              'freeze test result',
          )
          tick = replace_once(
              tick,
              '        assert_eq!(after.inventory, before.inventory);\n        assert_eq!(after.fitting, before.fitting);\n',
              '''        assert_eq!(after.inventory, before.inventory);
          assert_eq!(after.fitting, before.fitting);
          assert_eq!(after.tackled_by, before.tackled_by);
          assert!(tick_result.events.iter().all(|event| !matches!(
              event,
              DomainEvent::TackleApplied(_)
                  | DomainEvent::TackleReleased(_)
                  | DomainEvent::TargetLocked(_)
                  | DomainEvent::LockLost(_)
          )));
''',
              'freeze test assertions',
          )
          path.write_text(tick)

          # Complete stale event literals after the event schema grows.
          literal = re.compile(
              r'(SectorTransitRequested \{\n)(?P<body>.*?)(?P<close>^\s*\})',
              re.MULTILINE | re.DOTALL,
          )
          for rust_path in Path('crates').rglob('*.rs'):
              text = rust_path.read_text()
              def complete(match):
                  body = match.group('body')
                  if 'request_tick:' in body or 'pub ship_id:' in body:
                      return match.group(0)
                  if not all(field in body for field in ('ship_id:', 'from:', 'to:', 'tick:')):
                      return match.group(0)
                  tick_field = re.search(
                      r'^(?P<indent>\s*)tick:\s*(?P<expr>[^,\n]+),\s*$',
                      body,
                      re.MULTILINE,
                  )
                  if tick_field is None:
                      return match.group(0)
                  indent = tick_field.group('indent')
                  expr = tick_field.group('expr')
                  prefix = '' if rust_path.as_posix() == 'crates/dawn-core/src/events.rs' else 'dawn_core::'
                  insertion = (
                      f'{indent}request_tick: {expr},\n'
                      f'{indent}gate_id: None,\n'
                      f'{indent}entry_pos: {prefix}Position::ORIGIN,\n'
                      f'{indent}entry_pos_abs: {prefix}AbsolutePosition::ORIGIN,\n'
                  )
                  body = body[:tick_field.start()] + insertion + body[tick_field.start():]
                  return match.group(1) + body + match.group('close')
              updated = literal.sub(complete, text)
              if updated != text:
                  rust_path.write_text(updated)

          # Load-bearing assertions before compilation.
          events = Path('crates/dawn-core/src/events.rs').read_text()
          tf = Path('crates/dawn-sector/src/node/transit_flow.rs').read_text()
          transit = Path('crates/dawn-sector/src/transit.rs').read_text()
          tick = Path('crates/dawn-sector/src/node/tick.rs').read_text()
          checks = {
              'durable route schema': all(value in events for value in (
                  'pub request_tick: Tick',
                  'pub gate_id: Option<JumpGateId>',
                  'pub entry_pos: Position',
                  'pub entry_pos_abs: AbsolutePosition',
              )),
              'source route authority': all(value in tf for value in (
                  'propose_transit_with_route',
                  'pub request_tick: Tick',
                  'transit_commit_retry_due',
                  'note_transit_commit_proposed',
              )),
              'durable retry route': all(value in transit for value in (
                  'gate_id: event.gate_id',
                  'entry_pos: event.entry_pos',
                  'entry_pos_abs: event.entry_pos_abs',
                  'transit_commit_retry_due',
              )) and 'fn inferred_gate_id' not in transit,
              'destination-local tick': 'tick: self.current_tick' in tick,
              'lock/tackle freeze': all(value in tick for value in (
                  'tackled: Option<TackledComp>',
                  'frozen_related_locks',
                  'after.tackled_by',
              )),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('missing review fixes: ' + ', '.join(failed))
          PY

      - name: Format
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Test affected crates
        run: cargo test -p dawn-core -p dawn-sector

      - name: Clippy affected crates
        run: cargo clippy -p dawn-core -p dawn-sector --all-targets -- -D warnings

      - name: Commit fixes and remove temporary files
        shell: bash
        run: |
          git rm .github/workflows/fix-pr-206.yml
          git rm .github/workflows/fix-pr-206-v2.yml
          git rm .github/fix-pr-206-trigger
          git add crates/dawn-core/src/events.rs \
                  crates/dawn-sector/src/node/tick.rs \
                  crates/dawn-sector/src/node/transit_flow.rs \
                  crates/dawn-sector/src/transit.rs \
                  docs/architecture/tick-model.md \
                  docs/architecture/event-catalog.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sector): address transit recovery review"
          git push origin HEAD:recoverable-sector-transit
