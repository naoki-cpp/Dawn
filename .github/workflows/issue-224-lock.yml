name: Issue 224 lock refresh

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/typed-server-message-outcomes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/typed-server-message-outcomes
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Refresh lockfile
        run: cargo check -p dawn-client-gdext
      - name: Remove one-shot workflow
        run: rm .github/workflows/issue-224-lock.yml
      - name: Commit lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh client dependency lockfile"
          git push origin HEAD:agent/typed-server-message-outcomes
