name: Issue 238 test migration export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-238-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git --exclude=target -czf /tmp/dawn-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-source-typed
          path: /tmp/dawn-source.tar.gz
          retention-days: 1
