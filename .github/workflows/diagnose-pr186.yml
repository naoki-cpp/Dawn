name: Apply PR 186 CI fix

on:
  push:
    branches:
      - dependabot/cargo/rust-dependencies-697640ec0a

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/cargo/rust-dependencies-697640ec0a

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1

      - name: Apply fixes
        run: |
          cargo run -p dawn-actor --example gen_wire_schema

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/fuzz.yml')
          text = path.read_text()
          old = "    timeout-minutes: 15\n    strategy:"
          new = "    timeout-minutes: 15\n    env:\n      RUSTUP_TOOLCHAIN: nightly\n    strategy:"
          if text.count(old) != 1:
              raise SystemExit('unexpected fuzz workflow layout')
          path.write_text(text.replace(old, new))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fuzz.yml docs/architecture/wire-protocol.schema.json docs/architecture/wire-protocol-commands.schema.json docs/architecture/wire-protocol-market.schema.json
          git rm .github/workflows/diagnose-pr186.yml
          git diff --cached --check
          git commit -m "fix(ci): refresh schemas and force nightly fuzzing"
          git push origin HEAD:dependabot/cargo/rust-dependencies-697640ec0a
