name: Issue 235 implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/issue-235-inventory.yml'
      - '.github/issue-235-apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply topology construction change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/issue-235-apply.py')
          text = path.read_text()

          quote_old = "elif ch == \"'\":"
          quote_new = "elif False and ch == \"'\":"
          quote_count = text.count(quote_old)
          if quote_count != 4:
              raise SystemExit(f'expected four single-quote parser branches, found {quote_count}')
          text = text.replace(quote_old, quote_new)

          open_old = "        open_index = index + len(needle) - 1\n"
          open_new = """        line_start = text.rfind(\"\\n\", 0, index) + 1\n        if text[line_start:index].lstrip().startswith(\"//\"):\n            pos = index + len(needle)\n            continue\n        open_index = index + len(needle) - 1\n"""
          open_count = text.count(open_old)
          if open_count != 1:
              raise SystemExit(f'expected one call parser opening site, found {open_count}')
          text = text.replace(open_old, open_new)

          find_old = "        close_index = find_matching_paren(text, open_index)\n"
          find_new = """        try:\n            close_index = find_matching_paren(text, open_index)\n        except RuntimeError as error:\n            raise RuntimeError(\n                f\"{path}: unmatched call near {text[index:index + 240]!r}\"\n            ) from error\n"""
          find_count = text.count(find_old)
          if find_count != 1:
              raise SystemExit(f'expected one call parser site, found {find_count}')
          path.write_text(text.replace(find_old, find_new))
          PY

          python3 .github/issue-235-apply.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/dawn-sector/src/lib.rs')
          text = path.read_text()
          old = """//!     SectorBounds::centered(SectorBounds::DEFAULT_HALF),\n//! );\n"""
          new = """//!     SectorBounds::centered(SectorBounds::DEFAULT_HALF),\n//!     std::sync::Arc::new(dawn_sector::galaxy::Galaxy::demo()),\n//! );\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one public constructor example, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Format and verify
        run: |
          cargo fmt --all
          git diff --check
          if grep -RIn --exclude='issue-235-apply.py' --exclude='issue-235-inventory.yml' 'set_galaxy' crates docs; then
            echo 'set_galaxy references remain' >&2
            exit 1
          fi
          cargo test -p dawn-sector
          cargo test -p dawn-simulation
          cargo test -p dawn-sector-node
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Publish verified changes
        run: |
          rm -f .github/issue-235-apply.py .github/workflows/issue-235-inventory.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Require topology when constructing SimulationNode'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
