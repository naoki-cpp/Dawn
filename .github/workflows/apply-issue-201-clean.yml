name: Replay issue 201 on latest main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/type-player-loadout-reads-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/type-player-loadout-reads-v2
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Replay verified source changes
        id: apply
        run: |
          if test -f crates/dawn-client-gdext/src/owned_ship_row_gd.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin agent/type-player-loadout-reads
          git checkout origin/agent/type-player-loadout-reads -- \
            client/scripts/hud_manager.gd \
            client/test/hud_manager_test.gd \
            client/test/hud_surface_test.gd \
            client/test/player_loadout_test.gd \
            crates/dawn-client-gdext/src/loadout_gd.rs \
            crates/dawn-client-gdext/src/owned_ship_row_gd.rs \
            docs/architecture/architecture-review/client-completed.md \
            docs/architecture/architecture-review/client-pending.md
          python .github/scripts/apply_issue_201_clean.py
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Format and focused checks
        if: steps.apply.outputs.changed == 'true'
        run: |
          cargo fmt --all
          cargo test -p dawn-client-gdext
          cargo clippy -p dawn-client-gdext --all-targets -- -D warnings
          git diff --check

      - name: Commit and push source changes
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/scripts/hud_manager.gd client/scripts/main.gd \
            client/test/hud_manager_test.gd client/test/hud_surface_test.gd \
            client/test/player_loadout_test.gd crates/dawn-client-gdext/src/lib.rs \
            crates/dawn-client-gdext/src/loadout_gd.rs \
            crates/dawn-client-gdext/src/owned_ship_row_gd.rs \
            docs/architecture/architecture-review/client-completed.md \
            docs/architecture/architecture-review/client-pending.md
          git commit -m "refactor(client): type PlayerLoadout read projections"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/type-player-loadout-reads-v2
