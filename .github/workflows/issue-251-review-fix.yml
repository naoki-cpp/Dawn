name: Issue 251 review fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'issue-251-client-fact-policy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge current main
        run: |
          git fetch origin main
          git merge --no-edit origin/main
      - name: Apply review fixes
        run: python3 .github/scripts/issue_251_review_fix.py
      - name: Format and focused tests
        run: |
          cargo fmt --all
          cargo test -p dawn-client-core
          cargo test -p dawn-client-gdext
          cargo clippy -p dawn-client-core -p dawn-client-gdext --all-targets -- -D warnings
      - name: Commit fixes and remove temporary files
        run: |
          git rm .github/workflows/issue-251-review-fix.yml
          git rm .github/scripts/issue_251_review_fix.py
          git add -A
          git commit -m "fix: address issue 251 review feedback"
          git push origin HEAD:${{ github.head_ref }}
