name: Issue 251 review fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'issue-251-client-fact-policy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge current main
        run: |
          git fetch origin main
          git merge --no-edit origin/main
      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/issue_251_review_fix.py')
          text = path.read_text()
          old = '''if not text.endswith("\\n}"):
              raise SystemExit("client_state module terminator missing")
          text = text[:-2] + tests + "\\n}\\n"
          path.write_text(text)
          '''
          new = '''closing = text.rfind("}")
          if closing < 0 or text[closing + 1:].strip():
              raise SystemExit("client_state module terminator missing")
          text = text[:closing] + tests + "\\n}\\n"
          path.write_text(text)
          '''
          if old not in text:
              raise SystemExit('review script terminator anchor missing')
          path.write_text(text.replace(old, new))
          PY
          python3 .github/scripts/issue_251_review_fix.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('crates/dawn-client-core/src/client_state.rs')
          text = path.read_text()
          tick_pattern = re.compile(r'(?P<i>^[ \t]*)let \(mut session, mut loadout\) = setup\(\);\n(?P=i)loadout = Some\(PlayerLoadoutMsg \{\n(?P=i)    active_ship_id: Some\(1\),\n(?P=i)    modules: vec!\[module\(7, true\)\],', re.MULTILINE)
          module_pattern = re.compile(r'(?P<i>^[ \t]*)let \(mut session, mut loadout\) = setup\(\);\n(?P=i)loadout = Some\(PlayerLoadoutMsg \{\n(?P=i)    modules: vec!\[module\(7, false\)\],', re.MULTILINE)
          text, tick_count = tick_pattern.subn(lambda m: f'{m.group("i")}let (mut session, _) = setup();\n{m.group("i")}let mut active_module = module(7, true);\n{m.group("i")}active_module.cycle_remaining = 0;\n{m.group("i")}let mut loadout = Some(PlayerLoadoutMsg {{\n{m.group("i")}    active_ship_id: Some(1),\n{m.group("i")}    modules: vec![active_module],', text)
          text, module_count = module_pattern.subn(lambda m: f'{m.group("i")}let (mut session, _) = setup();\n{m.group("i")}let mut loadout = Some(PlayerLoadoutMsg {{\n{m.group("i")}    modules: vec![module(7, false)],', text)
          if tick_count != 1 or module_count != 1:
              raise SystemExit(f'fixture replacement counts: tick={tick_count}, module={module_count}')
          path.write_text(text)
          PY
      - name: Format and focused tests
        run: |
          cargo fmt --all
          cargo test -p dawn-client-core
          cargo test -p dawn-client-gdext
          cargo clippy -p dawn-client-core -p dawn-client-gdext --all-targets -- -D warnings
      - name: Commit fixes and remove temporary files
        run: |
          git rm -f .github/workflows/issue-251-review-fix.yml
          git rm -f .github/scripts/issue_251_review_fix.py
          git add -A
          git commit -m "fix: address issue 251 review feedback"
          git push origin HEAD:${{ github.head_ref }}
