name: Issue 251 review fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'issue-251-client-fact-policy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge current main
        run: |
          git fetch origin main
          git merge --no-edit origin/main
      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/issue_251_review_fix.py')
          text = path.read_text()
          old = '''if not text.endswith("\\n}"):
              raise SystemExit("client_state module terminator missing")
          text = text[:-2] + tests + "\\n}\\n"
          path.write_text(text)
          '''
          new = '''closing = text.rfind("}")
          if closing < 0 or text[closing + 1:].strip():
              raise SystemExit("client_state module terminator missing")
          text = text[:closing] + tests + "\\n}\\n"
          path.write_text(text)
          '''
          if old not in text:
              raise SystemExit('review script terminator anchor missing')
          path.write_text(text.replace(old, new))
          PY
          python3 .github/scripts/issue_251_review_fix.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/dawn-client-core/src/client_state.rs')
          text = path.read_text()
          old_tick = '''        let (mut session, mut loadout) = setup();
          loadout = Some(PlayerLoadoutMsg {
              active_ship_id: Some(1),
              modules: vec![module(7, true)],
          '''
          new_tick = '''        let (mut session, _) = setup();
          let mut active_module = module(7, true);
          active_module.cycle_remaining = 0;
          let mut loadout = Some(PlayerLoadoutMsg {
              active_ship_id: Some(1),
              modules: vec![active_module],
          '''
          old_module = '''        let (mut session, mut loadout) = setup();
          loadout = Some(PlayerLoadoutMsg {
              modules: vec![module(7, false)],
          '''
          new_module = '''        let (mut session, _) = setup();
          let mut loadout = Some(PlayerLoadoutMsg {
              modules: vec![module(7, false)],
          '''
          if text.count(old_tick) != 1:
              raise SystemExit(f'tick fixture anchor count: {text.count(old_tick)}')
          if text.count(old_module) != 1:
              raise SystemExit(f'module fixture anchor count: {text.count(old_module)}')
          path.write_text(text.replace(old_tick, new_tick).replace(old_module, new_module))
          PY
      - name: Format and focused tests
        run: |
          cargo fmt --all
          cargo test -p dawn-client-core
          cargo test -p dawn-client-gdext
          cargo clippy -p dawn-client-core -p dawn-client-gdext --all-targets -- -D warnings
      - name: Commit fixes and remove temporary files
        run: |
          git rm -f .github/workflows/issue-251-review-fix.yml
          git rm -f .github/scripts/issue_251_review_fix.py
          git add -A
          git commit -m "fix: address issue 251 review feedback"
          git push origin HEAD:${{ github.head_ref }}
