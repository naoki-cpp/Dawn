name: Fix PR 248 typed fixture casts

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/delete-legacy-client-adapters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Remove redundant GDScript object casts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('client/test/hud_hit_test_test.gd'),
              Path('client/test/hud_manager_test.gd'),
              Path('client/test/hud_surface_test.gd'),
              Path('client/test/main_test.gd'),
              Path('client/test/player_loadout_test.gd'),
              Path('client/test/world_session_test.gd'),
          ]
          replacements = 0
          for path in paths:
              text = path.read_text()
              module_count = text.count(') as ModuleRow')
              owned_ship_count = text.count(') as OwnedShipRow')
              replacements += module_count + owned_ship_count
              text = text.replace(') as ModuleRow', ')')
              text = text.replace(') as OwnedShipRow', ')')
              path.write_text(text)
          if replacements != 8:
              raise SystemExit(f'expected 8 fixture casts, found {replacements}')
          PY

      - name: Commit fix and remove maintenance workflow
        run: |
          rm .github/workflows/fix-pr248-fixture-casts.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add client/test .github/workflows/fix-pr248-fixture-casts.yml
          git commit -m "test(godot): keep typed fixture return values"
          git push origin HEAD:${{ github.head_ref }}
