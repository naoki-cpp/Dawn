name: Fix admission review findings

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/finalize-admission-253.yml

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/transactional-client-admission-253'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/transactional-client-admission-253
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/fix-admission-review.yml').read_text()
          marker = "cat > /tmp/fix_admission.py <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          Path('/tmp/fix_admission.py').write_text(textwrap.dedent(body))
          PY
          python3 /tmp/fix_admission.py
          cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test affected crates
        run: cargo test -p dawn-sector -p dawn-sector-node -p dawn-simulation

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Commit fixes and remove temporary tooling
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/admission-253-ci-trigger
          rm -f .github/workflows/patch-admission-253.yml
          rm -f .github/workflows/finalize-admission-253.yml
          rm -f .github/workflows/fix-admission-review.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(admission): address transactional review findings'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/transactional-client-admission-253
