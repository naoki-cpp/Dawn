name: Apply issue 220

on:
  push:
    branches:
      - agent/single-authority-game-data-catalog

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/single-authority-game-data-catalog
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply catalog migration
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import zlib

          payload = """"""
          pathlib.Path('/tmp/apply_issue_220.py').write_bytes(
              zlib.decompress(base64.b64decode(payload))
          )
          PY
          python3 /tmp/apply_issue_220.py

      - name: Format and test workspace
        run: |
          cargo fmt --all
          cargo test --workspace

      - name: Commit implementation and remove migration workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-issue-220.yml
          git add -A
          git commit -m "Make game-data catalog single-authority"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:agent/single-authority-game-data-catalog
