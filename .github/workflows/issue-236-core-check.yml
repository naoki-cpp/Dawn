name: Issue 236 core check

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/issue-236-core.py'
      - '.github/issue-236-core-fix.py'
      - '.github/issue-236-core-fix2.py'
      - '.github/issue-236-followup.py'
      - '.github/workflows/issue-236-core-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply core transformation
        run: |
          python3 .github/issue-236-core-fix.py
          python3 .github/issue-236-core-fix2.py
          python3 .github/issue-236-core.py
          python3 .github/issue-236-followup.py
      - name: Format
        run: cargo fmt --all
      - name: Check affected crates
        run: cargo check -p dawn-core -p dawn-sector -p dawn-wire
      - name: Compile affected tests
        run: cargo test -p dawn-core -p dawn-sector -p dawn-wire --no-run
