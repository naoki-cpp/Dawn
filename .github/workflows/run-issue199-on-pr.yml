name: Run issue 199 implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/centralize-sector-map
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Apply, validate, and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q 'pub(super) fn from_galaxy' crates/dawn-sector/src/node/sector_map.rs; then
            echo 'Issue 199 implementation already applied'
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-issue199.yml').read_text()
          marker = "          python - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(compile(textwrap.dedent(script), 'apply-issue199', 'exec'))
          PY

          cargo fmt --all
          cargo test -p dawn-sector set_galaxy_rebuilds_all_sector_projections_and_anchors_from_one_value
          cargo clippy -p dawn-sector --all-targets -- -D warnings

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dawn-sector/src/node/sector_map.rs crates/dawn-sector/src/node/mod.rs
          git commit -m "refactor(sector): centralize SectorMap construction"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/centralize-sector-map
