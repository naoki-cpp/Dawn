name: Apply issue 219

on:
  push:
    branches:
      - agent/collapse-production-runtime-tick-pipeline
    paths:
      - tools/apply_issue_219.py
      - .github/workflows/apply-issue-219.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/apply_issue_219.py
      - .github/workflows/apply-issue-219.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/collapse-production-runtime-tick-pipeline
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply authoritative Runtime Tick migration
        run: python tools/apply_issue_219.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Remove temporary migration files
        run: |
          rm -f tools/apply_issue_219.py
          rm -f .github/workflows/apply-issue-219.yml

      - name: Commit implementation
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: unify runtime tick pipeline"
          git push origin HEAD:agent/collapse-production-runtime-tick-pipeline
