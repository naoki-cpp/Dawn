name: Apply wire fuzz fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-wire-fuzz-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: agent/dawn-wire-fuzz

      - name: Fix postcard optional-field serialization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/dawn-wire/src/server_event.rs")
          text = path.read_text()

          attr = '#[serde(skip_serializing_if = "Option::is_none", default)]'
          assert text.count(attr) == 2, "expected two optional wire fields"
          text = text.replace(attr, "#[serde(default)]")
          text = text.replace(
              '/// Why the system forced this off ("cap" | "range"); omitted for a\n'
              '        /// player-issued deactivation (ADR-0035).',
              '/// Why the system forced this off ("cap" | "range"); `None` for a\n'
              '        /// player-issued deactivation (ADR-0035).',
          )
          text = text.replace(
              "fn module_activated_event_without_a_target_omits_the_field()",
              "fn module_activated_event_without_a_target_has_none_target()",
          )

          anchor = """    #[test]
    fn module_deactivated_event_carries_the_forced_reason_when_present() {
"""
          regression = """    #[test]
    fn optional_module_fields_round_trip_through_postcard() {
        let events = [
            EventWire::ModuleActivated {
                ship_id: 1,
                module_id: 3,
                slot: "High".to_string(),
                target_ship_id: None,
                tick: 10,
            },
            EventWire::ModuleDeactivated {
                ship_id: 1,
                module_id: 3,
                slot: "High".to_string(),
                reason: None,
                tick: 11,
            },
        ];

        for expected in events {
            let bytes = crate::ServerMessage::Event(expected.clone()).encode();
            assert!(!bytes.is_empty(), "wire message must encode");
            let decoded = crate::ServerMessage::decode(&bytes).expect("wire message must decode");
            let crate::ServerMessage::Event(actual) = decoded else {
                panic!("expected Event server message");
            };
            assert_eq!(actual, expected);
        }
    }

"""
          assert anchor in text, "test insertion anchor missing"
          text = text.replace(anchor, regression + anchor, 1)
          path.write_text(text)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dawn-wire/src/server_event.rs
          git commit -m "fix(dawn-wire): preserve optional fields in postcard"
          git push origin HEAD:agent/dawn-wire-fuzz
