name: Issue 202 patch

on:
  push:
    branches:
      - agent/issue-202-selection-read-api

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/issue-202-selection-read-api
          persist-credentials: false

      - name: Apply selection read API cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          interaction = Path('client/scripts/world_interaction.gd')
          text = interaction.read_text()
          old = '''func selection_state() -> Dictionary:\n\treturn {\n\t\t"selected_target_id": _selected_target_id,\n\t\t"selected_gate_id": _selected_gate_id,\n\t\t"selected_body_id": _selected_body_id,\n\t}\n\n\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected WorldInteraction selection_state block')
          interaction.write_text(text.replace(old, '', 1))

          main = Path('client/scripts/main.gd')
          text = main.read_text()
          old = '''\tvar selection: Dictionary = _interaction.selection_state()\n\tvar selected_gate_id: int = selection.get("selected_gate_id", -1) as int\n\tvar selected_body_id: int = selection.get("selected_body_id", -1) as int\n\tvar selected_target_id: int = selection.get("selected_target_id", -1) as int\n'''
          new = '''\tvar selected_gate_id: int = _interaction.selected_gate_id()\n\tvar selected_body_id: int = _interaction.selected_body_id()\n\tvar selected_target_id: int = _interaction.selected_target_id()\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected main.gd selection read block')
          main.write_text(text.replace(old, new, 1))

          test = Path('client/test/world_interaction_test.gd')
          text = test.read_text()
          old = '''\tvar selection: Dictionary = _interaction.selection_state()\n\tassert_int(selection.selected_target_id as int).is_equal(42)\n\tassert_int(selection.selected_gate_id as int).is_equal(-1)\n\tassert_int(selection.selected_body_id as int).is_equal(-1)\n'''
          new = '''\tassert_int(_interaction.selected_target_id()).is_equal(42)\n\tassert_int(_interaction.selected_gate_id()).is_equal(-1)\n\tassert_int(_interaction.selected_body_id()).is_equal(-1)\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected WorldInteraction test selection block')
          test.write_text(text.replace(old, new, 1))
          PY

          ! grep -R "selection_state()" client/scripts client/test
          git diff --check

      - name: Commit patch and remove helper workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/issue-202-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/scripts/main.gd client/scripts/world_interaction.gd client/test/world_interaction_test.gd .github/workflows/issue-202-patch.yml
          git commit -m "refactor(client): use scalar selection accessors"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:agent/issue-202-selection-read-api
