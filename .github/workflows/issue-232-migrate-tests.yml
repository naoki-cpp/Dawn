name: Issue 232 test migration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue-232-migrate-tests.yml

permissions:
  contents: write

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/delete-game-data-compat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/delete-game-data-compat

      - name: Move test callers to the catalog fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('crates/dawn-sector/src')
          replacements = {
              'crate::modules::all_modules()': 'crate::game_data::test_catalog().modules().to_vec()',
              'modules::all_modules()': 'crate::game_data::test_catalog().modules().to_vec()',
              'crate::ship_types::all_ship_types()': 'crate::game_data::test_catalog().ship_types().to_vec()',
              'ship_types::all_ship_types()': 'crate::game_data::test_catalog().ship_types().to_vec()',
          }
          changed = []
          for path in root.rglob('*.rs'):
              source = path.read_text()
              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != source:
                  path.write_text(updated)
                  changed.append(str(path))

          remaining = []
          for path in root.rglob('*.rs'):
              source = path.read_text()
              if 'all_modules()' in source or 'all_ship_types()' in source:
                  remaining.append(str(path))
          if remaining:
              raise SystemExit(f'legacy accessors remain in: {remaining}')
          if not changed:
              raise SystemExit('no test callers were migrated')
          print('\n'.join(changed))
          PY

      - name: Remove the one-shot workflow
        run: rm .github/workflows/issue-232-migrate-tests.yml

      - name: Commit migrated tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/dawn-sector/src .github/workflows/issue-232-migrate-tests.yml
          git commit -m "Migrate game-data test callers to the catalog fixture"
          git push origin HEAD:agent/delete-game-data-compat
