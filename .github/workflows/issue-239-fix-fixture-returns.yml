name: Fix issue 239 fixture returns

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix-fixture-returns:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/delete-legacy-client-adapters
          fetch-depth: 0

      - name: Return typed Godot fixture objects
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one regex match, found {count}")
              return text

          module_path = Path("crates/dawn-client-gdext/src/module_row_gd.rs")
          module = module_path.read_text(encoding="utf-8")
          module = replace_once(
              module,
              "    #[allow(clippy::too_many_arguments)]\n    #[func]\n    fn test_fixture(\n",
              "    #[cfg(debug_assertions)]\n    #[allow(clippy::too_many_arguments)]\n    #[func]\n    fn test_fixture(\n",
              "module fixture cfg",
          )
          module = replace_once(
              module,
              "    /// Typed fixture boundary for GdUnit. Production rows are created only\n",
              "    /// Debug-only typed fixture for GdUnit. Production rows are created only\n",
              "module fixture comment",
          )
          module = replace_once(module, ") -> Variant {\n", ") -> Gd<ModuleRow> {\n", "module return")
          module = regex_once(
              module,
              r"        let \(Ok\(index\), Ok\(module_id\), Ok\(cycle_time_ticks\)\) = \(.*?        \};\n",
              "        let index = u32::try_from(index).expect(\"fixture index must fit u32\");\n"
              "        let module_id = u32::try_from(module_id).expect(\"fixture module ID must fit u32\");\n"
              "        let cycle_time_ticks =\n"
              "            u32::try_from(cycle_time_ticks).expect(\"fixture cycle time must fit u32\");\n",
              "module conversions",
          )
          module = replace_once(
              module,
              "        })\n        .to_variant()\n",
              "        })\n",
              "module typed return",
          )
          module_path.write_text(module, encoding="utf-8")

          owned_path = Path("crates/dawn-client-gdext/src/owned_ship_row_gd.rs")
          owned = owned_path.read_text(encoding="utf-8")
          owned = replace_once(
              owned,
              "    #[func]\n    fn test_fixture(\n        ship_id: i64,\n",
              "    #[cfg(debug_assertions)]\n    #[func]\n    fn test_fixture(\n        ship_id: i64,\n",
              "owned fixture cfg",
          )
          owned = replace_once(
              owned,
              "    /// Typed fixture boundary for GdUnit. Negative optional IDs and an empty\n",
              "    /// Debug-only typed fixture for GdUnit. Negative optional IDs and an empty\n",
              "owned fixture comment",
          )
          owned = replace_once(
              owned,
              ") -> Variant {\n",
              ") -> Gd<OwnedShipRow> {\n",
              "owned return",
          )
          owned = regex_once(
              owned,
              r"        let Ok\(ship_id\) = u64::try_from\(ship_id\) else \{.*?        \};\n",
              "        let ship_id = u64::try_from(ship_id).expect(\"fixture ship ID must fit u64\");\n",
              "owned conversion",
          )
          owned = replace_once(
              owned,
              "        })\n        .to_variant()\n",
              "        })\n",
              "owned typed return",
          )
          owned_path.write_text(owned, encoding="utf-8")

          loadout_path = Path("crates/dawn-client-gdext/src/loadout_gd.rs")
          loadout = loadout_path.read_text(encoding="utf-8")
          loadout = replace_once(
              loadout,
              "    #[func]\n    fn test_fixture(\n        &mut self,\n",
              "    #[cfg(debug_assertions)]\n    #[func]\n    fn test_fixture(\n        &mut self,\n",
              "loadout fixture cfg",
          )
          loadout = replace_once(
              loadout,
              "    /// Typed fixture boundary for focused GdUnit tests. Production state is\n",
              "    /// Debug-only typed fixture for focused GdUnit tests. Production state is\n",
              "loadout fixture comment",
          )
          loadout_path.write_text(loadout, encoding="utf-8")
          PY
          cargo fmt --all
          cargo check -p dawn-client-gdext --all-targets
          cargo clippy -p dawn-client-gdext --all-targets -- -D warnings

      - name: Commit fixture return fix
        shell: bash
        run: |
          rm -f .github/workflows/issue-239-fix-fixture-returns.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Return typed GdUnit fixture objects'
          git push origin HEAD:agent/delete-legacy-client-adapters
