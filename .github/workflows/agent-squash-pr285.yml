name: Squash PR 285

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: agent-squash-pr285
  cancel-in-progress: true

jobs:
  squash:
    if: github.event.pull_request.head.ref == 'agent/validated-game-data-catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/validated-game-data-catalog
          fetch-depth: 0
          persist-credentials: false

      - name: Squash validated tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected_remote_head=$(git rev-parse HEAD)
          rm .github/workflows/agent-squash-pr285.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset --soft origin/main
          git commit -m "refactor(game-data): require validated catalog at Sector construction"
          git push --force-with-lease="refs/heads/agent/validated-game-data-catalog:${expected_remote_head}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/validated-game-data-catalog
