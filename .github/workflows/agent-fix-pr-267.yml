name: Agent fix PR 267

on:
  push:
    branches:
      - agent/sector-command-dispatch-264

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/sector-command-dispatch-264
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve AttackCommand payload at the flight boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          flight_path = Path("crates/dawn-sector/src/node/command_flight.rs")
          flight = flight_path.read_text()

          replacements = [
              (
                  "    ApproachCommand, JumpCommand, KeepAtRangeCommand, LockOnCommand, MoveCommand, OrbitCommand,\n",
                  "    ApproachCommand, AttackCommand, JumpCommand, KeepAtRangeCommand, LockOnCommand, MoveCommand,\n    OrbitCommand,\n",
              ),
              ("    Attack,\n", "    Attack(AttackCommand),\n"),
              ("            FlightDispatchCommand::Attack => {}\n", "            FlightDispatchCommand::Attack(_cmd) => {}\n"),
          ]
          for old, new in replacements:
              if flight.count(old) != 1:
                  raise SystemExit(f"expected exactly one occurrence in {flight_path}: {old!r}")
              flight = flight.replace(old, new, 1)
          flight_path.write_text(flight)

          commands_path = Path("crates/dawn-sector/src/node/commands.rs")
          commands = commands_path.read_text()
          old = "            ClientCommand::Attack(_) => Self::Flight(FlightDispatchCommand::Attack),\n"
          new = "            ClientCommand::Attack(cmd) => Self::Flight(FlightDispatchCommand::Attack(cmd)),\n"
          if commands.count(old) != 1:
              raise SystemExit(f"expected exactly one Attack selection arm in {commands_path}")
          commands = commands.replace(old, new, 1)

          marker = "    #[test]\n    fn followup_projection_preserves_jump_context() {\n"
          test_lines = [
              "    #[test]",
              "    fn attack_command_payload_reaches_the_flight_family() {",
              "        use dawn_core::AttackCommand;",
              "",
              "        let attacker_id = ShipId(dawn_core::EntityId::from_raw(11));",
              "        let target_id = ShipId(dawn_core::EntityId::from_raw(12));",
              "        let dispatch = ClientCommandDispatch::select(ClientCommand::Attack(AttackCommand {",
              "            attacker_id,",
              "            target_id,",
              "        }));",
              "",
              "        assert!(matches!(",
              "            dispatch,",
              "            ClientCommandDispatch::Flight(FlightDispatchCommand::Attack(AttackCommand {",
              "                attacker_id: actual_attacker,",
              "                target_id: actual_target,",
              "            })) if actual_attacker == attacker_id && actual_target == target_id",
              "        ));",
              "    }",
              "",
          ]
          test = "\n".join(test_lines) + "\n"
          if commands.count(marker) != 1:
              raise SystemExit(f"expected exactly one insertion marker in {commands_path}")
          commands = commands.replace(marker, test + marker, 1)
          commands_path.write_text(commands)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo test -p dawn-sector
          cargo test -p dawn-wire
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit review fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm .github/workflows/agent-fix-pr-267.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(sector): preserve attack payload through dispatch"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/sector-command-dispatch-264
