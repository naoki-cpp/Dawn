name: Clarify admission lifecycle docs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  clarify:
    if: github.event.pull_request.number == 260 && github.head_ref == 'agent/transactional-client-admission-253'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/transactional-client-admission-253
          persist-credentials: false

      - name: Update comments
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('crates/dawn-sector/src/client_admission.rs')
          text = path.read_text()
          replacements = {
              '''/// A successful WebSocket handshake could not be committed because its Ship
/// disappeared while the asynchronous handshake was in flight.''': '''/// A successful WebSocket handshake could not be committed because the
/// reserved Ship or admission token disappeared while the handshake was in flight.''',
              '''            "admission commit refused for {}: ship #{} disappeared during handshake",''': '''            "admission commit refused for {}: ship #{} or its reservation disappeared during handshake",''',
              '''/// Fresh attempts already own a newly-spawned Ship and abort removes it. Resume
/// attempts do not mutate ownership until commit, so abort is a no-op and can
/// never remove the pre-existing Ship.''': '''/// Fresh attempts hold only a durable identity watermark plus a non-durable
/// reservation; abort releases the reservation and never creates a Ship. Resume
/// attempts hold a non-authoritative Ship lock until commit; abort releases that
/// lock and never removes the pre-existing Ship.''',
              '''    /// Resume ownership is established here, not at begin, so a failed resume
    /// handshake cannot leave ownership or docked-player state behind. Fresh
    /// ownership was created by the spawn and only needs a liveness check.''': '''    /// Resume ownership is established here, not at begin, so a failed resume
    /// handshake cannot leave ownership or docked-player state behind. Fresh
    /// Ship and gameplay state are materialized here from the reserved identity.''',
              '''    fn fresh_begin_is_non_durable_and_abort_releases_the_reservation() {''': '''    fn fresh_begin_persists_only_the_identity_watermark_and_abort_releases_capacity() {''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'missing or duplicated marker: {old[:60]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all -- --check

      - name: Commit source-only clarification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dawn-sector/src/client_admission.rs
          git commit -m "docs(admission): align comments with reservations"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/transactional-client-admission-253
