name: Issue 233 implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/drop-market-schema-compat'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/drop-market-schema-compat
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Apply and verify issue 233
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/issue233_apply.py")
          source = path.read_text()
          old = '''        let directory = tempfile::tempdir().unwrap();
        let path = directory.path().join("market.sqlite");
        let path = path.to_str().unwrap();
        let order_id = {
            let mut market = MarketDb::open(path).unwrap();
'''
          new = '''        let path = std::env::temp_dir().join(format!(
            "dawn-market-reopen-{}-{}.sqlite",
            std::process::id(),
            std::time::SystemTime::now()
                .duration_since(std::time::UNIX_EPOCH)
                .unwrap()
                .as_nanos()
        ));
        let path_string = path.to_string_lossy().into_owned();
        let order_id = {
            let mut market = MarketDb::open(&path_string).unwrap();
'''
          if source.count(old) != 1:
              raise RuntimeError("expected tempfile reopen fixture exactly once")
          source = source.replace(old, new)
          source = source.replace(
              "        let mut reopened = MarketDb::open(path).unwrap();\n",
              "        let mut reopened = MarketDb::open(&path_string).unwrap();\n",
              1,
          )
          old_tail = '''        assert_eq!(
            cancelled.return_item_command,
            Some(ReturnItemCommand {
                player_id: PlayerId(1),
                ship_id: ship(1),
                item_id: scrap(),
                quantity: 5,
            })
        );
    }
'''
          new_tail = '''        assert_eq!(
            cancelled.return_item_command,
            Some(ReturnItemCommand {
                player_id: PlayerId(1),
                ship_id: ship(1),
                item_id: scrap(),
                quantity: 5,
            })
        );
        drop(reopened);
        std::fs::remove_file(path).unwrap();
    }
'''
          if source.count(old_tail) != 1:
              raise RuntimeError("expected reopen fixture tail exactly once")
          path.write_text(source.replace(old_tail, new_tail))
          PY
          python3 tools/issue233_apply.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p dawn-market
          cargo test -p dawn-simulation market
          cargo clippy -p dawn-market --all-targets -- -D warnings

      - name: Publish verified changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm tools/issue233_apply.py
          rm .github/workflows/issue-233-apply.yml
          rm .github/workflows/issue-233-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Drop pre-release Market schema compatibility"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:${GITHUB_HEAD_REF}"
