name: Issue 233 implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/drop-market-schema-compat'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/drop-market-schema-compat
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Apply and verify issue 233
        run: |
          python3 tools/issue233_fix_fixture.py
          python3 tools/issue233_apply.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p dawn-market
          cargo test -p dawn-simulation market
          cargo clippy -p dawn-market --all-targets -- -D warnings

      - name: Publish verified changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm tools/issue233_apply.py
          rm tools/issue233_fix_fixture.py
          rm .github/workflows/issue-233-apply.yml
          rm .github/workflows/issue-233-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Drop pre-release Market schema compatibility"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:${GITHUB_HEAD_REF}"
