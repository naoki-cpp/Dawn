name: Issue 235 actor topology fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/issue-235-actor-topology.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Require actor topology
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_name: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              path.write_text(text.replace(old, new))

          actor = 'crates/dawn-simulation/src/sector_simulator_actor.rs'
          replace(
              actor,
              """    /// `replication` publishes this node's append-log suffix after mutations.\n    /// `raft` is this node's `RaftActorHandle` (ADR-0014), already wired to\n""",
              """    /// `galaxy` is the authoritative topology used to build this node.\n    /// `replication` publishes this node's append-log suffix after mutations.\n    /// `raft` is this node's `RaftActorHandle` (ADR-0014), already wired to\n""",
          )
          replace(
              actor,
              """        bounds: SectorBounds,\n        replication: OutboundLogPublisher<InMemoryReplicationBus>,\n""",
              """        bounds: SectorBounds,\n        galaxy: std::sync::Arc<dawn_sector::galaxy::Galaxy>,\n        replication: OutboundLogPublisher<InMemoryReplicationBus>,\n""",
          )
          replace(
              actor,
              """        let node = SimulationNode::new(\n            node_id,\n            sector_id,\n            bounds,\n            std::sync::Arc::new(dawn_sector::galaxy::Galaxy::demo()),\n        );\n""",
              """        let node = SimulationNode::new(node_id, sector_id, bounds, galaxy);\n""",
          )
          replace(
              actor,
              """            SectorBounds::centered(SectorBounds::DEFAULT_HALF),\n            OutboundLogPublisher::new(bus.clone()),\n""",
              """            SectorBounds::centered(SectorBounds::DEFAULT_HALF),\n            std::sync::Arc::new(dawn_sector::galaxy::Galaxy::demo()),\n            OutboundLogPublisher::new(bus.clone()),\n""",
          )

          cluster = 'crates/dawn-simulation/src/cluster.rs'
          replace(
              cluster,
              """        let (endpoints, partitioned) = spawn_raft_actors(&ids);\n\n        let nodes = ids\n""",
              """        let (endpoints, partitioned) = spawn_raft_actors(&ids);\n        let galaxy = Arc::new(dawn_sector::galaxy::Galaxy::demo());\n\n        let nodes = ids\n""",
          )
          replace(
              cluster,
              """                    SectorBounds::centered(SectorBounds::DEFAULT_HALF),\n                    OutboundLogPublisher::new(bus.clone()),\n""",
              """                    SectorBounds::centered(SectorBounds::DEFAULT_HALF),\n                    Arc::clone(&galaxy),\n                    OutboundLogPublisher::new(bus.clone()),\n""",
          )
          PY
          cargo fmt --all
          git diff --check
          cargo test -p dawn-simulation
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Publish verified fix
        run: |
          rm -f .github/workflows/issue-235-actor-topology.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Pass topology into sector simulator actors'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
