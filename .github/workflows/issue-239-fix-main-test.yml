name: Fix issue 239 GdUnit fixtures

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix-main-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/delete-legacy-client-adapters
          fetch-depth: 0

      - name: Migrate remaining main test fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("client/test/main_test.gd")
          text = path.read_text(encoding="utf-8")

          def replace_exact(old: str, new: str, expected: int = 1) -> None:
              global text
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"expected {expected} matches, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          replace_exact(
              '''func _module_fixture(module_id: int, slot: String, active: bool) -> ModuleRow:
          \treturn ModuleRow.test_fixture(
          \t\tslot, 0, module_id, "Test Module", "", active, true, 0.0, 10
          \t) as ModuleRow
          ''',
              '''func _module_fixture(
          \tmodule_id: int,
          \tslot: String,
          \tactive: bool,
          \tkind: String = "",
          \tindex: int = 0
          ) -> ModuleRow:
          \treturn ModuleRow.test_fixture(
          \t\tslot, index, module_id, "Test Module", kind, active, true, 0.0, 10
          \t) as ModuleRow
          ''',
          )

          replace_exact(
              '''\t_set_loadout_modules([{
          \t\t"slot": "High", "index": 0, "module_id": 5, "name": "Test Module", "kind": "Weapon",
          \t\t"is_active": false, "is_active_module": true,
          \t\t"cap_cost_per_cycle": 0.0, "cycle_time_ticks": 10, "stat_delta": FULL_ZERO_STAT_DELTA,
          \t}])
          ''',
              '''\t_set_loadout_modules([_module_fixture(5, "High", false, "Weapon")])
          ''',
              expected=2,
          )

          replace_exact(
              '''\tvar mid_1: Dictionary = _module_fixture(1, "Mid", false)
          \tvar mid_2: Dictionary = _module_fixture(2, "Mid", false)
          \tmid_2["index"] = 1  # ModuleRow.index is the per-slot-kind position; _module_fixture defaults to 0
          \t_set_loadout_modules([mid_1, mid_2])
          ''',
              '''\tvar mid_1: ModuleRow = _module_fixture(1, "Mid", false)
          \tvar mid_2: ModuleRow = _module_fixture(2, "Mid", false, "", 1)
          \t_set_loadout_modules([mid_1, mid_2])
          ''',
          )

          if "FULL_ZERO_STAT_DELTA" in text:
              raise RuntimeError("legacy FULL_ZERO_STAT_DELTA reference remains")
          if "_set_loadout_modules([{" in text:
              raise RuntimeError("legacy Dictionary module fixture remains")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/issue-239-fix-main-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Fix typed module fixtures in main tests'
          git push origin HEAD:agent/delete-legacy-client-adapters
