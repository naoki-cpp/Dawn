name: Fix PR 210 review findings

on:
  push:
    branches:
      - agent/fix-transit-attempt-receipts

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix(sector): handle return before delayed ack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-transit-attempt-receipts
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          pipeline_path = Path('crates/dawn-sector/src/transit/pipeline.rs')
          pipeline = pipeline_path.read_text()

          helper_anchor = '''fn snapshot_ship<S: EventStore>(node: &SimulationNode<S>, ship_id: ShipId) -> Option<ShipSnapshot> {
              node.take_snapshot()
                  .ships
                  .into_iter()
                  .find(|ship| ship.ship_id == ship_id)
          }
          '''
          helper = helper_anchor + '''
          /// Close a still-pending outgoing attempt before accepting the same Ship
          /// back into this Sector. This occurs when the Ship returns before the Ack
          /// for its previous departure reaches the source: the local ECS entry is a
          /// frozen recovery copy, not an active destination-side materialization.
          fn complete_superseded_outgoing_transit<S: EventStore>(
              node: &mut SimulationNode<S>,
              ship_id: ShipId,
          ) -> bool {
              if !node.is_ship_in_transit(ship_id) {
                  return false;
              }

              let Some(pending) = pending_outgoing_transits(node)
                  .into_iter()
                  .find(|pending| pending.ship_id == ship_id)
              else {
                  return false;
              };
              let Some(frozen) = node.snapshot_for_transit(ship_id) else {
                  return false;
              };

              node.complete_outgoing_transit(
                  &frozen,
                  pending.to,
                  pending.entry_pos_abs,
                  pending.request_tick,
              );
              true
          }
          '''
          if 'fn complete_superseded_outgoing_transit' not in pipeline:
              if pipeline.count(helper_anchor) != 1:
                  raise SystemExit('snapshot_ship anchor not found exactly once')
              pipeline = pipeline.replace(helper_anchor, helper, 1)

          old_commit = '''    let ship_present = node.get_ship_position(ship.ship_id).is_some();
              let completed = destination_completed_transfer(node, ship.ship_id, from, to, request_tick);
              if !completed && !ship_present {
                  node.append_incoming_transit_marker(
                      ship.ship_id,
                      from,
                      to,
                      request_tick,
                      gate_id,
                      entry_pos,
                      entry_pos_abs,
                  );
                  node.handle_transit_commit(ship, from, entry_pos, entry_pos_abs, gate_id, request_tick);
              }
          '''
          new_commit = '''    let completed = destination_completed_transfer(node, ship.ship_id, from, to, request_tick);
              if !completed {
                  // A Ship can return before the Ack for its previous departure reaches
                  // this Sector. In that case the existing entity is an InTransit frozen
                  // recovery copy. Close that older outbox first so the delayed Ack cannot
                  // later delete the newly returned active Ship.
                  if node.get_ship_position(ship.ship_id).is_some()
                      && node.is_ship_in_transit(ship.ship_id)
                  {
                      complete_superseded_outgoing_transit(node, ship.ship_id);
                  }

                  // A non-InTransit Ship with this ID is already the active materialization
                  // for this attempt (or a duplicate delivery), so it remains Ack-only.
                  if node.get_ship_position(ship.ship_id).is_none() {
                      node.append_incoming_transit_marker(
                          ship.ship_id,
                          from,
                          to,
                          request_tick,
                          gate_id,
                          entry_pos,
                          entry_pos_abs,
                      );
                      node.handle_transit_commit(
                          ship,
                          from,
                          entry_pos,
                          entry_pos_abs,
                          gate_id,
                          request_tick,
                      );
                  }
              }
          '''
          if old_commit in pipeline:
              pipeline = pipeline.replace(old_commit, new_commit, 1)
          elif new_commit not in pipeline:
              raise SystemExit('apply_commit block not found')

          test_anchor = '''    fn test_ship(ship_id: ShipId) -> ShipSnapshot {
          '''
          test = '''    #[test]
              fn incoming_return_replaces_unacked_frozen_copy() {
                  let mut sector_a = node(0);
                  let mut sector_b = node(1);
                  let ship_id =
                      sector_a.spawn_ship(ShipTypeId(1), Position::ORIGIN, Velocity::ZERO);

                  let outbound =
                      apply_request(&mut sector_a, ship_id, SectorId(1), None).unwrap();
                  let delayed_outbound_ack = apply_commit(
                      &mut sector_b,
                      &outbound.ship,
                      outbound.from,
                      outbound.to,
                      outbound.entry_pos,
                      outbound.entry_pos_abs,
                      outbound.gate_id,
                      outbound.request_tick,
                  )
                  .unwrap();

                  assert!(sector_a.is_ship_in_transit(ship_id));
                  assert!(!sector_b.is_ship_in_transit(ship_id));

                  let returning =
                      apply_request(&mut sector_b, ship_id, SectorId(0), None).unwrap();
                  let return_ack = apply_commit(
                      &mut sector_a,
                      &returning.ship,
                      returning.from,
                      returning.to,
                      returning.entry_pos,
                      returning.entry_pos_abs,
                      returning.gate_id,
                      returning.request_tick,
                  )
                  .unwrap();

                  assert_eq!(sector_a.ship_count(), 1);
                  assert!(!sector_a.is_ship_in_transit(ship_id));
                  assert!(!has_pending_outgoing_transit(&sector_a));

                  assert!(apply_ack(
                      &mut sector_b,
                      &return_ack.ship,
                      return_ack.from,
                      return_ack.to,
                      return_ack.entry_pos_abs,
                      return_ack.request_tick,
                  ));
                  assert_eq!(sector_b.ship_count(), 0);

                  // The late Ack for A -> B must no longer match an outgoing request
                  // and therefore cannot delete the active Ship that just returned to A.
                  assert!(!apply_ack(
                      &mut sector_a,
                      &delayed_outbound_ack.ship,
                      delayed_outbound_ack.from,
                      delayed_outbound_ack.to,
                      delayed_outbound_ack.entry_pos_abs,
                      delayed_outbound_ack.request_tick,
                  ));
                  assert_eq!(sector_a.ship_count(), 1);
                  assert!(!sector_a.is_ship_in_transit(ship_id));
                  assert!(!has_pending_outgoing_transit(&sector_a));
                  assert!(!has_pending_outgoing_transit(&sector_b));
              }

          '''
          if 'fn incoming_return_replaces_unacked_frozen_copy' not in pipeline:
              if pipeline.count(test_anchor) != 1:
                  raise SystemExit('test anchor not found exactly once')
              pipeline = pipeline.replace(test_anchor, test + test_anchor, 1)

          pipeline_path.write_text(pipeline)

          adr_path = Path('docs/adr/ADR-0014-raft-consensus.md')
          adr = adr_path.read_text()
          adr = adr.replace('updated : 2026-07-29', 'updated : 2026-07-30', 1)
          payload_old = '''    pub from: SectorId,
              pub to: SectorId,
              pub entry_pos: AbsolutePosition,
          '''
          payload_new = '''    pub from: SectorId,
              pub to: SectorId,
              pub request_tick: Tick,
              pub entry_pos: AbsolutePosition,
          '''
          if payload_old in adr:
              adr = adr.replace(payload_old, payload_new, 1)
          elif payload_new not in adr:
              raise SystemExit('ADR payload anchor not found')

          note_anchor = '''`position`・`anchor`は`entry_pos`とdestination側rebaseがauthority、`velocity`はevent本体、
          `tackled_by`はSector-localなので`TransitShipState`へ重複させない。
          '''
          note = note_anchor + '''`request_tick`はsource-localなattempt identityであり、Request → Commit → Completed → Ackの
          全経路で変更せず伝播する。同じShipが同じ経路を複数回通っても別attemptとして照合する。
          '''
          if '全経路で変更せず伝播する' not in adr:
              if adr.count(note_anchor) != 1:
                  raise SystemExit('ADR note anchor not found exactly once')
              adr = adr.replace(note_anchor, note, 1)

          adr = adr.replace('PR #206は次を固定する。', 'PR #206とPR #210は次を固定する。', 1)
          validation_anchor = '- destination Commit後にAckが発行され、Ack後source copyが消える\n'
          validation_line = (
              '- Ack待ちの往路frozen copyが残るSectorへShipが戻っても、旧outboxを先に閉じ、'
              '遅延Ackで返送Shipを消失させない\n'
          )
          if validation_line not in adr:
              if validation_anchor not in adr:
                  raise SystemExit('ADR validation anchor not found')
              adr = adr.replace(validation_anchor, validation_anchor + validation_line, 1)

          adr_path.write_text(adr)
          PY

          cargo fmt
          cargo test -p dawn-sector transit::pipeline::tests::incoming_return_replaces_unacked_frozen_copy
          cargo test -p dawn-sector transit::pipeline::tests

      - name: Commit fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/dawn-sector/src/transit/pipeline.rs docs/adr/ADR-0014-raft-consensus.md
          git commit -m 'fix(sector): handle return before delayed ack'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/fix-transit-attempt-receipts
