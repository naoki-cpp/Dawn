name: Issue 251 review follow-up fix

on:
  push:
    branches:
      - issue-251-client-fact-policy
    paths:
      - .github/workflows/issue-251-review2-fix.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-251-client-fact-policy
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Apply review fixes
        run: |
          python .github/scripts/issue251_review2_patch.py
          cargo fmt --all
      - name: Focused tests
        run: |
          cargo test -p dawn-client-core client_state
          cargo test -p dawn-client-gdext server_message_validation
          cargo test -p dawn-client-gdext
      - name: Workspace checks
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo fmt --all -- --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/dawn-client-core/src/client_state.rs \
                  crates/dawn-client-gdext/src/server_message_gd.rs \
                  crates/dawn-client-gdext/src/server_message_validation.rs
          git diff --cached --check
          git commit -m 'fix(client): scope module events and restore validation tests'
          git push origin HEAD:issue-251-client-fact-policy
