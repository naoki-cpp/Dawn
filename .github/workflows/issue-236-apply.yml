name: Issue 236 apply

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/issue-236-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply implementation
        run: |
          python3 .github/issue-236-core-fix.py
          python3 .github/issue-236-core-fix2.py
          python3 .github/issue-236-core.py
          python3 .github/issue-236-followup.py
          python3 .github/issue-236-tests.py
          python3 .github/issue-236-docs.py
          python3 .github/issue-236-clippy.py
          cargo fmt --all
      - name: Validate implementation
        run: |
          set -euo pipefail
          git diff --check
          if grep -RIn --include='*.rs' --include='*.md' 'TransitShipState' crates docs; then
            echo 'obsolete TransitShipState references remain' >&2
            exit 1
          fi
          if grep -RIn --include='*.rs' 'ShipSnapshot' \
            crates/dawn-sector/src/transit.rs \
            crates/dawn-sector/src/transit \
            crates/dawn-sector/src/node/transit.rs; then
            echo 'persistence ShipSnapshot still crosses Transit code' >&2
            exit 1
          fi
          if grep -RIn --include='*.rs' 'ship_snapshot_from_transit\|snapshot_for_transit' crates/dawn-sector/src; then
            echo 'fake Transit snapshot helpers remain' >&2
            exit 1
          fi
          cargo test -p dawn-core
          cargo test -p dawn-sector
          cargo test -p dawn-wire
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Publish verified implementation
        run: |
          rm -f \
            .github/workflows/issue-236-inventory.yml \
            .github/workflows/issue-236-core-check.yml \
            .github/workflows/issue-236-apply.yml \
            .github/issue-236-core.py \
            .github/issue-236-core-fix.py \
            .github/issue-236-core-fix2.py \
            .github/issue-236-followup.py \
            .github/issue-236-tests.py \
            .github/issue-236-docs.py \
            .github/issue-236-clippy.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Separate Transit handoff state from snapshots'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
