name: Issue 232 rustfmt

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue-232-rustfmt.yml

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/delete-game-data-compat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/delete-game-data-compat

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Format the workspace
        run: cargo fmt --all

      - name: Remove the one-shot workflow
        run: rm .github/workflows/issue-232-rustfmt.yml

      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates .github/workflows/issue-232-rustfmt.yml
          git commit -m "Format game-data fixture migrations"
          git push origin HEAD:agent/delete-game-data-compat
