name: Issue 237 test fixtures

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'agent/canonical-client-item-identity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/canonical-client-item-identity

      - name: Migrate ItemRow GdUnit fixtures
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('client/test/hud_surface_test.gd')
          text = path.read_text()

          new_helper = '''func _item(item_id: ItemIdentity, overrides: Dictionary = {}) -> ItemRow:
          \treturn ItemRow.test_fixture(
          \t\titem_id,
          \t\toverrides.get("name", "Test Item") as String,
          \t\toverrides.get("kind", "") as String,
          \t\toverrides.get("slot", "") as String,
          \t\toverrides.get("count", 1) as int,
          \t) as ItemRow'''
          text, count = re.subn(
              r'func _item\(overrides: Dictionary\) -> ItemRow:\n.*?(?=\n\nfunc _owned_ship)',
              new_helper,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one old helper block, found {count}')

          replacements = {
              '_item({"item_id": "ScrapMetal", "name": "Scrap Metal", "count": 3})':
                  '_item(ItemIdentity.scrap_metal(), {"name": "Scrap Metal", "count": 3})',
              '_item({"item_id": {"Module": 3}, "slot": "Mid", "name": "Afterburner", "count": 2})':
                  '_item(ItemIdentity.module(3) as ItemIdentity, {"slot": "Mid", "name": "Afterburner", "count": 2})',
              '_item({"item_id": "ScrapMetal", "name": "Scrap Metal", "count": 4})':
                  '_item(ItemIdentity.scrap_metal(), {"name": "Scrap Metal", "count": 4})',
              '_item({"module_id": 3, "slot": "Mid", "name": "Afterburner"})':
                  '_item(ItemIdentity.module(3) as ItemIdentity, {"slot": "Mid", "name": "Afterburner"})',
              '_item({"item_id": {"PackagedShip": 7}, "name": "Magpie", "count": 1})':
                  '_item(ItemIdentity.packaged_ship(7) as ItemIdentity, {"name": "Magpie", "count": 1})',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          if 'loadout.apply_payload(JSON.stringify({"inventory":' in text:
              raise SystemExit('legacy ItemRow JSON fixture remains')
          path.write_text(text)
          PY

          git diff --check
          git diff -- client/test/hud_surface_test.gd

      - name: Commit fixture migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add client/test/hud_surface_test.gd
          git commit -m "Migrate ItemRow test fixtures"
          git push origin HEAD:agent/canonical-client-item-identity
