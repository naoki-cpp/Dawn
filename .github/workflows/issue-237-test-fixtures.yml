name: Issue 237 test fixtures

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'agent/canonical-client-item-identity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/canonical-client-item-identity

      - name: Migrate ItemRow GdUnit fixtures
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('client/test/hud_surface_test.gd')
          text = path.read_text().replace('\r\n', '\n')

          new_helper = '''func _item(item_id: ItemIdentity, overrides: Dictionary = {}) -> ItemRow:
          \treturn ItemRow.test_fixture(
          \t\titem_id,
          \t\toverrides.get("name", "Test Item") as String,
          \t\toverrides.get("kind", "") as String,
          \t\toverrides.get("slot", "") as String,
          \t\toverrides.get("count", 1) as int,
          \t) as ItemRow'''
          start = text.index('func _item(')
          end = text.index('func _owned_ship', start)
          text = text[:start] + new_helper + '\n\n' + text[end:]

          def migrate_call(match: re.Match[str]) -> str:
              fields = json.loads(match.group(1))
              item_id = fields.pop('item_id', None)
              if item_id == 'ScrapMetal':
                  identity = 'ItemIdentity.scrap_metal()'
              elif isinstance(item_id, dict) and set(item_id) == {'Module'}:
                  identity = f'ItemIdentity.module({item_id["Module"]}) as ItemIdentity'
              elif isinstance(item_id, dict) and set(item_id) == {'PackagedShip'}:
                  identity = f'ItemIdentity.packaged_ship({item_id["PackagedShip"]}) as ItemIdentity'
              elif item_id is None and 'module_id' in fields:
                  identity = f'ItemIdentity.module({fields.pop("module_id")}) as ItemIdentity'
              else:
                  raise SystemExit(f'unsupported Item fixture identity: {item_id!r}')
              overrides = json.dumps(fields, separators=(', ', ': '))
              return f'_item({identity}, {overrides})'

          text, count = re.subn(r'_item\((\{[^\n]*\})\)', migrate_call, text)
          if count != 5:
              raise SystemExit(f'expected five Item fixture calls, migrated {count}')
          if 'loadout.apply_payload(JSON.stringify({"inventory":' in text or '_item({' in text:
              raise SystemExit('legacy ItemRow fixture remains')
          path.write_text(text)
          PY

          git diff --check
          git diff -- client/test/hud_surface_test.gd

      - name: Commit fixture migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add client/test/hud_surface_test.gd
          git commit -m "Migrate ItemRow test fixtures"
          git push origin HEAD:agent/canonical-client-item-identity
