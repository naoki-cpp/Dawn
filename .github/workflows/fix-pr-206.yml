name: Apply PR 206 review fixes

on:
  push:
    branches:
      - recoverable-sector-transit

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: recoverable-sector-transit

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

