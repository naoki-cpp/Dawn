name: Fix admission review

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-admission-review.yml
      - .github/fix_admission_review.py

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/transactional-client-admission-253

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Apply review fixes
        run: python3 .github/fix_admission_review.py

      - name: Format
        run: cargo fmt --all

      - name: Focused tests
        run: cargo test -p dawn-sector -p dawn-sector-node -p dawn-simulation

      - name: Workspace check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(admission): make commit recovery and resume identity atomic"
          git push origin HEAD:agent/transactional-client-admission-253
