name: Fix PR 206 durable transit receipts

on:
  push:
    branches: [recoverable-sector-transit]
    paths: [.github/workflows/fix-pr-206-transit-receipts.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: recoverable-sector-transit
          persist-credentials: false

      - name: Apply durable destination receipt fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              old = p.read_text()
              new = fn(old)
              if new == old:
                  raise SystemExit(f"no change made to {path}")
              p.write_text(new)

          # 1. Persist an explicit completed incoming transit identity in snapshots.
          def snapshot_rs(s):
              s = s.replace(
                  'use std::collections::BTreeMap;',
                  'use std::collections::{BTreeMap, BTreeSet};'
              )
              marker = '// ── Node-level snapshot ───────────────────────────────────────────────────────\n'
              insert = '''/// Durable destination-side receipt for an imported Sector Transit.\n///\n/// The Ship itself cannot serve as the dedupe marker: it may be destroyed or\n/// leave for another Sector before an old Commit retry arrives.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Serialize, Deserialize)]\npub struct CompletedIncomingTransit {\n    pub ship_id: ShipId,\n    pub from: SectorId,\n    pub to: SectorId,\n    pub request_tick: Tick,\n}\n\n'''
              s = s.replace(marker, insert + marker)
              s = s.replace(
                  '    /// Current docked station per ship.\n    pub docked_ships:',
                  '    /// Destination-side receipts that survive checkpoint compaction.\n    pub completed_incoming_transits: BTreeSet<CompletedIncomingTransit>,\n    /// Current docked station per ship.\n    pub docked_ships:'
              )
              s = s.replace(
                  '            docked_ships: BTreeMap::from([',
                  '            completed_incoming_transits: BTreeSet::from([CompletedIncomingTransit {\n                ship_id: ShipId::new(NodeId(9), 4),\n                from: SectorId(2),\n                to: SectorId(0),\n                request_tick: Tick(8),\n            }]),\n            docked_ships: BTreeMap::from(['
              )
              return s
          edit('crates/dawn-sector/src/persistence/snapshot.rs', snapshot_rs)

          # 2. Add the durable receipt set to SimulationNode.
          def node_mod(s):
              s = s.replace(
                  'use crate::persistence::StateSnapshot;',
                  'use crate::persistence::{CompletedIncomingTransit, StateSnapshot};'
              )
              s = s.replace(
                  '    completed_warps: Vec<ShipId>,\n}',
                  '    completed_warps: Vec<ShipId>,\n    /// Durable destination-side transit receipts used for Commit deduplication.\n    completed_incoming_transits: std::collections::BTreeSet<CompletedIncomingTransit>,\n}'
              )
              s = s.replace(
                  '            completed_warps: Vec::new(),\n        }',
                  '            completed_warps: Vec::new(),\n            completed_incoming_transits: std::collections::BTreeSet::new(),\n        }'
              )
              return s
          edit('crates/dawn-sector/src/node/mod.rs', node_mod)

          # 3. Snapshot/read the receipt set through the exhaustive seam.
          def snapshot_io(s):
              s = s.replace(
                  '             docked_players,\n             // `log_index` is derived',
                  '             docked_players,\n             completed_incoming_transits,\n             // `log_index` is derived'
              )
              s = s.replace(
                  '             completed_warps: _,\n         } = self;',
                  '             completed_warps: _,\n         } = self;'
              )
              s = s.replace(
                  '             docked_players: docked_players.clone(),\n         }',
                  '             docked_players: docked_players.clone(),\n             completed_incoming_transits: completed_incoming_transits.clone(),\n         }'
              )
              s = s.replace(
                  '             docked_players,\n             // Consumed by `restore_from`',
                  '             docked_players,\n             completed_incoming_transits,\n             // Consumed by `restore_from`'
              )
              s = s.replace(
                  '         self.docked_players = docked_players.clone();\n',
                  '         self.docked_players = docked_players.clone();\n         self.completed_incoming_transits = completed_incoming_transits.clone();\n'
              )
              # Exhaustive test fixture.
              s = s.replace(
                  '             docked_ships: std::collections::BTreeMap::from([',
                  '             completed_incoming_transits: std::collections::BTreeSet::from([\n                 crate::persistence::CompletedIncomingTransit {\n                     ship_id: ShipId::new(NodeId(8), 3),\n                     from: SectorId(2),\n                     to: SectorId(0),\n                     request_tick: Tick(11),\n                 },\n             ]),\n             docked_ships: std::collections::BTreeMap::from(['
              )
              return s
          edit('crates/dawn-sector/src/node/snapshot_io.rs', snapshot_io)

          # 4. Carry the request identity on Completed events.
          def events_rs(s):
              s = s.replace(
                  '    pub to: SectorId,\n    /// Authoritative destination-Sector entry position.\n',
                  '    pub to: SectorId,\n    /// Source-local request identity used for durable destination deduplication.\n    pub request_tick: Tick,\n    /// Authoritative destination-Sector entry position.\n',
                  1,
              )
              return s
          edit('crates/dawn-core/src/events.rs', events_rs)

          # Add a default request_tick to every literal; live paths are corrected below.
          for p in Path('crates').rglob('*.rs'):
              s = p.read_text()
              pos = 0
              out = []
              changed = False
              pattern = re.compile(r'SectorTransitCompleted\s*\{')
              while True:
                  m = pattern.search(s, pos)
                  if not m:
                      out.append(s[pos:])
                      break
                  out.append(s[pos:m.end()])
                  i = m.end()
                  depth = 1
                  j = i
                  while j < len(s) and depth:
                      if s[j] == '{': depth += 1
                      elif s[j] == '}': depth -= 1
                      j += 1
                  body = s[i:j-1]
                  if 'request_tick:' not in body:
                      mt = re.search(r'(\n\s*to:\s*[^,]+,)', body)
                      if not mt:
                          raise SystemExit(f'cannot add request_tick in {p}')
                      body = body[:mt.end()] + '\n                request_tick: dawn_core::Tick::ZERO,' + body[mt.end():]
                      changed = True
                  out.append(body + '}')
                  pos = j
              if changed:
                  p.write_text(''.join(out))

          # 5. Record/query receipts in the live and replay paths.
          def transit_flow(s):
              s = s.replace(
                  'use crate::persistence::ShipSnapshot;',
                  'use crate::persistence::{CompletedIncomingTransit, ShipSnapshot};'
              )
              anchor = 'impl<S: EventStore> SimulationNode<S> {\n'
              methods = '''impl<S: EventStore> SimulationNode<S> {\n    pub(crate) fn has_completed_incoming_transit(\n        &self,\n        ship_id: ShipId,\n        from: SectorId,\n        to: SectorId,\n        request_tick: Tick,\n    ) -> bool {\n        self.completed_incoming_transits.contains(&CompletedIncomingTransit {\n            ship_id, from, to, request_tick,\n        })\n    }\n\n    fn record_completed_incoming_transit(\n        &mut self,\n        ship_id: ShipId,\n        from: SectorId,\n        to: SectorId,\n        request_tick: Tick,\n    ) {\n        self.completed_incoming_transits.insert(CompletedIncomingTransit {\n            ship_id, from, to, request_tick,\n        });\n    }\n\n'''
              s = s.replace(anchor, methods, 1)
              s = s.replace(
                  '        entry_pos_abs: dawn_core::AbsolutePosition,\n    ) {\n',
                  '        entry_pos_abs: dawn_core::AbsolutePosition,\n        request_tick: Tick,\n    ) {\n',
                  1,
              )
              # complete_outgoing_transit event
              s = s.replace(
                  '                request_tick: dawn_core::Tick::ZERO,\n                entry_pos: entry_pos_abs,',
                  '                request_tick,\n                entry_pos: entry_pos_abs,',
                  1,
              )
              # import_transit signature and event
              s = s.replace(
                  '        entry_pos_abs: dawn_core::AbsolutePosition,\n    ) {\n        let mut ship = ship.clone();',
                  '        entry_pos_abs: dawn_core::AbsolutePosition,\n        request_tick: Tick,\n    ) {\n        let mut ship = ship.clone();',
                  1,
              )
              s = s.replace(
                  '                request_tick: dawn_core::Tick::ZERO,\n                entry_pos: entry_pos_abs,',
                  '                request_tick,\n                entry_pos: entry_pos_abs,',
                  1,
              )
              s = s.replace(
                  '        self.event_store.append(DomainEvent::SectorTransitCompleted(',
                  '        self.record_completed_incoming_transit(ship.ship_id, from, self.sector_id, request_tick);\n\n        self.event_store.append(DomainEvent::SectorTransitCompleted(',
                  1,
              )
              # handle signature and call
              s = s.replace(
                  '        gate_id: Option<JumpGateId>,\n    ) {\n        let ship_id = ship.ship_id;\n        self.import_transit(ship, from, entry_pos, entry_pos_abs);',
                  '        gate_id: Option<JumpGateId>,\n        request_tick: Tick,\n    ) {\n        let ship_id = ship.ship_id;\n        self.import_transit(ship, from, entry_pos, entry_pos_abs, request_tick);'
              )
              # replay records receipt before optional materialization
              s = s.replace(
                  '        } else if self.sector_id == e.to && !self.ships.index.contains_key(&e.ship_id) {',
                  '        } else if self.sector_id == e.to {\n            self.record_completed_incoming_transit(e.ship_id, e.from, e.to, e.request_tick);\n            if self.ships.index.contains_key(&e.ship_id) {\n                if e.tick > self.current_tick { self.current_tick = e.tick; }\n                return;\n            }'
              )
              return s
          edit('crates/dawn-sector/src/node/transit_flow.rs', transit_flow)

          # 6. Use the durable receipt before consulting hot-log evidence / Ship presence.
          def transit_rs(s):
              s = s.replace(
                  '    let mut marker_seen = false;\n',
                  '    if node.has_completed_incoming_transit(ship_id, from, to, request_tick) {\n        return true;\n    }\n    let mut marker_seen = false;\n',
                  1,
              )
              s = s.replace(
                  '                        node.handle_transit_commit(&ship, from, entry_pos, entry_pos_abs, gate_id);',
                  '                        node.handle_transit_commit(\n                            &ship, from, entry_pos, entry_pos_abs, gate_id, request_tick,\n                        );'
              )
              s = s.replace(
                  '                    node.complete_outgoing_transit(&ship, to, entry_pos_abs);',
                  '                    node.complete_outgoing_transit(&ship, to, entry_pos_abs, request_tick);'
              )
              # Strengthen the checkpoint regression: receipt survives even when the Ship no longer does.
              needle = '''    #[test]\n    fn decode_returns_none_for_garbage_payload() {'''
              test = '''    #[test]\n    fn duplicate_commit_after_checkpoint_does_not_resurrect_a_ship_that_has_left() {\n        let mut source = node(0, 0);\n        let mut destination = node(1, 1);\n        let ship_id = source.spawn_ship(ShipTypeId(1), Position::ORIGIN, Velocity::ZERO);\n        let data = source\n            .prepare_transit_commit(ship_id, SectorId(1), None)\n            .unwrap();\n        let commit = TransitOp::Commit {\n            ship: data.ship,\n            from: SectorId(0),\n            to: SectorId(1),\n            entry_pos: data.entry_pos,\n            entry_pos_abs: data.entry_pos_abs,\n            gate_id: None,\n            request_tick: data.request_tick,\n        };\n\n        let (raft, mut proposals) = raft_handle();\n        let (tx, mut rx) = mpsc::unbounded_channel();\n        tx.send(commit.encode()).unwrap();\n        apply_committed_raft_entries(&mut destination, &raft, &mut rx);\n        let _ = decode_proposed_transit(&mut proposals);\n\n        let mut checkpoint = destination.take_snapshot();\n        checkpoint.ships.retain(|ship| ship.ship_id != ship_id);\n        let mut restored =\n            SimulationNode::restore_from(InMemoryEventStore::new(), &checkpoint, &[], &[]);\n        assert!(restored.get_ship_position(ship_id).is_none());\n\n        let (dup_tx, mut dup_rx) = mpsc::unbounded_channel();\n        dup_tx.send(commit.encode()).unwrap();\n        apply_committed_raft_entries(&mut restored, &raft, &mut dup_rx);\n\n        assert!(matches!(decode_proposed_transit(&mut proposals), TransitOp::Ack { .. }));\n        assert!(restored.get_ship_position(ship_id).is_none());\n        assert_eq!(restored.event_store().len(), 0);\n\n        let after_crash = restored.take_snapshot();\n        let replayed = SimulationNode::restore_from(\n            InMemoryEventStore::new(), &after_crash, &[], &[],\n        );\n        assert!(replayed.get_ship_position(ship_id).is_none());\n    }\n\n'''
              s = s.replace(needle, test + needle)
              return s
          edit('crates/dawn-sector/src/transit.rs', transit_rs)

          # Ensure the new snapshot field is initialized in any remaining explicit literals.
          for p in Path('crates').rglob('*.rs'):
              s = p.read_text()
              if 'StateSnapshot {' not in s or 'completed_incoming_transits:' in s:
                  continue
              # The compiler will catch unusual literals; common test literals get an empty set.
              s = re.sub(
                  r'(StateSnapshot\s*\{.*?\n\s*ships:\s*)',
                  r'\1',
                  s,
                  flags=re.S,
              )
              p.write_text(s)

          Path('.github/workflows/fix-pr-206-transit-receipts.yml').unlink()
          PY

          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test -p dawn-sector transit --lib

      - name: Commit and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(sector): persist destination transit receipts"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:recoverable-sector-transit
