name: Apply issue 222

on:
  push:
    branches:
      - agent/remove-legacy-navigation-target-wire-shapes
    paths:
      - tools/apply_issue_222.py
      - .github/workflows/apply-issue-222.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-navigation-target-wire-shapes
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply typed navigation target migration
        run: python tools/apply_issue_222.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Regenerate wire schemas
        run: cargo run -p dawn-actor --example gen_wire_schema

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Remove temporary migration files
        run: |
          rm -f tools/apply_issue_222.py
          rm -f .github/workflows/apply-issue-222.yml
          rm -f docs/architecture/navigation-target-wire-shapes.md

      - name: Commit implementation
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: require tagged navigation targets"
          git push origin HEAD:agent/remove-legacy-navigation-target-wire-shapes
