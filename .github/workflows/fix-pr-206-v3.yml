name: Apply PR 206 review fixes v3

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 206 && github.head_ref == 'recoverable-sector-transit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: recoverable-sector-transit

      - name: Apply review fixes
        shell: bash
        run: |
          git show a5be40e955eff2748187dae1a85d6f9196b9aeb2:.github/workflows/fix-pr-206.yml > /tmp/fix-pr-206.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fix-pr-206-v2.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("          PY\n", start)
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in source[start:end].splitlines()
          )
          code = code.replace("Path('.github/workflows/fix-pr-206.yml')", "Path('/tmp/fix-pr-206.yml')")
          code = code.replace(
              "exec(compile(script, 'fix-pr-206.py', 'exec'))",
              "legacy_scope = {}; exec(compile(script, 'fix-pr-206.py', 'exec'), legacy_scope, legacy_scope)",
              1,
          )
          code = "\n".join(
              "    r'    fn freeze_transit_components\\(&mut self\\).*?(?=    pub fn tick_with_lock_commands)',"
              if "r'    fn freeze_transit_components" in line
              else line
              for line in code.splitlines()
          )
          exec(compile(code, 'fix-pr-206.py', 'exec'))
          PY

      - name: Format
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Test affected crates
        run: cargo test -p dawn-core -p dawn-sector

      - name: Clippy affected crates
        run: cargo clippy -p dawn-core -p dawn-sector --all-targets -- -D warnings

      - name: Commit fixes and remove temporary files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git rm -f --ignore-unmatch .github/workflows/fix-pr-206-v2.yml
          git rm -f --ignore-unmatch .github/workflows/fix-pr-206-v3.yml
          git rm -f --ignore-unmatch .github/fix-pr-206-trigger
          git add crates/dawn-core/src/events.rs \
                  crates/dawn-sector/src/node/tick.rs \
                  crates/dawn-sector/src/node/transit_flow.rs \
                  crates/dawn-sector/src/transit.rs \
                  docs/architecture/tick-model.md \
                  docs/architecture/event-catalog.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sector): address transit recovery review"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:recoverable-sector-transit
