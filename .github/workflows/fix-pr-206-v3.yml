name: Apply PR 206 review fixes v3

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 206 && github.head_ref == 'recoverable-sector-transit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: recoverable-sector-transit

      - name: Apply review fixes
        shell: bash
        run: |
          git show a5be40e955eff2748187dae1a85d6f9196b9aeb2:.github/workflows/fix-pr-206.yml > /tmp/fix-pr-206.yml
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/fix-pr-206-v2.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("          PY\n", start)
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in source[start:end].splitlines()
          )
          code = code.replace("Path('.github/workflows/fix-pr-206.yml')", "Path('/tmp/fix-pr-206.yml')")
          code = code.replace(
              "exec(compile(script, 'fix-pr-206.py', 'exec'))",
              "legacy_scope = {}; exec(compile(script, 'fix-pr-206.py', 'exec'), legacy_scope, legacy_scope)",
              1,
          )
          old_once = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label}: source pattern not found')
              return text.replace(old, new, 1)
          '''
          new_once = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  print(f'{label}: already applied or structurally replaced')
                  return text
              return text.replace(old, new, 1)
          '''
          old_regex = '''def replace_regex(text: str, pattern: str, new: str, label: str) -> str:
              updated, count = re.subn(pattern, new, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{label}: expected one structural match, found {count}')
              return updated
          '''
          new_regex = '''def replace_regex(text: str, pattern: str, new: str, label: str) -> str:
              if label == 'freeze/restore functions':
                  start_name = text.find('fn freeze_transit_components')
                  end_name = text.find('tick_with_lock_commands', start_name)
                  if start_name < 0 or end_name < 0:
                      raise SystemExit('freeze function boundaries not found')
                  start = text.rfind(chr(10), 0, start_name) + 1
                  end = text.rfind(chr(10), 0, end_name) + 1
                  return text[:start] + new + chr(10) + text[end:]
              updated, count = re.subn(pattern, new, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{label}: expected one structural match, found {count}')
              return updated
          '''
          if old_once not in code or old_regex not in code:
              raise SystemExit('repair helpers not found')
          code = code.replace(old_once, new_once, 1)
          code = code.replace(old_regex, new_regex, 1)
          exec(compile(code, 'fix-pr-206.py', 'exec'))

          # The legacy literal completion pass treats shorthand fields such as
          # `request_tick,` as absent. Remove the duplicate defaults it inserted.
          transit_flow_path = Path('crates/dawn-sector/src/node/transit_flow.rs')
          transit_flow = transit_flow_path.read_text()
          duplicate = re.compile(
              r'(?P<indent>^[ \t]*)request_tick,\n'
              r'(?P=indent)gate_id,\n'
              r'(?P=indent)entry_pos,\n'
              r'(?P=indent)entry_pos_abs,\n'
              r'(?P=indent)request_tick:\s*[^,\n]+,\n'
              r'(?P=indent)gate_id:\s*None,\n'
              r'(?P=indent)entry_pos:\s*dawn_core::Position::ORIGIN,\n'
              r'(?P=indent)entry_pos_abs:\s*dawn_core::AbsolutePosition::ORIGIN,\n',
              re.MULTILINE,
          )
          transit_flow, duplicate_count = duplicate.subn(
              lambda match: ''.join(
                  f"{match.group('indent')}{field},\n"
                  for field in ('request_tick', 'gate_id', 'entry_pos', 'entry_pos_abs')
              ),
              transit_flow,
          )
          if duplicate_count != 1:
              raise SystemExit(f'expected one duplicated route block, found {duplicate_count}')
          transit_flow_path.write_text(transit_flow)

          # Restore saved LockComp values without overlapping hecs mutable borrows.
          tick_path = Path('crates/dawn-sector/src/node/tick.rs')
          tick = tick_path.read_text()
          old_lock_restore = '''        for (entity, component) in related_locks {
              if let Some(mut current) = self.world.get_mut::<LockComp>(entity) {
                  *current = component;
              } else {
                  let _ = self.world.insert_one(entity, component);
              }
          }
          '''
          new_lock_restore = '''        for (entity, component) in related_locks {
              let _ = self.world.remove_one::<LockComp>(entity);
              let _ = self.world.insert_one(entity, component);
          }
          '''
          if old_lock_restore not in tick:
              raise SystemExit('LockComp restore block not found')
          tick_path.write_text(tick.replace(old_lock_restore, new_lock_restore, 1))

          # Complete every remaining old SectorTransitRequested literal using a
          # balanced-brace scan, including test literals with nested expressions.
          def complete_requested_literals(path: Path) -> None:
              text = path.read_text()
              cursor = 0
              changed = False
              while True:
                  marker_at = text.find('SectorTransitRequested {', cursor)
                  if marker_at < 0:
                      break
                  open_at = text.find('{', marker_at)
                  depth = 0
                  close_at = -1
                  for position in range(open_at, len(text)):
                      char = text[position]
                      if char == '{':
                          depth += 1
                      elif char == '}':
                          depth -= 1
                          if depth == 0:
                              close_at = position
                              break
                  if close_at < 0:
                      raise SystemExit(f'{path}: unbalanced SectorTransitRequested literal')
                  body = text[open_at + 1:close_at]
                  if 'pub ship_id:' not in body and 'request_tick' not in body:
                      required = all(
                          re.search(rf'^\s*{field}(?::|,)', body, re.MULTILINE)
                          for field in ('ship_id', 'from', 'to')
                      )
                      tick_match = re.search(
                          r'^(?P<indent>\s*)tick:\s*(?P<expr>[^,\n]+),\s*$',
                          body,
                          re.MULTILINE,
                      )
                      if required and tick_match is not None:
                          indent = tick_match.group('indent')
                          expression = tick_match.group('expr')
                          prefix = '' if path.as_posix() == 'crates/dawn-core/src/events.rs' else 'dawn_core::'
                          insertion = (
                              f'{indent}request_tick: {expression},\n'
                              f'{indent}gate_id: None,\n'
                              f'{indent}entry_pos: {prefix}Position::ORIGIN,\n'
                              f'{indent}entry_pos_abs: {prefix}AbsolutePosition::ORIGIN,\n'
                          )
                          insert_at = open_at + 1 + tick_match.start()
                          text = text[:insert_at] + insertion + text[insert_at:]
                          changed = True
                          cursor = insert_at + len(insertion)
                          continue
                  cursor = close_at + 1
              if changed:
                  path.write_text(text)

          for rust_path in Path('crates').rglob('*.rs'):
              complete_requested_literals(rust_path)
          PY

      - name: Format
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Test affected crates
        run: cargo test -p dawn-core -p dawn-sector

      - name: Clippy affected crates
        run: cargo clippy -p dawn-core -p dawn-sector --all-targets -- -D warnings

      - name: Commit fixes and remove temporary files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git rm -f --ignore-unmatch .github/workflows/fix-pr-206-v2.yml
          git rm -f --ignore-unmatch .github/workflows/fix-pr-206-v3.yml
          git rm -f --ignore-unmatch .github/fix-pr-206-trigger
          git add crates/dawn-core/src/events.rs \
                  crates/dawn-sector/src/node/tick.rs \
                  crates/dawn-sector/src/node/transit_flow.rs \
                  crates/dawn-sector/src/transit.rs \
                  docs/architecture/tick-model.md \
                  docs/architecture/event-catalog.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sector): address transit recovery review"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:recoverable-sector-transit
