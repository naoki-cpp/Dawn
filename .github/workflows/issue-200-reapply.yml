name: Reapply issue 200 implementation

on:
  push:
    branches:
      - agent/issue-200-single-source-rules

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Reapply corrected patch
        shell: bash
        run: |
          git show 56de217a8c69ce0de3fe9ad4685aba6b7c2bcb6e:.github/workflows/issue-200-apply.yml > /tmp/issue-200-old.yml
          python3 <<'PY'
          from pathlib import Path

          workflow = Path("/tmp/issue-200-old.yml").read_text()
          marker = "          python3 > /tmp/issue-200-patch.log 2>&1 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          old = 'replace_count("client/scripts/world_presentation.gd", "_world_scale", "_render_scale()", 4)'
          new = 'replace_count("client/scripts/world_presentation.gd", "_world_scale", "_render_scale()", 5)'
          if script.count(old) != 1:
              raise RuntimeError("could not locate the world presentation replacement count")
          Path("/tmp/issue-200-patch.py").write_text(script.replace(old, new))
          PY

          set +e
          python3 /tmp/issue-200-patch.py > /tmp/issue-200-reapply.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ $status -ne 0 ]]; then
            git reset --hard HEAD
            cp /tmp/issue-200-reapply.log .issue-200-patch-error.log
            rm -f .github/workflows/issue-200-reapply.yml .issue-200-reapply-trigger
            git add -A
            git commit -m "chore: record corrected issue 200 patch failure"
            git push
            exit 1
          fi

          cargo fmt --all
          rm -f .issue-200-patch-error.log
          rm -f .github/workflows/issue-200-reapply.yml .issue-200-reapply-trigger
          git add -A
          git commit -m "refactor(client): single-source render and warp rules"
          git push
