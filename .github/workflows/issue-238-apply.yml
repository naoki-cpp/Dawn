name: Apply issue 238 implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/issue-238.patch.gz.b64
      - .github/workflows/issue-238-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply implementation
        run: |
          base64 --decode scripts/issue-238.patch.gz.b64 | gzip --decompress > /tmp/issue-238.patch
          git apply --index /tmp/issue-238.patch
          cargo fmt --all
      - name: Validate Rust client layers
        run: |
          cargo test -p dawn-client-core
          cargo test -p dawn-client-gdext
          cargo clippy -p dawn-client-core -p dawn-client-gdext --all-targets -- -D warnings
      - name: Publish implementation
        run: |
          rm scripts/issue-238.patch.gz.b64
          rm .github/workflows/issue-238-export.yml
          rm .github/workflows/issue-238-apply.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Apply typed server outcomes directly to WorldSession"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
