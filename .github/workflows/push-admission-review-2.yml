name: Publish admission review 2 fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-admission-review-2-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.number == 260 && github.head_ref == 'agent/transactional-client-admission-253'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/transactional-client-admission-253
          fetch-depth: 0
          persist-credentials: false

      - name: Apply already-validated patch
        run: |
          python3 .github/apply-admission-review-2.py
          cargo fmt --all
          rm .github/apply-admission-review-2.py

      - name: Commit code without workflow changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates docs .github/apply-admission-review-2.py
          git commit -m "fix(admission): persist ids and serialize resumes"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/transactional-client-admission-253
