name: Issue 251 GdUnit fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'issue-251-client-fact-policy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Update GdUnit fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: anchor count for {old[:60]!r} is {text.count(old)}')
              file.write_text(text.replace(old, new))

          replace(
              'client/test/market_surface_test.gd',
              '\t\ttarget, WorldSession.new(), PlayerLoadout.new(), -1\n',
              '\t\ttarget, target, WorldSession.new(), PlayerLoadout.new(), -1\n',
          )

          replace(
              'client/test/world_session_test.gd',
              '\n\tfunc _accept_event(event: ServerEventOutcome) -> void:\n\t\tevent.dispatch(self)\n',
              '',
          )
          replace(
              'client/test/world_session_test.gd',
              '\tassert_bool(outcome.dispatch(target, _session, loadout, connection_ship_id)).is_true()\n',
              '\tassert_bool(outcome.dispatch(\n\t\ttarget, target, _session, loadout, connection_ship_id\n\t)).is_true()\n',
          )

          replace(
              'client/test/planet_visibility_test.gd',
              '\t\tconnection, _main._session, _main._loadout, connection.ship_id\n',
              '\t\tconnection, _main, _main._session, _main._loadout, connection.ship_id\n',
          )

          replace(
              'client/test/main_test.gd',
              '\n\tfunc _accept_event(event: ServerEventOutcome) -> void:\n\t\tevent.dispatch(self)\n',
              '',
          )
          replace(
              'client/test/main_test.gd',
              '\tassert_bool(outcome.dispatch(\n\t\tTypedOutcomeTarget.new(), _main._session, _main._loadout, connection_ship_id\n\t)).is_true()\n',
              '\tvar target := TypedOutcomeTarget.new()\n\tassert_bool(outcome.dispatch(\n\t\ttarget, target, _main._session, _main._loadout, connection_ship_id\n\t)).is_true()\n',
          )

          remaining = []
          for path in Path('client/test').glob('*.gd'):
              text = path.read_text()
              if 'ServerEventOutcome' in text:
                  remaining.append(str(path))
          if remaining:
              raise SystemExit(f'obsolete ServerEventOutcome references: {remaining}')
          PY
      - name: Build adapter
        run: cargo build -p dawn-client-gdext
      - name: Commit and remove temporary workflow
        run: |
          git rm -f .github/workflows/issue-251-gdunit-fix.yml
          git add -A
          git commit -m "test: align GdUnit fixtures with explicit targets"
          git push origin HEAD:${{ github.head_ref }}
