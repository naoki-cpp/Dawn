name: Apply transit fix on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/fix-transit-attempt-receipts' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-transit-attempt-receipts
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply and validate fix
        shell: bash
        run: |
          python3 .github/scripts/apply_transit_attempt_fix.py
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          flow_path = Path('crates/dawn-sector/src/node/transit_flow.rs')
          flow = flow_path.read_text()
          flow = replace_once(
              flow,
              """    pub fn complete_outgoing_transit(
                  &mut self,
                  ship: &ShipSnapshot,
                  to: SectorId,
                  entry_pos_abs: dawn_core::AbsolutePosition,
              ) {
          """,
              """    pub fn complete_outgoing_transit(
                  &mut self,
                  ship: &ShipSnapshot,
                  to: SectorId,
                  entry_pos_abs: dawn_core::AbsolutePosition,
                  request_tick: Tick,
              ) {
          """,
              'complete_outgoing_transit signature',
          )
          flow = replace_once(
              flow,
              """    pub(super) fn import_transit(
                  &mut self,
                  ship: &ShipSnapshot,
                  from: SectorId,
                  entry_pos: Position,
                  entry_pos_abs: dawn_core::AbsolutePosition,
              ) {
          """,
              """    pub(super) fn import_transit(
                  &mut self,
                  ship: &ShipSnapshot,
                  from: SectorId,
                  entry_pos: Position,
                  entry_pos_abs: dawn_core::AbsolutePosition,
                  request_tick: Tick,
              ) {
          """,
              'import_transit signature',
          )
          flow = replace_once(
              flow,
              '        self.import_transit(ship, from, entry_pos, entry_pos_abs);\n',
              '        self.import_transit(ship, from, entry_pos, entry_pos_abs, request_tick);\n',
              'import_transit call',
          )
          flow_path.write_text(flow)

          pipeline_path = Path('crates/dawn-sector/src/transit/pipeline.rs')
          pipeline = pipeline_path.read_text()
          pipeline = replace_once(
              pipeline,
              '    node.complete_outgoing_transit(ship, to, entry_pos_abs);\n',
              '    node.complete_outgoing_transit(ship, to, entry_pos_abs, request_tick);\n',
              'Ack completion call',
          )
          pipeline = replace_once(
              pipeline,
              '        source.complete_outgoing_transit(&proposal.ship, proposal.to, proposal.entry_pos_abs);\n',
              """        source.complete_outgoing_transit(
              &proposal.ship,
              proposal.to,
              proposal.entry_pos_abs,
              proposal.request_tick,
          );
          """,
              'pipeline checkpoint-gate test call',
          )
          pipeline_path.write_text(pipeline)
          PY
          python3 .github/scripts/fix_transit_test_calls.py
          cargo fmt --all
          cargo check --workspace
          cargo test -p dawn-sector repeated_same_route_replay_preserves_each_attempt_receipt_after_checkpoint
          git diff --check

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates docs/architecture/event-catalog.md
          git commit -m "fix(sector): correlate transit receipts by attempt"
          git push origin HEAD:agent/fix-transit-attempt-receipts
