name: Rust CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  apply-transit-review-fix:
    if: github.head_ref == 'agent/deepen-transit-handoff'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/deepen-transit-handoff
          fetch-depth: 0
          persist-credentials: true

      - name: Fix Transit replay comparison
        run: >-
          python3 -c "from pathlib import Path; p=Path('crates/dawn-sector/src/node/transit.rs');
          s=p.read_text(); old='self.world.transit_state(entity) == TransitState::InTransit { to: e.to }';
          new='self.world.transit_state(entity) == (TransitState::InTransit { to: e.to })';
          assert old in s; p.write_text(s.replace(old, new, 1))"

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Format and restore the standard CI workflow
        run: |
          cargo fmt --all
          git show origin/main:.github/workflows/rust-ci.yml > .github/workflows/rust-ci.yml

      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dawn-sector/src/node/transit.rs crates/dawn-sector/src/transit/handoff.rs .github/workflows/rust-ci.yml
          git commit -m "fix(sector): preserve Transit invariants after review"
          git push origin HEAD:agent/deepen-transit-handoff
