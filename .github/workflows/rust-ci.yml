name: Rust CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  apply-transit-review-fix:
    if: github.head_ref == 'agent/deepen-transit-handoff'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/deepen-transit-handoff
          fetch-depth: 0
          persist-credentials: true

      - name: Restore strong tests and apply review fixes
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          path = Path("crates/dawn-sector/src/node/transit.rs")
          current = path.read_text()
          main = subprocess.check_output(
              ["git", "show", f"origin/main:{path.as_posix()}"],
              text=True,
          )

          current = current.replace(
              "self.world.transit_state(entity) == TransitState::InTransit { to: e.to }",
              "self.world.transit_state(entity) == (TransitState::InTransit { to: e.to })",
          )

          marker = "#[cfg(test)]\nmod tests {"
          current_impl = current[: current.index(marker)]
          main_tests = main[main.index(marker) :]

          atomic_test = r'''

    #[test]
    fn prepare_transit_commit_rolls_back_when_handoff_snapshot_is_incomplete() {
        let mut node = mem_node();
        let ship_id = node.spawn_ship(ShipTypeId(1), Position::ORIGIN, Velocity::ZERO);
        let entity = *node.ships.index.get(&ship_id).unwrap();
        let _ = node.world.remove_one::<VelocityComp>(entity).unwrap();
        let event_count = node.total_event_count();

        assert!(node
            .prepare_transit_commit(ship_id, SectorId(1), None)
            .is_none());
        assert_eq!(node.world.transit_state(entity), TransitState::None);
        assert_eq!(node.total_event_count(), event_count);
        assert!(node.can_propose_transit(ship_id));
        assert!(!node.event_store().all_records().iter().any(|record| {
            matches!(record.event, DomainEvent::SectorTransitRequested(_))
        }));
    }
'''
          atomic_anchor = "\n    #[test]\n    fn propose_transit_is_rejected_when_ship_is_already_in_transit()"
          if atomic_anchor not in main_tests:
              raise SystemExit("atomic test insertion anchor not found")
          main_tests = main_tests.replace(atomic_anchor, atomic_test + atomic_anchor, 1)

          stale_abort_test = r'''

    #[test]
    fn replaying_stale_abort_for_an_old_route_keeps_the_current_marker() {
        let mut node = mem_node();
        let ship_id = node.spawn_ship(ShipTypeId(1), Position::ORIGIN, Velocity::ZERO);
        for event in [
            DomainEvent::SectorTransitRequested(dawn_core::events::SectorTransitRequested {
                ship_id,
                from: SectorId(0),
                to: SectorId(1),
                request_tick: Tick(1),
                gate_id: None,
                entry_pos: dawn_core::AbsolutePosition::ORIGIN,
                tick: Tick(1),
            }),
            DomainEvent::SectorTransitRequested(dawn_core::events::SectorTransitRequested {
                ship_id,
                from: SectorId(0),
                to: SectorId(2),
                request_tick: Tick(2),
                gate_id: None,
                entry_pos: dawn_core::AbsolutePosition::ORIGIN,
                tick: Tick(2),
            }),
            DomainEvent::SectorTransitAborted(dawn_core::events::SectorTransitAborted {
                ship_id,
                from: SectorId(0),
                to: SectorId(1),
                tick: Tick(3),
            }),
        ] {
            node.apply_event_pub(event);
        }

        let entity = *node.ships.index.get(&ship_id).unwrap();
        assert_eq!(
            node.world.transit_state(entity),
            TransitState::InTransit { to: SectorId(2) }
        );
    }
'''
          abort_anchor = "\n    #[test]\n    fn replaying_completed_on_the_source_sector_removes_the_ship()"
          if abort_anchor not in main_tests:
              raise SystemExit("abort test insertion anchor not found")
          main_tests = main_tests.replace(abort_anchor, stale_abort_test + abort_anchor, 1)

          path.write_text(current_impl + main_tests)
          PY

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Format and restore workflows
        run: |
          cargo fmt --all
          git show origin/main:.github/workflows/rust-ci.yml > .github/workflows/rust-ci.yml
          rm -f .github/workflows/one-shot-transit-review-fix.yml

      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dawn-sector/src/node/transit.rs .github/workflows/rust-ci.yml .github/workflows/one-shot-transit-review-fix.yml
          git commit -m "fix(sector): preserve Transit invariants after review"
          git push origin HEAD:agent/deepen-transit-handoff
