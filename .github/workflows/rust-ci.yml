name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Enforced locally by .claude/hooks/check-rust-fmt.py on every edit
      # (AI_DEVELOPMENT_GUIDE.md §8) -- CI is the hard gate behind that
      # advisory hook.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # -D warnings turns every clippy lint (including pedantic ones already
      # clean across the workspace as of this workflow's introduction) into a
      # hard failure, so new lint violations can't sneak in silently.
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace

      # Catches broken intra-doc links and other rustdoc warnings (Rust API
      # Guidelines C-LINK) that `cargo test --workspace`'s doctests don't
      # surface -- doctests only fail on wrong/panicking *code*, not on
      # rustdoc itself warning about e.g. an unresolved `[Foo]` reference.
      - name: cargo doc (deny warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  coverage:
    name: coverage (report only, does not gate merges)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Informational only -- no --fail-under-lines/--fail-under-functions,
      # so this job never blocks a PR on a coverage number. Baseline as of
      # this workflow's introduction (2026-07) is ~83% lines workspace-wide;
      # revisit adding a threshold once that baseline has been observed for
      # a while.
      - name: cargo llvm-cov --workspace (summary to job summary)
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov --workspace --summary-only >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
