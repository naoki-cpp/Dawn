name: Rust CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  restore-transit-tests:
    if: github.head_ref == 'agent/deepen-transit-handoff'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/deepen-transit-handoff
          fetch-depth: 0
          persist-credentials: true

      - name: Restore original tests and add regressions
        run: python3 scripts/apply-transit-review-fix.py

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Format and restore standard workflow
        run: |
          cargo fmt --all
          git show origin/main:.github/workflows/rust-ci.yml > .github/workflows/rust-ci.yml
          rm scripts/apply-transit-review-fix.py

      - name: Commit restored regression coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dawn-sector/src/node/transit.rs .github/workflows/rust-ci.yml scripts/apply-transit-review-fix.py
          git commit -m "test(sector): restore Transit regression coverage"
          git push origin HEAD:agent/deepen-transit-handoff
