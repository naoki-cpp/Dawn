name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Enforced locally by .claude/hooks/check-rust-fmt.py on every edit
      # (AI_DEVELOPMENT_GUIDE.md §8) -- CI is the hard gate behind that
      # advisory hook.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # -D warnings turns every clippy lint (including pedantic ones already
      # clean across the workspace as of this workflow's introduction) into a
      # hard failure, so new lint violations can't sneak in silently.
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace
