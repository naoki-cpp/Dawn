name: Fix issue 238 GdUnit migration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-238-gdunit-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Migrate remaining typed GdUnit fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          market = Path('client/test/market_surface_test.gd')
          market.write_text('''## Minimal scene-tree contract tests for the Market UI surface.
extends GdUnitTestSuite

const MarketSurface = preload("res://scripts/market_surface.gd")


class MarketOutcomeTarget:
\textends RefCounted

\tvar snapshot: MarketSnapshot

\tfunc _accept_market_snapshot(value: MarketSnapshot) -> void:
\t\tsnapshot = value


func test_market_surface_can_open_and_apply_a_snapshot() -> void:
\tvar hud := CanvasLayer.new()
\tadd_child(hud)
\tvar surface := MarketSurface.new()
\tsurface.build(hud, Callable(), Callable(), Callable())

\tvar target := MarketOutcomeTarget.new()
\tvar outcome: ServerMessageOutcome = ServerMessageDecoder.new().test_outcome("MarketSnapshot")
\tassert_bool(outcome.dispatch(
\t\ttarget, WorldSession.new(), PlayerLoadout.new(), -1
\t)).is_true()

\tassert_bool(surface.is_open()).is_false()
\tassert_bool(surface.toggle()).is_true()
\tsurface.apply_snapshot(target.snapshot)
\tassert_str(surface._balance_label.text).is_equal("Currency: 250")
\tassert_str(surface._notice_label.text).is_equal("Ready")
\tsurface.set_open(false)
\tassert_bool(surface.is_open()).is_false()
''')

          main = Path('client/test/main_test.gd')
          source = main.read_text()
          old = 'var accepted := _main._session.apply_undock_event'
          new = 'var accepted: bool = _main._session.apply_undock_event'
          count = source.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 undock inference sites, found {count}')
          main.write_text(source.replace(old, new))
          PY
      - name: Publish GdUnit migration fixes
        run: |
          rm .github/workflows/issue-238-gdunit-fix.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix typed GdUnit fixtures"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
