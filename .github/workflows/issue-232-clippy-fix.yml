name: Issue 232 clippy fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue-232-clippy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/delete-game-data-compat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/delete-game-data-compat

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply Clippy suggestions
        run: cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings

      - name: Format the workspace
        run: cargo fmt --all

      - name: Verify legacy names stay deleted
        run: |
          ! grep -R "all_modules()\|all_ship_types()\|data_loader" crates/dawn-sector/src

      - name: Remove the one-shot workflow
        run: rm .github/workflows/issue-232-clippy-fix.yml

      - name: Commit Clippy fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates .github/workflows/issue-232-clippy-fix.yml
          git commit -m "Apply Clippy fixes to game-data test migration"
          git push origin HEAD:agent/delete-game-data-compat
