name: Commit pending dock fixture fix

on:
  push:
    branches:
      - issue-251-client-fact-policy
    paths:
      - .github/workflows/issue-251-commit-fixture-fix.yml

permissions:
  contents: write

jobs:
  commit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixture patch
        run: python .github/apply_pending_dock_gdunit_fix.py

      - name: Verify patch shape
        run: |
          git diff --check
          grep -q 'class FakeWorldPresentation' client/test/main_test.gd
          grep -q '_main._presentation = FakeWorldPresentation.new()' client/test/main_test.gd

      - name: Commit clean fixture fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/apply_pending_dock_gdunit_fix.py
          git rm .github/workflows/issue-251-pending-dock-gdunit-fix.yml
          git rm .github/workflows/issue-251-commit-fixture-fix.yml
          git rm .github/gdunit-diagnostic.log
          git add client/test/main_test.gd
          git commit -m "Stabilize pending dock promotion regression tests"
          git push
