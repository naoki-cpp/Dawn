name: Apply pending capacitor fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-pending-capacitor-fix:
    if: github.head_ref == 'issue-251-client-fact-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-251-client-fact-policy
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Apply fix
        run: |
          python .github/apply_pending_cap_fix.py
          cargo fmt --all

      - name: Verify fix
        run: |
          cargo test -p dawn-client-core pending_active_ship_switch_pauses_capacitor_until_registration
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo fmt --all -- --check

      - name: Publish tested fix and remove temporary files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/apply_pending_cap_fix.py
          rm .github/workflows/issue-251-pending-cap-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(client): pause capacitor simulation during ship switch"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:issue-251-client-fact-policy
