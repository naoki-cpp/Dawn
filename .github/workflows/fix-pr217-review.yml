name: Fix PR 217 review

on:
  push:
    branches:
      - codex/deepen-transit-state-mutation

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix(sector): preserve Transit module boundaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deepen-transit-state-mutation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply review fixes
        run: python3 .github/scripts/fix_pr217_review.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run dawn-sector Clippy
        run: cargo clippy -p dawn-sector --all-targets -- -D warnings
      - name: Run dawn-sector tests
        run: cargo test -p dawn-sector
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dawn-sector/src/node/transit.rs docs/architecture/architecture-review/server.md
          git diff --cached --quiet && exit 0
          git commit -m "fix(sector): preserve Transit module boundaries"
          git push origin HEAD:codex/deepen-transit-state-mutation
