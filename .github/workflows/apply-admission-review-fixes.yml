name: Admission review patch source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Execute historical patch source
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess

          source = subprocess.check_output(
              [
                  "git",
                  "show",
                  "18a6bbcbecfdd4f2020fb1012490713f907e0a4e:.github/workflows/apply-admission-review-fixes.yml",
              ],
              text=True,
          )
          start = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line for line in lines
          )
          abort_start = script.index(
              "replace_once(\n    admission,\n    '''    pub fn abort<S: EventStore>"
          )
          abort_end = script.index("\nreplace_regex(", abort_start)
          abort_rewrite = (
              "replace_regex(\n"
              "    admission,\n"
              "    r'    pub fn abort<S: EventStore>\\(self, node: &mut SimulationNode<S>\\) \\{.*?\\n    }\\n',\n"
              "    '''    pub fn abort<S: EventStore>(self, node: &mut SimulationNode<S>) {\n"
              "        if matches!(self.origin, AdmissionOrigin::Fresh { .. }) {\n"
              "            node.abort_reserved_fresh_admission(self.ship_id);\n"
              "        }\n"
              "    }\n"
              "''',\n"
              ")"
          )
          script = script[:abort_start] + abort_rewrite + script[abort_end:]
          exec(compile(script, "<admission-review-fix>", "exec"))
          PY
