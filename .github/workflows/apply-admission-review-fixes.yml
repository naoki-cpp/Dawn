name: Apply admission review fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 260 && github.head_ref == 'agent/transactional-client-admission-253'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/transactional-client-admission-253
          fetch-depth: 0
          persist-credentials: false

      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, text: str) -> None:
              Path(path).write_text(text)

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:80]!r}")
              write(path, text.replace(old, new, 1))

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              text = read(path)
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected one occurrence, found {count}: {pattern[:100]!r}")
              write(path, new)

