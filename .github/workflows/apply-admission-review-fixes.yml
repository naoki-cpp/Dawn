name: Admission review patch source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Execute historical patch source
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess
          from pathlib import Path

          source = subprocess.check_output(
              [
                  "git",
                  "show",
                  "18a6bbcbecfdd4f2020fb1012490713f907e0a4e:.github/workflows/apply-admission-review-fixes.yml",
              ],
              text=True,
          )
          start = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY\n", start)
          output = []
          in_triple = False
          for raw_line in source[start:end].splitlines():
              if in_triple:
                  line = raw_line
              else:
                  line = raw_line[10:] if raw_line.startswith("          ") else raw_line
              output.append(line)
              if line.count("'''") % 2 == 1:
                  in_triple = not in_triple
          if in_triple:
              raise SystemExit("unterminated triple-quoted literal in historical patch")
          script = "\n".join(output)
          exec(compile(script, "<admission-review-fix>", "exec"))

          admission_path = Path("crates/dawn-sector/src/client_admission.rs")
          admission = admission_path.read_text()
          old_derive = "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\nenum AdmissionOrigin"
          new_derive = "#[derive(Debug, Clone, Copy, PartialEq)]\nenum AdmissionOrigin"
          if admission.count(old_derive) != 1:
              raise SystemExit("AdmissionOrigin derive marker missing or duplicated")
          admission_path.write_text(admission.replace(old_derive, new_derive, 1))

          snapshot_path = Path("crates/dawn-sector/src/node/snapshot_io.rs")
          snapshot = snapshot_path.read_text()
          marker = (
              "            population_cap: _,\n"
              "            // Independently durable in SQLite (ADR-0038), plus its cache.\n"
          )
          replacement = (
              "            population_cap: _,\n"
              "            // Fresh admission reservations exist only while this process is alive.\n"
              "            pending_fresh_admissions: _,\n"
              "            // Independently durable in SQLite (ADR-0038), plus its cache.\n"
          )
          if snapshot.count(marker) != 1:
              raise SystemExit("snapshot non-durable field marker missing or duplicated")
          snapshot_path.write_text(snapshot.replace(marker, replacement, 1))

          replay_path = Path("crates/dawn-sector/tests/client_admission_replay.rs")
          replay = replay_path.read_text()
          old_import = "use dawn_event_store::{store::EventStore, InMemoryEventStore};"
          new_import = "use dawn_event_store::InMemoryEventStore;"
          if replay.count(old_import) != 1:
              raise SystemExit("replay EventStore import marker missing or duplicated")
          replay_path.write_text(replay.replace(old_import, new_import, 1))

          production_path = Path("crates/dawn-sector-node/src/client_admission.rs")
          production = production_path.read_text()
          old_completion = "if let Some((session, committed)) = finish_admission(node, attempt, result) {"
          new_completion = "if let Some((session, _committed)) = finish_admission(node, attempt, result) {"
          if production.count(old_completion) != 1:
              raise SystemExit("production completion marker missing or duplicated")
          production_path.write_text(production.replace(old_completion, new_completion, 1))

          single_path = Path("crates/dawn-simulation/src/serve/single.rs")
          single = single_path.read_text()
          old_single_loop = "for (sess, committed) in drain_single_admission_completions(&mut node, &mut completion_rx) {"
          new_single_loop = "for (sess, _committed) in drain_single_admission_completions(&mut node, &mut completion_rx) {"
          if single.count(old_single_loop) != 1:
              raise SystemExit("single completion binding marker missing or duplicated")
          single = single.replace(old_single_loop, new_single_loop, 1)
          single_import = "use dawn_sector::dilation;\n"
          if single.count(single_import) != 1:
              raise SystemExit("single ServerMessage import marker missing or duplicated")
          single_path.write_text(single.replace(single_import, single_import + "use dawn_wire::ServerMessage;\n", 1))

          cluster_path = Path("crates/dawn-simulation/src/serve/cluster.rs")
          cluster = cluster_path.read_text()
          old_cluster_loop = "for (sector, sess, committed) in drain_cluster_admission_completions("
          new_cluster_loop = "for (sector, sess, _committed) in drain_cluster_admission_completions("
          if cluster.count(old_cluster_loop) != 1:
              raise SystemExit("cluster completion binding marker missing or duplicated")
          cluster = cluster.replace(old_cluster_loop, new_cluster_loop, 1)
          cluster_import = "use dawn_sector::transit;\n"
          if cluster.count(cluster_import) != 1:
              raise SystemExit("cluster ServerMessage import marker missing or duplicated")
          cluster_path.write_text(cluster.replace(cluster_import, cluster_import + "use dawn_wire::ServerMessage;\n", 1))
          PY
