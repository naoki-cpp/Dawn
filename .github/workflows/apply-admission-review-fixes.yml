name: Admission review patch source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Execute historical patch source
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess

          source = subprocess.check_output(
              [
                  "git",
                  "show",
                  "18a6bbcbecfdd4f2020fb1012490713f907e0a4e:.github/workflows/apply-admission-review-fixes.yml",
              ],
              text=True,
          )
          start = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY\n", start)
          output = []
          in_triple = False
          for raw_line in source[start:end].splitlines():
              if in_triple:
                  line = raw_line
              else:
                  line = raw_line[10:] if raw_line.startswith("          ") else raw_line
              output.append(line)
              if line.count("'''") % 2 == 1:
                  in_triple = not in_triple
          if in_triple:
              raise SystemExit("unterminated triple-quoted literal in historical patch")
          script = "\n".join(output)
          exec(compile(script, "<admission-review-fix>", "exec"))
          PY
