name: Windows playtest release

on:
  push:
    tags: ["playtest-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.97.1"
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:REF_TYPE -ne 'tag' -or $env:RELEASE_TAG -notmatch '^playtest-[0-9][A-Za-z0-9.-]{0,60}$') {
            throw 'Run this workflow on a playtest-* version tag.'
          }
      - name: Test packaging helpers
        run: python -m unittest discover -s scripts/tests
      - name: Build Windows ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_playtest.py --version "$env:RELEASE_TAG"
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem client/export -File | Where-Object { $_.Name -match '\.zip(\.sha256)?$' } | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) { throw 'Expected one ZIP and one checksum.' }
          gh release create "$env:RELEASE_TAG" --verify-tag --draft --prerelease --title "Dawn $env:RELEASE_TAG" --notes-file docs/process/playtest-download.md @assets
