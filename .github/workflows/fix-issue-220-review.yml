name: Apply issue 220 review fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-issue-220-review.yml
      - .github/fix-issue-220-review.py
      - .github/fix-issue-220-gdext.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/single-authority-game-data-catalog'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/single-authority-game-data-catalog
          fetch-depth: 0
          persist-credentials: true

      - name: Apply review fixes
        run: |
          python3 .github/fix-issue-220-review.py
          python3 .github/fix-issue-220-gdext.py

      - name: Format and validate
        run: |
          cargo fmt --all
          bash -n scripts/deploy-pi-cluster.sh
          cargo test --workspace

      - name: Commit implementation and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/fix-issue-220-review.yml \
            .github/fix-issue-220-review.py \
            .github/fix-issue-220-gdext.py
          git add \
            crates/dawn-sector/src/game_data/mod.rs \
            crates/dawn-sector/src/game_data/tests.rs \
            crates/dawn-sector/src/data_loader/mod.rs \
            crates/dawn-simulation/src/serve/mod.rs \
            crates/dawn-client-gdext/src/loadout_gd.rs \
            scripts/deploy-pi-cluster.sh \
            docs/architecture/entity-model.md \
            docs/architecture/game-data-catalog.md
          git commit -m "Address game-data catalog review findings"
          git push origin HEAD:agent/single-authority-game-data-catalog
