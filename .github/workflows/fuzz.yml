name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - "crates/dawn-wire/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "crates/dawn-wire/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
      - "Cargo.lock"
  schedule:
    # Monday 03:17 JST.
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dawn-wire:
    name: dawn-wire / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - decode_client_message
          - decode_server_message

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/dawn-wire-fuzz

      - name: Regenerate wire schema
        if: matrix.target == 'decode_client_message'
        run: |
          cargo run -p dawn-actor --example gen_wire_schema
          if ! git diff --quiet -- docs/architecture/wire-protocol.schema.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/architecture/wire-protocol.schema.json
            git commit -m "docs(wire): regenerate event schema"
            git push origin HEAD:agent/dawn-wire-fuzz
          fi

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          fuzz_seconds=30
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            fuzz_seconds=300
          fi
          cargo fuzz run "${TARGET}" -- \
            -max_total_time="${fuzz_seconds}" \
            -rss_limit_mb=2048 \
            -timeout=10

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
