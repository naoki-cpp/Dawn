name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - "crates/dawn-wire/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "crates/dawn-wire/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
      - "Cargo.lock"
  schedule:
    # Monday 03:17 JST.
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dawn-wire:
    name: dawn-wire / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - decode_client_message
          - decode_server_message

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: agent/dawn-wire-fuzz

      - name: Apply postcard optional-field fix
        if: matrix.target == 'decode_client_message'
        run: |
          file=crates/dawn-wire/src/server_event.rs
          test "$(grep -Fc '#[serde(skip_serializing_if = "Option::is_none", default)]' "$file")" -eq 2
          sed -i 's/#\[serde(skip_serializing_if = "Option::is_none", default)\]/#[serde(default)]/g' "$file"
          sed -i 's/; omitted for a$/; `None` for a/' "$file"
          sed -i 's/module_activated_event_without_a_target_omits_the_field/module_activated_event_without_a_target_has_none_target/' "$file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git rm .github/workflows/apply-wire-fuzz-fix.yml
          git commit -m "fix(dawn-wire): preserve optional fields in postcard"
          git push origin HEAD:agent/dawn-wire-fuzz

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          fuzz_seconds=30
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            fuzz_seconds=300
          fi
          cargo fuzz run "${TARGET}" -- \
            -max_total_time="${fuzz_seconds}" \
            -rss_limit_mb=2048 \
            -timeout=10

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
