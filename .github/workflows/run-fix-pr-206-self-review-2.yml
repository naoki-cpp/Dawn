name: Run PR 206 self-review fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 206
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: recoverable-sector-transit
          fetch-depth: 0
          persist-credentials: false

      - name: Extract and apply fix script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          lines = Path('.github/workflows/fix-pr-206-self-review-2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          code = textwrap.dedent('\n'.join(lines[start:end])) + '\n'
          helpers = '''def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              old = textwrap.dedent(old)
              new = textwrap.dedent(new)
              count = text.count(old)
              if count == 1:
                  p.write_text(text.replace(old, new, 1))
                  return
              if count > 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              pattern = r"\\s+".join(re.escape(token) for token in old.split())
              matches = list(re.finditer(pattern, text, flags=re.S))
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one whitespace-normalized match, found {len(matches)}")
              match = matches[0]
              p.write_text(text[:match.start()] + new + text[match.end():])

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              replacement = textwrap.dedent(replacement)
              new, count = re.subn(
                  pattern,
                  lambda match: match.expand(replacement),
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}")
              p.write_text(new)

          '''
          code, count = re.subn(
              r"def replace_once\(.*?(?=# Canonical retry snapshot)",
              lambda _: helpers,
              code,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('could not replace extracted helper functions')
          code = code.replace('import re\n', 'import re\nimport textwrap\n', 1)
          Path('/tmp/fix_pr_206.py').write_text(code)
          PY
          python3 /tmp/fix_pr_206.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          commands = Path('crates/dawn-sector/src/node/commands.rs')
          text = commands.read_text()
          text, count = re.subn(
              r'(\bStationId),\s*TransitCommand,',
              r'\1,',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'TransitCommand root import matches: {count}')
          if 'use dawn_core::commands::TransitCommand;' not in text:
              text, count = re.subn(
                  r'(\s+use crate::modules::MODULE_AFTERBURNER;\n)',
                  r'\1        use dawn_core::commands::TransitCommand;\n',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'TransitCommand module import anchors: {count}')
          commands.write_text(text)

          transit = Path('crates/dawn-sector/src/transit.rs')
          text = transit.read_text()
          text = text.replace('    use dawn_ecs::components::TackledComp;\n', '', 1)
          pattern = re.compile(
              r"\s*let entity = \*source\.ships\.index\.get\(&ship_id\)\.unwrap\(\);"
              r"\s*let _ = source\.world\.insert_one\("
              r"\s*entity,"
              r"\s*TackledComp \{"
              r"\s*tacklers: vec!\[ShipId::new\(NodeId\(9\), 1\)\],"
              r"\s*\},"
              r"\s*\);",
              re.S,
          )
          text, count = pattern.subn(
              '\n        source.set_tackled_by_for_test(\n            ship_id,\n            vec![ShipId::new(NodeId(9), 1)],\n        );',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'transit tackle fixture matches: {count}')
          transit.write_text(text)

          flow = Path('crates/dawn-sector/src/node/transit_flow.rs')
          text = flow.read_text()
          pattern = re.compile(
              r"(\s+pub\(crate\) fn is_ship_in_transit\(&self, ship_id: ShipId\) -> bool \{"
              r".*?"
              r"\n\s+\})",
              re.S,
          )
          helper = r'''\1

              #[cfg(test)]
              pub(crate) fn set_tackled_by_for_test(
                  &mut self,
                  ship_id: ShipId,
                  tacklers: Vec<ShipId>,
              ) {
                  let Some(&entity) = self.ships.index.get(&ship_id) else {
                      return;
                  };
                  let _ = self
                      .world
                      .remove_one::<dawn_ecs::components::TackledComp>(entity);
                  let _ = self.world.insert_one(
                      entity,
                      dawn_ecs::components::TackledComp { tacklers },
                  );
              }'''
          text, count = pattern.subn(helper, text, count=1)
          if count != 1:
              raise SystemExit(f'is_ship_in_transit helper matches: {count}')
          flow.write_text(text)
          PY

      - name: Format and test
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit fixes and remove one-shot workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/fix-pr-206-self-review-2.yml
          rm .github/workflows/run-fix-pr-206-self-review-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sector): close remaining transit recovery gaps"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:${GITHUB_HEAD_REF}
