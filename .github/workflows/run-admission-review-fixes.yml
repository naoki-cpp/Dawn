name: Run admission review fixes

on:
  push:
    branches:
      - agent/transactional-client-admission-253

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/transactional-client-admission-253
          fetch-depth: 0
          persist-credentials: false

      - name: Execute stored patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-admission-review-fixes.yml').read_text()
          start = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, '<admission-review-fix>', 'exec'))
          PY

      - name: Format and validate
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p dawn-sector -p dawn-sector-node -p dawn-simulation
          cargo test --workspace --all-targets

      - name: Commit fixes and remove helpers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-admission-review-fixes.yml
          git rm .github/workflows/run-admission-review-fixes.yml
          git rm .github/admission-review-fix-trigger
          git add crates docs
          git commit -m "fix(admission): close transactional review gaps"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/transactional-client-admission-253
