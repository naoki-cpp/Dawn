name: Issue 236 doc fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/issue-236-doc-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt
      - name: Correct stale Transit wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/dawn-sector/src/node/transit.rs')
          text = path.read_text()
          pattern = r"    /// Stage 1\.5 of a Sector Transit.*?(?=    /// Ack carries only the transfer identity\.)"
          replacement = '''    /// Finalize the source half of a Sector Transit by removing the frozen
              /// recovery copy and appending `SectorTransitCompleted` to the source log.
              /// Normal completion calls this only after a committed Ack matches the
              /// durable Request identity. The superseded-outgoing path also uses it
              /// before accepting the same Ship back into this Sector. Until either
              /// condition is durable, the Ship remains owned by `from` and frozen as
              /// `InTransit`, so a crash cannot leave both logs without a recoverable copy.
              ///
          '''
          text, count = re.subn(pattern, replacement, text, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one stale completion comment, found {count}')
          old_name = 'fn export_transit_snapshots_without_removing_the_ship_or_appending_an_event()'
          if text.count(old_name) != 1:
              raise SystemExit('expected one old export test name')
          text = text.replace(
              old_name,
              'fn export_transit_handoff_without_removing_the_ship_or_appending_an_event()',
          )
          old_comment = '''        // frozen (InTransit), until complete_outgoing_transit runs -- which
                  // only happens once this Sector observes its own Commit land.'''
          new_comment = '''        // frozen (InTransit), until a matching Ack is committed and
                  // complete_outgoing_transit finalizes the source half.'''
          if text.count(old_comment) != 1:
              raise SystemExit(f'expected one stale export comment, found {text.count(old_comment)}')
          path.write_text(text.replace(old_comment, new_comment))

          path = Path('crates/dawn-sector/src/transit/pipeline.rs')
          text = path.read_text()
          old = '''/// The durable route and canonical transit snapshot are reconstructed from the
          /// source EventStore and frozen ECS state, respectively.'''
          new = '''/// The durable route and canonical Transit handoff state are reconstructed from
          /// the source EventStore and frozen ECS state, respectively.'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale retry comment, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          cargo test -p dawn-sector transit
          git diff --check
      - name: Publish correction
        run: |
          rm -f .github/workflows/issue-236-doc-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clarify Transit handoff completion semantics'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
