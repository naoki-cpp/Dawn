# dawn-server sector-node configuration — Node 0 (Sector 0)
# Usage: sector-node config/node-0.toml

node_id    = 0
sector_id  = 0
ws_addr    = "0.0.0.0:7878"    # Godot clients connect here
control_addr = "0.0.0.0:7900"  # Shared peer control channel
bulk_addr    = "0.0.0.0:7910"  # Shared peer bulk channel
npc_ships  = 20
pop_cap    = 500

# Persistence (ADR-0049): the recovery journal is the sole durable source.
recovery_journal_path    = "data/node-0/recovery.log"
snapshot_path             = "data/node-0/snapshot.bin"
recovery_cold_path        = "data/node-0/recovery.cold.log"
checkpoint_interval_ticks = 600

[[peers]]
node_id   = 1
sector_id = 1
control_addr = "127.0.0.1:7901"
bulk_addr = "127.0.0.1:7911"
ws_addr   = "127.0.0.1:7879"

[[peers]]
node_id   = 2
sector_id = 2
control_addr = "127.0.0.1:7902"
bulk_addr = "127.0.0.1:7912"
ws_addr   = "127.0.0.1:7880"
