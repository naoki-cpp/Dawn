[package]
name    = "dawn-server"
version = "0.1.0"
edition = "2021"
description = "Shared production and local server composition for Dawn."
repository.workspace = true
publish.workspace     = true

[[bin]]
name = "simulate"
path = "src/main.rs"

[[bin]]
name = "sector-node"
path = "src/bin/sector-node.rs"

[dependencies]
dawn-core        = { path = "../dawn-core" }
dawn-storage = { path = "../dawn-storage" }
dawn-market      = { path = "../dawn-market" }
dawn-protocol        = { path = "../dawn-protocol" }
dawn-distributed   = { path = "../dawn-distributed" }
dawn-sector      = { path = "../dawn-sector" }
rand             = { workspace = true, features = ["small_rng"] }
tokio            = { workspace = true }
serde            = { workspace = true }
serde_json       = "1"
rusqlite         = { workspace = true }
anyhow           = "1"
thiserror        = { workspace = true }
toml             = { version = "1.1", features = ["parse"] }
tempfile         = "3"
futures-util     = "0.3"
tokio-tungstenite = "0.30"

[dev-dependencies]
tempfile = "3"
