[package]
name    = "dawn-actor"
version = "0.1.0"
edition = "2021"
description = "Client transport, protocol translation, and actor boundaries for Dawn."
repository.workspace = true
publish.workspace     = true

# dawn-actor must not depend on dawn-ecs or dawn-server.
# It provides Actor infrastructure used by upper layers, including the
# production WebSocket transport (WsServer / WsClientConnection) and the wire
# protocol (DomainEvent <-> JSON <-> ClientCommand) shared by all binaries.
[dependencies]
dawn-core         = { path = "../dawn-core" }
dawn-protocol         = { path = "../dawn-protocol" }
tokio             = { workspace = true }
thiserror         = { workspace = true }
serde_json        = "1"
futures-util      = "0.3"
tokio-tungstenite = "0.30"
anyhow            = "1"
schemars          = "1.2"

[dev-dependencies]
futures = { workspace = true }
