[package]
name    = "dawn-client-gdext"
version = "0.1.0"
edition = "2021"
description = "GDExtension binding exposing dawn-client-core to the Godot client (ADR-0040)."
repository.workspace = true
publish.workspace     = true

[lib]
crate-type = ["cdylib"]

# This crate is a thin adapter: it converts between Godot's Variant/GString/
# Dictionary types and dawn-client-core's plain Rust types. No domain logic
# lives here -- that stays in dawn-client-core so it's cargo-testable without
# a Godot runtime.
[dependencies]
dawn-client-core = { path = "../dawn-client-core" }
# api-4-6 pins the GDExtension API level to match the repo's pinned Godot
# build (.godot-version: 4.6.3-stable).
godot             = { version = "0.5", features = ["api-4-6"] }
serde_json        = "1"
