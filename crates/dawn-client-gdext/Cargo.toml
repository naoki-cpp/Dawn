[package]
name    = "dawn-client-gdext"
version = "0.1.0"
edition = "2021"
description = "GDExtension binding exposing dawn-client-core to the Godot client (ADR-0040)."
repository.workspace = true
publish.workspace     = true

[lib]
crate-type = ["cdylib"]

# This crate is a thin adapter: it converts between Godot values,
# dawn-client-core's plain Rust types, and typed dawn-wire outcomes. No domain
# logic lives here -- that stays in dawn-client-core so it's cargo-testable
# without a Godot runtime.
[dependencies]
dawn-core         = { path = "../dawn-core" }
dawn-client-core = { path = "../dawn-client-core" }
# Client->server wire schema only (ADR-0041) -- no transport/runtime
# dependency, unlike dawn-actor which also depends on this crate.
dawn-wire         = { path = "../dawn-wire" }
# api-4-6 pins the GDExtension API level to match the repo's pinned Godot
# build (.godot-version: 4.6.3-stable).
godot             = { version = "0.5", features = ["api-4-6"] }
serde_json        = "1"

[dev-dependencies]
# ADR-0042 contract test only: proves the real server's PlayerLoadoutJson
# (dawn_sector's build_player_loadout_json) still converts into
# dawn_client_core::PlayerLoadoutMsg via wire_to_loadout_msg. Dev-dependency
# only -- no runtime dependency edge, so this doesn't resurrect the
# previously-rejected dawn-proto shared-schema crate.
dawn-sector = { path = "../dawn-sector" }
