[package]
name    = "dawn-simulation"
version = "0.1.0"
edition = "2021"
description = "Runnable simulation, demos, and local server wiring for Dawn."
repository.workspace = true
publish.workspace     = true

[[bin]]
name = "simulate"
path = "src/main.rs"

[dependencies]
dawn-core        = { path = "../dawn-core" }
dawn-event-store = { path = "../dawn-event-store" }
dawn-market      = { path = "../dawn-market" }
dawn-actor       = { path = "../dawn-actor" }
dawn-wire        = { path = "../dawn-wire" }
dawn-consensus   = { path = "../dawn-consensus" }
dawn-replication = { path = "../dawn-replication" }
dawn-sector      = { path = "../dawn-sector" }
rand             = { workspace = true, features = ["small_rng"] }
tokio            = { workspace = true }
serde_json       = "1"
rusqlite         = { workspace = true }
tempfile         = "3"

[dev-dependencies]
tempfile = "3"
