[package]
name    = "dawn-market"
version = "0.1.0"
edition = "2021"
description = "Player-to-player Market: bid/ask order book + PlayerId Currency ledger, its own SQL authority independent of Sector tick determinism (ADR-0034 §4/§5/§6)."
repository.workspace = true
publish.workspace     = true

# dawn-market is a leaf crate, same DAG position as dawn-protocol: dawn-core (for
# PlayerId/ItemId/ShipId) + thiserror + rusqlite only. It must NOT depend on
# dawn-ecs/dawn-storage/dawn-sector -- ADR-0034 §4 deliberately keeps
# Market's own state (order book, Currency ledger, and settlement outbox)
# outside the Sector tick's determinism constraints (INV-001/002/005).
[dependencies]
dawn-core = { path = "../dawn-core" }
thiserror = { workspace = true }
rusqlite  = { workspace = true }
