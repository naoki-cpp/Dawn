[package]
name    = "dawn-sector"
version = "0.1.0"
edition = "2021"
description = "Authoritative sector simulation, ownership, transit, and snapshots for Dawn."
repository.workspace = true
publish.workspace     = true

[dependencies]
dawn-core        = { path = "../dawn-core" }
dawn-wire        = { path = "../dawn-wire" }
dawn-ecs         = { path = "../dawn-ecs" }
dawn-event-store = { path = "../dawn-event-store" }
dawn-consensus   = { path = "../dawn-consensus" }
rand             = { workspace = true, features = ["small_rng"] }
tokio            = { workspace = true }
postcard         = { workspace = true }
rusqlite         = { workspace = true }
serde            = { workspace = true }
tempfile         = "3"
toml             = { version = "1.1", features = ["parse"] }

[dev-dependencies]
tempfile = "3"
