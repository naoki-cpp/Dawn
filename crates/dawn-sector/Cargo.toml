[package]
name    = "dawn-sector"
version = "0.1.0"
edition = "2021"
description = "Authoritative sector simulation, ownership, transit, and snapshots for Dawn."
repository.workspace = true
publish.workspace     = true

[dependencies]
dawn-core        = { path = "../dawn-core" }
dawn-ecs         = { path = "../dawn-ecs" }
dawn-event-store = { path = "../dawn-event-store" }
dawn-consensus   = { path = "../dawn-consensus" }
rand             = { workspace = true, features = ["small_rng"] }
tokio            = { workspace = true }
postcard         = { workspace = true }
serde            = { workspace = true }
serde_json       = "1"
tempfile         = "3"
toml             = { version = "0.8", features = ["parse"] }

[dev-dependencies]
tempfile = "3"
