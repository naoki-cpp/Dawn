[package]
name    = "dawn-sector"
version = "0.1.0"
edition = "2021"
description = "Authoritative sector simulation, ownership, transit, and snapshots for Dawn."
repository.workspace = true
publish.workspace     = true

[dependencies]
dawn-core        = { path = "../dawn-core" }
dawn-protocol        = { path = "../dawn-protocol" }
dawn-ecs         = { path = "../dawn-ecs" }
dawn-storage = { path = "../dawn-storage" }
dawn-distributed   = { path = "../dawn-distributed" }
rand             = { workspace = true, features = ["small_rng"] }
tokio            = { workspace = true }
postcard         = { workspace = true }
rusqlite         = { workspace = true }
serde            = { workspace = true }
thiserror        = { workspace = true }
toml             = { version = "1.1", features = ["parse"] }

[dev-dependencies]
tempfile = "3"
