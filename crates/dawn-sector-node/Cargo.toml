[package]
name    = "dawn-sector-node"
version = "0.1.0"
edition = "2021"
description = "Production sector node binary and runtime wiring for Dawn."
repository.workspace = true
publish.workspace     = true

[[bin]]
name = "sector-node"
path = "src/main.rs"

[dependencies]
dawn-core        = { path = "../dawn-core" }
dawn-actor       = { path = "../dawn-actor" }
dawn-wire        = { path = "../dawn-wire" }
dawn-event-store = { path = "../dawn-event-store" }
dawn-sector      = { path = "../dawn-sector" }
dawn-consensus   = { path = "../dawn-consensus" }
dawn-replication = { path = "../dawn-replication" }
serde            = { workspace = true }
postcard         = { workspace = true }
rand             = { workspace = true }
tokio            = { workspace = true }
anyhow           = "1"
toml             = { version = "1.1", features = ["parse"] }
