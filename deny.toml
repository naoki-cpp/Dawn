[graph]
targets = []

[advisories]
version = 2
ignore = [
    # atomic-polyfill (unmaintained, RUSTSEC-2023-0089) is pulled in
    # transitively by postcard -> heapless 0.7. The advisory itself states no
    # safe upgrade is available (heapless 0.8+ drops atomic-polyfill, but
    # postcard 1.x still pins heapless ^0.7). Revisit when postcard bumps its
    # heapless requirement.
    "RUSTSEC-2023-0089",
]

[licenses]
version = 2
# Every dependency in the workspace as of this file's introduction resolves
# to a permissive license (MIT/Apache-2.0 family, BSD, Unlicense, Zlib,
# Unicode-3.0) -- confirmed via `cargo metadata` license fields. Anything
# outside this list should be a deliberate, reviewed decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # godot-rust (godot / godot-core / godot-ffi / godot-macros, ADR-0040's
    # dawn-client-gdext) is MPL-2.0. Weak (file-level) copyleft, not
    # project-wide -- and moot here regardless since this is a private,
    # unpublished game (see `[licenses.private]` below), not distributed
    # binaries subject to MPL's source-disclosure obligations. See
    # THIRD-PARTY-LICENSES.md for what changes if that stops being true.
    "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
# The workspace crates themselves (dawn-core, dawn-sector, etc.) have no
# `license` field and never will -- this is a private game, not something
# published to crates.io (see `publish = false` in workspace.package).
# Crates that declare `publish = false` are skipped by the license check
# instead of inventing a license string for code that isn't distributed.
ignore = true

[bans]
# Duplicate versions of a crate in the dependency tree are noisy but not
# inherently wrong (transitive deps often lag); warn instead of failing CI.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other via unversioned `{ path = ... }`
# entries (there's nothing to version -- they're not published), which
# `wildcards` would otherwise flag as unpinned dependencies.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
