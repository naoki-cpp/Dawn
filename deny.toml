[graph]
targets = []

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Every dependency in the workspace as of this file's introduction resolves
# to a permissive license (MIT/Apache-2.0 family, BSD, Unlicense, Zlib,
# Unicode-3.0) -- confirmed via `cargo metadata` license fields. Anything
# outside this list should be a deliberate, reviewed decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions of a crate in the dependency tree are noisy but not
# inherently wrong (transitive deps often lag); warn instead of failing CI.
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
