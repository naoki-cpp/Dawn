# Production Star System / Jump Gate / Celestial Body topology
#
# Scale: 1 unit = 1 m. Intra-system distances are gameplay-COMPRESSED (NOT real
# astronomical scale) and kept within the Sector volume (±50,000 units, see
# SectorBounds::DEFAULT_HALF) so f32 positions stay precise -- ADR-0028 chose
# f32 + per-sector local frames over i64/f64, since a "large world" is many
# Sectors (an integer index), not large coordinates. A system spans ~100 km of
# playable space and you cross it by Warp, not sublight cruise (as in EVE).
#
# Body radii are exaggerated for visibility/gameplay, not to scale. The "AU"
# labels below are loose flavor, not literal astronomical units. Travel time is
# set by Warp duration (ADR-0022 parametric warp), not by inflating distance.
#
# Edit this file and restart the server to change the layout (no recompile needed).

# -- Star Systems -------------------------------------------------------------

[[star_systems]]
id      = 0
name    = "Alpha"
sectors = [0]

[[star_systems]]
id      = 1
name    = "Beta"
sectors = [1]

[[star_systems]]
id      = 2
name    = "Gamma"
sectors = [2]

# -- Jump Gates ---------------------------------------------------------------
# Topology: Alpha (Sector 0) <-> Beta (Sector 1) <-> Gamma (Sector 2)
# Gates sit near the Sector edge (~49,000, just inside ±50,000) -- the boundary
# you cross to the next Sector.

[[jump_gates]]
id                = 0
from_sector       = 0
to_sector         = 1
position          = [49000.0, 0.0, 0.0]   # Alpha +X edge -> Beta
activation_radius = 2000.0

[[jump_gates]]
id                = 1
from_sector       = 1
to_sector         = 0
position          = [-49000.0, 0.0, 0.0]  # Beta -X edge -> Alpha
activation_radius = 2000.0

[[jump_gates]]
id                = 2
from_sector       = 1
to_sector         = 2
position          = [49000.0, 0.0, 0.0]   # Beta +X edge -> Gamma
activation_radius = 2000.0

[[jump_gates]]
id                = 3
from_sector       = 2
to_sector         = 1
position          = [-49000.0, 0.0, 0.0]  # Gamma -X edge -> Beta
activation_radius = 2000.0

