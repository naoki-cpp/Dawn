# Production Star System / Jump Gate / Celestial Body topology
#
# Scale: 1 unit = 1,000 km  ->  1 AU ~= 150,000 units
# Jump Gates sit at ~490,000 units (~3.3 AU, outer asteroid belt).
#
# Body radii are NOT to this scale (e.g. Helios at 15,000 units would be a
# tiny dot at system scale) -- they're sized up for visibility/gameplay, the
# same way EVE Online and most space games render celestial bodies far larger
# than their orbits would imply. Only orbital/gate *positions* use the scale
# above, so travel time stays meaningful (warp at 5,000 units/tick takes
# several seconds to cross a system instead of being instant).
#
# Edit this file and restart the server to change the layout (no recompile needed).

# -- Star Systems -------------------------------------------------------------

[[star_systems]]
id      = 0
name    = "Alpha"
sectors = [0]

[[star_systems]]
id      = 1
name    = "Beta"
sectors = [1]

[[star_systems]]
id      = 2
name    = "Gamma"
sectors = [2]

# -- Jump Gates ---------------------------------------------------------------
# Topology: Alpha (Sector 0) <-> Beta (Sector 1) <-> Gamma (Sector 2)

[[jump_gates]]
id                = 0
from_sector       = 0
to_sector         = 1
position          = [490000.0, 0.0, 0.0]   # Alpha +X edge -> Beta
activation_radius = 2000.0

[[jump_gates]]
id                = 1
from_sector       = 1
to_sector         = 0
position          = [-490000.0, 0.0, 0.0]  # Beta -X edge -> Alpha
activation_radius = 2000.0

[[jump_gates]]
id                = 2
from_sector       = 1
to_sector         = 2
position          = [490000.0, 0.0, 0.0]   # Beta +X edge -> Gamma
activation_radius = 2000.0

[[jump_gates]]
id                = 3
from_sector       = 2
to_sector         = 1
position          = [-490000.0, 0.0, 0.0]  # Gamma -X edge -> Beta
activation_radius = 2000.0

