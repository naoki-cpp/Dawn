# Production Star System / Jump Gate / Celestial Body topology
#
# Scale: 1 unit = 1 m. Intra-system distances are currently gameplay-COMPRESSED
# (UNITS_PER_AU = 200,000, not a real AU): a true-AU trial (2026-06-23) found
# that gates have no body near them in this topology (~2.26 AU to the nearest),
# so "rebase onto nearest anchor" doesn't keep the offset small there. Reverted
# pending a decision (ADR-0029 residual). The anchor architecture stays.
#
# Celestial body `position` and Gate `position` are both authored in AU and
# converted to units at load by UNITS_PER_AU (galaxy.rs); body/gate `radius`
# and `activation_radius` stay in units (visual size, not AU-coupled). Travel
# time is set by Warp duration (ADR-0022 parametric warp). To retry true scale,
# set UNITS_PER_AU to 1.495978707e11 and retune WARP_SPEED.
#
# Edit this file and restart the server to change the layout (no recompile needed).

# -- Star Systems -------------------------------------------------------------

[[star_systems]]
id      = 0
name    = "Alpha"
sectors = [0]

[[star_systems]]
id      = 1
name    = "Beta"
sectors = [1]

[[star_systems]]
id      = 2
name    = "Gamma"
sectors = [2]

# -- Jump Gates ---------------------------------------------------------------
# Topology: Alpha (Sector 0) <-> Beta (Sector 1) <-> Gamma (Sector 2)
# Gates sit near the Sector edge, authored in AU like celestial bodies
# (ADR-0029 residual: gates used to be fixed-unit, decoupled from UNITS_PER_AU --
# at true-AU scale that would have landed them on top of the star). 3.0 AU
# clears the outermost planet (Meridian, ~1.5 AU) and equals the old
# 600,000-unit edge at the current UNITS_PER_AU = 200,000 (no behavior change
# at compressed scale; scales correctly once UNITS_PER_AU flips to true AU).

[[jump_gates]]
id                = 0
from_sector       = 0
to_sector         = 1
position          = [3.0, 0.0, 0.0]   # Alpha +X edge -> Beta
activation_radius = 2000.0

[[jump_gates]]
id                = 1
from_sector       = 1
to_sector         = 0
position          = [-3.0, 0.0, 0.0]  # Beta -X edge -> Alpha
activation_radius = 2000.0

[[jump_gates]]
id                = 2
from_sector       = 1
to_sector         = 2
position          = [3.0, 0.0, 0.0]   # Beta +X edge -> Gamma
activation_radius = 2000.0

[[jump_gates]]
id                = 3
from_sector       = 2
to_sector         = 1
position          = [-3.0, 0.0, 0.0]  # Gamma -X edge -> Beta
activation_radius = 2000.0

# -- Celestial Bodies ---------------------------------------------------------
# spectral_type: 0.0=O/blue, 0.3=A/white-blue, 0.6=G/Sun-yellow, 0.85=K-M/orange-red
# Planets use spectral_type = 0.0 (not rendered as stars).

# Sector 0 (Alpha)
[[celestial_bodies]]
id            = 0
sector        = 0
kind          = "Star"
name          = "Helios"
position      = [0.0, 0.0, 0.0]
radius        = 15000.0
spectral_type = 0.60  # G-type, Sun-like yellow

[[celestial_bodies]]
