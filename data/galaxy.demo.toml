# Demo Star System / Jump Gate / Celestial Body topology
#
# Scale: 1 unit = 1 m. Orbital positions use true astronomical units and are
# converted by UNITS_PER_AU. Celestial radii are physical metres, so the client
# can derive angular size from radius and observer distance.
#
# Celestial body `position` and Gate `position` are both authored in AU and
# converted to metres at load by UNITS_PER_AU (galaxy.rs); celestial `radius`,
# gate `activation_radius`, and station `docking_radius` are physical metres.
# Travel time is set by Warp duration (ADR-0022 parametric warp).
#
# Edit this file and restart the server to change the layout (no recompile needed).

# -- Star Systems -------------------------------------------------------------

[[star_systems]]
id      = 0
name    = "Alpha"
sectors = [0]

[[star_systems]]
id      = 1
name    = "Beta"
sectors = [1]

[[star_systems]]
id      = 2
name    = "Gamma"
sectors = [2]

# -- Jump Gates ---------------------------------------------------------------
# Topology: Alpha (Sector 0) <-> Beta (Sector 1) <-> Gamma (Sector 2)
# Gates sit just off whichever body anchors that side of the route (each
# offset ~0.028 AU from its anchor body, in a distinct direction per gate so
# the two gates sharing a sector don't collide), authored in AU like celestial
# bodies (ADR-0029 residual). A 2026-06-23 true-AU trial found that the old
# "gates float ~3 AU out, no body nearby" layout breaks "rebase onto the
# nearest anchor" -- the nearest body was still ~2.26 AU away, which is itself
# too far for the offset to stay f32-precise. Placing gates near a body keeps
# the post-rebase offset small (the whole point of an anchor) once true AU
# reactivates; at the current compressed scale this is a pure repositioning
# (no precision difference, since everything is f32-fine either way).

[[jump_gates]]
id                = 0
from_sector       = 0
to_sector         = 1
position          = [-0.72, 0.0, -1.32]   # Alpha: just off Meridian -> Beta
activation_radius = 2000.0

[[jump_gates]]
id                = 1
from_sector       = 1
to_sector         = 0
position          = [-0.74, 0.0, 0.26]    # Beta: just off Haven -> Alpha
activation_radius = 2000.0

[[jump_gates]]
id                = 2
from_sector       = 1
to_sector         = 2
position          = [-0.70, 0.0, 0.22]    # Beta: just off Haven (other side) -> Gamma
activation_radius = 2000.0

[[jump_gates]]
id                = 3
from_sector       = 2
to_sector         = 1
position          = [0.72, 0.0, -0.58]    # Gamma: just off Bastion -> Beta
activation_radius = 2000.0

