# Demo Star System / Jump Gate / Celestial Body topology
#
# Scale: 1 unit = 1 m. Intra-system distances are currently gameplay-COMPRESSED
# (UNITS_PER_AU = 200,000, not a real AU): the real-AU activation was reverted to a
# compressed base per the ADR-0029 review (finish anchor assignment + AoI + client
# coordinate redesign before reactivating). The anchor architecture stays.
#
# Celestial body `position` is authored in AU and converted at load by
# UNITS_PER_AU (galaxy.rs). Gate `position` and body `radius` stay in units. Travel
# time is set by Warp duration (ADR-0022 parametric warp). To reactivate true scale,
# set UNITS_PER_AU to 1.495978707e11 and retune WARP_SPEED.
#
# Edit this file and restart the server to change the layout (no recompile needed).

# -- Star Systems -------------------------------------------------------------

[[star_systems]]
id      = 0
name    = "Alpha"
sectors = [0]

[[star_systems]]
id      = 1
name    = "Beta"
sectors = [1]

[[star_systems]]
id      = 2
name    = "Gamma"
sectors = [2]

# -- Jump Gates ---------------------------------------------------------------
# Topology: Alpha (Sector 0) <-> Beta (Sector 1) <-> Gamma (Sector 2)
# Gates sit near the Sector edge (~600,000, just inside ±700,000) -- the
# boundary you cross to the next Sector.

[[jump_gates]]
id                = 0
from_sector       = 0
to_sector         = 1
position          = [600000.0, 0.0, 0.0]   # Alpha +X edge -> Beta
activation_radius = 2000.0

[[jump_gates]]
id                = 1
from_sector       = 1
to_sector         = 0
position          = [-600000.0, 0.0, 0.0]  # Beta -X edge -> Alpha
activation_radius = 2000.0

[[jump_gates]]
id                = 2
from_sector       = 1
to_sector         = 2
position          = [600000.0, 0.0, 0.0]   # Beta +X edge -> Gamma
activation_radius = 2000.0

[[jump_gates]]
id                = 3
from_sector       = 2
to_sector         = 1
position          = [-600000.0, 0.0, 0.0]  # Gamma -X edge -> Beta
activation_radius = 2000.0

# -- Celestial Bodies ---------------------------------------------------------
# spectral_type: 0.0=O/blue, 0.3=A/white-blue, 0.6=G/Sun-yellow, 0.85=K-M/orange-red
# Planets use spectral_type = 0.0 (not rendered as stars).

# Sector 0 (Alpha)
[[celestial_bodies]]
id            = 0
sector        = 0
kind          = "Star"
name          = "Helios"
position      = [0.0, 0.0, 0.0]
radius        = 15000.0
spectral_type = 0.60  # G-type, Sun-like yellow

[[celestial_bodies]]
id            = 1
sector        = 0
kind          = "Planet"
name          = "Forge"
position      = [0.8, 0.0, 0.5]  # AU; inner, +X/+Z (clear of the star)
radius        = 8000.0
spectral_type = 0.0

[[celestial_bodies]]
id            = 6
sector        = 0
kind          = "Planet"
name          = "Meridian"
position      = [-0.7, 0.0, -1.3]  # AU; outer, opposite side of the star from Forge
radius        = 9000.0
spectral_type = 0.0

# Sector 1 (Beta)
[[celestial_bodies]]
id            = 2
sector        = 1
kind          = "Star"
name          = "Aegis"
