# ============================================================
# modules.toml — module balance data
#
# Loaded at server startup. No rebuild needed to adjust values.
#
# kind: "Weapon" | "ShieldBooster" | "ArmorRepairer" | "Propulsion" | "Sensor" | "Rig"
# slot: "High" | "Mid" | "Low" | "Rig"
# activation_mode: "Active" | "Passive"
#
# cap_cost_per_cycle — capacitor consumed at the start of each cycle (GJ)
# cycle_time_ticks   — ticks per cycle. 0 = Passive (not used)
#
# stat_delta (omitted fields default to 0 / identity):
#   speed_multiplier   — multiplicative max-speed bonus (default 1.0).
#                        Applied ONLY when module is active (AB / MWD).
#   mass_add           — hull mass increase (kg, default 0).
#                        Applied PASSIVELY from ALL fitted slots even when OFF.
#                        Oversized AB trade-off: huge mass_add = sluggish align always.
#   max_shield_add, max_armor_add, max_hull_add
#   weapon_damage_add, weapon_range_add, weapon_cooldown_add
#   tracking_speed_add, falloff_range_add
#   lock_time_add, max_locks_add
#   cap_max_add, cap_recharge_add
#
# Cap balance guide (Magpie: recharge 8 GJ/tick → 80 GJ/10 ticks):
#   Small Railgun (60 GJ/10 ticks):  gun alone  → +20 GJ surplus (sustainable)
#   1MN AB       (100 GJ/10 ticks): AB alone    → −20 GJ deficit (drains slowly)
#   Gun + AB     (160 GJ/10 ticks): →            −80 GJ/cycle (cap dry in ~37 ticks ≈ 3.7 s)
#
# Propulsion formula (ADR-0023):
#   τ = (hull_mass + Σ mass_add) × inertia_modifier / MASS_SCALE
#   α = 1 − exp(−1 / τ)     per-tick smoothing factor
#   Vmax = base_max_speed × Π(active speed_multiplier)
#   align_ticks ≈ 1.386 × τ
# ============================================================

# ── Weapons (High / Active) ──────────────────────────────────

[[modules]]
id                 = 1
name               = "Small Railgun I"
kind               = "Weapon"
slot               = "High"
activation_mode    = "Active"
cap_cost_per_cycle = 60.0
cycle_time_ticks   = 10

[modules.stat_delta]
weapon_damage_add  = 25.0
weapon_range_add   = 3000.0  # optimal range
falloff_range_add  = 2000.0  # hit chance halves at optimal + falloff
tracking_speed_add = 0.035   # rad/tick

# ----

