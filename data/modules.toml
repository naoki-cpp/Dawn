# ============================================================
# modules.toml — モジュールバランスデータ
#
# サーバー起動時に読み込まれる。リビルド不要で調整可能。
#
# kind: "Weapon" | "ShieldBooster" | "ArmorRepairer" | "Propulsion" | "Sensor" | "Rig"
# slot: "High" | "Mid" | "Low" | "Rig"
# activation_mode: "Active" | "Passive"
#
# cap_cost_per_cycle — サイクル開始時に1回消費するキャパシタ量 (GJ)
# cycle_time_ticks   — 1サイクルの長さ (Tick)。0 = Passive（適用なし）
#
# stat_delta（省略したフィールドはすべて 0）:
#   max_speed_add, thrust_add, max_shield_add, max_armor_add, max_hull_add
#   weapon_damage_add, weapon_range_add, weapon_cooldown_add
#   lock_time_add, max_locks_add
#   cap_max_add, cap_recharge_add
#
# Cap バランスガイド（フリゲート: recharge 10 GJ/tick → 100 GJ/10tick）:
#   Small Railgun (60 GJ/10tick):  gun alone → +40 GJ/cycle (持続可能)
#   1MN AB       (80 GJ/10tick):  AB  alone → +20 GJ/cycle (持続可能)
#   Gun + AB     (140 GJ/10tick): → -40 GJ/cycle (12サイクル≒120tick≈12秒で枯渇)
# ============================================================

# ── 武器（High / Active）────────────────────────────────────

[[modules]]
id                 = 1
name               = "Small Railgun I"
kind               = "Weapon"
slot               = "High"
activation_mode    = "Active"
cap_cost_per_cycle = 60.0
cycle_time_ticks   = 10

[modules.stat_delta]
weapon_damage_add  = 25.0
weapon_range_add   = 1500.0  # optimal range
falloff_range_add  = 1000.0  # hit chance halves at 2500 u
tracking_speed_add = 0.035   # rad/tick — hits a frigate (sig=40) orbiting at ~500u/tick at 1000u range
                              # angular=0.5/1000=0.0005... actually: perp=500,d=1000 → ang=0.5
                              # hit_chance = 0.5^((0.5/(0.035*40))^2) = 0.5^(0.357^2) ≈ 0.91 at 1000u
                              # at 500u: ang=500/500=1.0 → 0.5^((1/(0.035*40))^2)=0.5^(0.714^2)≈0.70

# ----

