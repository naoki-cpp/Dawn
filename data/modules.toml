# ── Propulsion (Mid / Active) ────────────────────────────────

[[modules]]
id                 = 5
name               = "1MN Afterburner"
kind               = "Propulsion"
slot               = "Mid"
activation_mode    = "Active"
cap_cost_per_cycle = 100.0  # 10 GJ/tick — drains Magpie (8 GJ/tick recharge) when on
cycle_time_ticks   = 10

[modules.stat_delta]
# When ON:  Vmax = base_max_speed × 2.35 (frigate 400 → 940 u/tick)
# mass_add: 0 — standard size AB adds no extra hull mass.
#           Align time is unchanged from hull mass × inertia alone.
speed_multiplier = 2.35
mass_add         = 0.0

# ----

[[modules]]
id                 = 10
name               = "10MN Afterburner"
kind               = "Propulsion"
slot               = "Mid"
activation_mode    = "Active"
cap_cost_per_cycle = 150.0
cycle_time_ticks   = 10

[modules.stat_delta]
# Oversized AB trade-off (ADR-0023):
#   When ON:  Vmax = base_max_speed × 2.35 (same multiplier — speed when burning is great)
#   PASSIVE:  mass_add = 8,000,000 kg — even when OFF the AB is physically bolted on.
#             Magpie hull 12M + 8M = 20M total → τ = 20M × 0.3 / 100_000 = 60 ticks
#             → align ≈ 83 ticks ≈ 8.3 s (nearly 3× longer than bare hull's 5 s).
#   Trade-off: devastating speed when ON; terrible agility always.
speed_multiplier = 2.35
mass_add         = 8_000_000.0

