# ============================================================
# modules.toml — モジュールバランスデータ
#
# サーバー起動時に読み込まれる。リビルド不要で調整可能。
#
# kind: "Weapon" | "ShieldBooster" | "ArmorRepairer" | "Propulsion" | "Sensor" | "Rig"
# slot: "High" | "Mid" | "Low" | "Rig"
# activation_mode: "Active" | "Passive"
#
# stat_delta（省略したフィールドはすべて 0）:
#   max_speed_add       — 最大速度加算
#   thrust_add          — 推力加算
#   max_shield_add      — シールドHP加算
#   max_armor_add       — アーマーHP加算
#   max_hull_add        — ハルHP加算
#   weapon_damage_add   — 武器ダメージ加算
#   weapon_range_add    — 武器射程加算 (units)
#   weapon_cooldown_add — 武器クールダウン加算 (Tick, 負=短縮)
#   lock_time_add       — ロック時間加算 (Tick, 負=短縮)
#   max_locks_add       — 同時ロック上限加算
# ============================================================

# ── 武器（High / Active）────────────────────────────────────

[[modules]]
id              = 1
name            = "Small Railgun I"
kind            = "Weapon"
slot            = "High"
activation_mode = "Active"

[modules.stat_delta]
weapon_damage_add = 25.0
weapon_range_add  = 1500.0

