# ============================================================
# ship_types.toml — 船種バランスデータ
#
# サーバー起動時に読み込まれる。リビルド不要で調整可能。
# ファイルが見つからない場合はハードコードのデフォルトにフォールバック。
#
# クラス: "Frigate" | "Cruiser" | "Battleship"
# slot_layout: { high, mid, low, rig }
# base_stats:
#   max_speed        — 最大速度 (units/tick)
#   thrust_magnitude — 加速度 (units/tick²)。0 = NPC等速
#   max_shield       — シールド最大HP
#   max_armor        — アーマー最大HP
#   max_hull         — ハル最大HP
#   lock_time        — ロック完了Tick数
#   max_locks        — 同時ロック上限
# ============================================================

# ── NPC 船種 ─────────────────────────────────────────────────

[[ship_types]]
id    = 1
name  = "NPC Frigate"
class = "Frigate"

[ship_types.slot_layout]
high = 3
mid  = 3
low  = 2
rig  = 3

[ship_types.base_stats]
max_speed        = 400.0
thrust_magnitude = 0.0
max_shield       = 200.0
max_armor        = 150.0
max_hull         = 150.0
lock_time        = 5
max_locks        = 1

