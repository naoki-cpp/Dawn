# ============================================================
# ship_types.toml — 船種バランスデータ
#
# サーバー起動時に読み込まれる。リビルド不要で調整可能。
# ファイルが見つからない場合はハードコードのデフォルトにフォールバック。
#
# クラス: "Frigate" | "Cruiser" | "Battleship"
# slot_layout: { high, mid, low, rig }
# base_stats:
#   max_speed             — 最大速度 (units/tick)
#   thrust_magnitude      — 加速度 (units/tick²)。0 = NPC等速
#   max_shield            — シールド最大HP
#   max_armor             — アーマー最大HP
#   max_hull              — ハル最大HP
#   lock_time             — ロック完了Tick数
#   max_locks             — 同時ロック上限
#   cap_max               — キャパシタ容量 (GJ)
#   cap_recharge_per_tick — キャパシタ回復量 (GJ/tick)
#
# Cap バランスガイド:
#   フリゲート: Small Railgun (12) + AB (8) = 20/tick → recharge 10 → slow drain
#               Small Railgun alone (12) → recharge 10 → slow drain
#               どちらかを切る判断が必要
#   クルーザー: Medium Railgun (18) alone → recharge 18 → 持続可能
#               + AB (16) → drain → 管理が必要
# ============================================================

# ── NPC 船種 ─────────────────────────────────────────────────

[[ship_types]]
id    = 1
name  = "NPC Frigate"
class = "Frigate"

[ship_types.slot_layout]
high = 3
mid  = 3
low  = 2
rig  = 3

[ship_types.base_stats]
max_speed             = 400.0
thrust_magnitude      = 0.0
max_shield            = 200.0
max_armor             = 150.0
max_hull              = 150.0
lock_time             = 5
max_locks             = 1
cap_max               = 300.0
cap_recharge_per_tick = 6.0    # 2%/tick: Small Railgun (12) > recharge → slow drain

