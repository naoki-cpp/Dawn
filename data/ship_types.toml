# ============================================================
# ship_types.toml — authoritative ship balance data
#
# Required at server startup. Missing or invalid data is a fatal startup error.
# No Rust balance fallback exists.
#
# class: "Frigate" | "Cruiser" | "Battleship"
# buildable: whether players may build this packaged hull
# slot_layout: { high, mid, low, rig }
# base_stats:
#   max_speed             — base max speed without modules (units/tick)
#   mass                  — hull mass (kg). Affects Vmax formula and align time.
#   inertia_modifier      — controls align time only (lower = more agile).
#                           align_time_ticks ≈ 1.386 × mass × inertia / MASS_SCALE
#                           MASS_SCALE = 100_000
#   max_shield / max_armor / max_hull — HP layers
#   lock_time             — ticks to complete lock-on
#   max_locks             — simultaneous lock limit
#   cap_max               — capacitor pool (GJ)
#   cap_recharge_per_tick — capacitor recovery (GJ/tick)
#   sig_radius            — signature radius (units). Larger = easier to hit.
#
# Align time guide (τ = mass × inertia / 100_000, align ≈ 1.386τ ticks):
#   Magpie  mass=12M inertia=0.3 → τ=36  → align≈50tick≈5s
#   Frigate mass=1.5M inertia=0.4 → τ=6  → align≈8tick≈0.8s
#   Cruiser mass=30M inertia=0.25 → τ=75 → align≈104tick≈10.4s
# ============================================================

# ── NPC ship types ─────────────────────────────────────────

[[ship_types]]
id        = 1
name      = "NPC Frigate"
class     = "Frigate"
buildable = false

[ship_types.slot_layout]
high = 3
mid  = 3
low  = 2
rig  = 3

[ship_types.base_stats]
max_speed             = 400.0
mass                  = 1_500_000.0   # τ=6 tick, align≈0.8s
inertia_modifier      = 0.4
max_shield            = 200.0
max_armor             = 150.0
max_hull              = 150.0
lock_time             = 5
max_locks             = 1
cap_max               = 300.0
cap_recharge_per_tick = 6.0
sig_radius            = 40.0

