# ── Voral Drift 船種 ─────────────────────────────────────────

[[ship_types]]
id    = 7
name  = "Magpie"
class = "Frigate"

[ship_types.slot_layout]
high = 2   # 小型武装 1 門 + ユーティリティ
mid  = 4   # AB + Fold ディスラプター + Web + 予備
low  = 2
rig  = 3

[ship_types.base_stats]
max_speed             = 700.0  # クラスター最速フリゲート：タックラーの本分
thrust_magnitude      = 65.0   # 高い加速度。逃げ・追いの判断が常に求められる
max_shield            = 200.0  # シールドは薄い。被弾前に動け、がコンセプト
max_armor             = 120.0
max_hull              = 100.0
lock_time             = 2      # 素早いロック。ターゲット切り替えが得意
max_locks             = 2
cap_max               = 350.0
cap_recharge_per_tick = 8.0    # AB (8) = 持続可能; + Small Railgun (12) = drain 12/tick
                                # → 武装か推進かを常に選ぶ設計（タックラーらしいトレードオフ）

