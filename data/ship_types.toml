# ── Voral Drift ship types ───────────────────────────────────

[[ship_types]]
id        = 7
name      = "Magpie"
class     = "Frigate"
buildable = true

[ship_types.slot_layout]
high = 2   # small weapon + utility
mid  = 4   # AB + Fold Disruptor + Web + spare
low  = 2
rig  = 3

[ship_types.base_stats]
max_speed             = 400.0          # fastest frigate in the cluster: tackler's role
mass                  = 12_000_000.0  # τ=36 tick → align≈5s. Sluggish for its size.
inertia_modifier      = 0.3            # Oversized AB mass penalty hurts here.
max_shield            = 200.0          # thin shield: move before taking hits
max_armor             = 120.0
max_hull              = 100.0
lock_time             = 2              # fast lock: good at switching targets
max_locks             = 2
cap_max               = 350.0
cap_recharge_per_tick = 8.0            # AB (100 GJ / 10 tick = 10/tick) > recharge → drain
                                        # gun alone (60 GJ / 10 tick = 6/tick) → sustainable
sig_radius            = 35.0

