[workspace]
members = [
    "crates/dawn-core",
    "crates/dawn-protocol",
    "crates/dawn-client-core",
    "crates/dawn-client-gdext",
    "crates/dawn-ecs",
    "crates/dawn-storage",
    "crates/dawn-distributed",
    "crates/dawn-market",
    "crates/dawn-sector",
    "crates/dawn-server",
]
resolver = "2"

# Keep local Rust artifacts bounded. Full debug info is disproportionately
# large for the workspace and is not needed for normal tests; line tables keep
# native backtraces actionable. Incremental caches are especially expensive for
# the GDExtension and server crates and are easy to rebuild when needed.
[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.release]
strip = "symbols"

[workspace.package]
repository = "https://github.com/naoki-cpp/Dawn"
# This is a private game workspace, not a library ecosystem -- none of these
# crates are meant to be published to crates.io.
publish = false

[workspace.dependencies]
serde      = { version = "1", features = ["derive", "rc"] }
thiserror  = "2"
schemars   = "1.2"
hecs       = "0.11"
rand       = "0.8"
tokio      = { version = "1", features = ["full"] }
futures    = "0.3"
postcard   = { version = "1", features = ["use-std"] }
rusqlite   = { version = "0.40", features = ["bundled"] }
