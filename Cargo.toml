[workspace]
members = [
    "crates/dawn-core",
    "crates/dawn-client-core",
    "crates/dawn-ecs",
    "crates/dawn-event-store",
    "crates/dawn-actor",
    "crates/dawn-consensus",
    "crates/dawn-replication",
    "crates/dawn-sector",
    "crates/dawn-simulation",
    "crates/dawn-sector-node",
]
resolver = "2"

[workspace.package]
repository = "https://github.com/naoki-cpp/Dawn"
# This is a private game workspace, not a library ecosystem -- none of these
# crates are meant to be published to crates.io.
publish = false

[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
thiserror  = "1"
hecs       = "0.10"
rand       = "0.8"
tokio      = { version = "1", features = ["full"] }
futures    = "0.3"
postcard   = { version = "1", features = ["use-std"] }
rusqlite   = { version = "0.31", features = ["bundled"] }
